<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human History Timeline</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d1a;
      --surface:  #16162a;
      --surface2: #1e1e38;
      --border:   #2c2c4e;
      --text:     #e6e6f0;
      --muted:    #7a7a9a;
      --accent:   #7c83ff;
      --panel-w:  380px;
      --map-h:    240px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }
    body { display: flex; flex-direction: column; }

    /* ── Header ───────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 9px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .header-title h1 { font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
    .header-title p  { font-size: 0.64rem; color: var(--muted); margin-top: 1px; }
    .era-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .era-btn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--muted); border-radius: 5px; padding: 3px 10px;
      font-size: 0.68rem; cursor: pointer; transition: all 0.12s; white-space: nowrap;
    }
    .era-btn:hover { border-color: var(--accent); color: var(--text); }
    .zoom-btns { display: flex; gap: 3px; margin-left: auto; }
    .zoom-btn {
      width: 28px; height: 26px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 5px; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
    }
    .zoom-btn:hover { background: var(--accent); border-color: var(--accent); }

    /* ── Scale info bar ───────────────────────── */
    .scale-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 18px;
      background: var(--surface2); border-bottom: 1px solid var(--border);
      font-size: 0.65rem; color: var(--muted); flex-shrink: 0; gap: 12px;
    }
    .scale-bar strong { color: var(--accent); }

    /* ── Category legend ──────────────────────── */
    .legend-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 18px;
      background: var(--surface2); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }
    .legend-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
    .legend-items { display: flex; gap: 6px; flex-wrap: wrap; }
    .legend-item {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.64rem; color: var(--muted); cursor: pointer;
      padding: 2px 7px; border-radius: 3px; border: 1px solid transparent;
      transition: all 0.12s; white-space: nowrap;
    }
    .legend-item:hover { border-color: var(--border); color: var(--text); }
    .legend-item.active { border-color: currentColor; color: var(--text); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Main ─────────────────────────────────── */
    .main {
      flex: 1; display: flex; overflow: hidden;
      position: relative; min-height: 0;
    }

    .left-col {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }

    /* ── Map ──────────────────────────────────── */
    #map {
      height: var(--map-h);
      flex-shrink: 0;
      border-bottom: 2px solid var(--border);
      background: #0a0a14;
      position: relative;
    }
    .map-hint-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13,13,26,0.72);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.68rem;
      color: var(--muted);
      pointer-events: none;
      z-index: 500;
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .map-hint-overlay.hidden { opacity: 0; }

    /* Leaflet dark tweaks */
    .leaflet-container { background: #0a0a14 !important; }
    .leaflet-control-attribution { display: none !important; }
    .leaflet-bar a {
      background: var(--surface2) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }
    .leaflet-bar a:hover { background: var(--surface) !important; }

    /* Pulsing marker */
    .hist-marker {
      width: 14px; height: 14px;
      border-radius: 50%;
      position: relative;
    }
    .hist-marker::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.45;
      animation: pulse-ring 1.5s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.45; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    /* ── Canvas ───────────────────────────────── */
    .canvas-area {
      flex: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0;
    }
    #c { display: block; cursor: grab; }

    /* ── Hint ─────────────────────────────────── */
    .hint {
      position: absolute; bottom: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.55);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 4px 14px; font-size: 0.63rem; color: var(--muted);
      pointer-events: none; white-space: nowrap;
    }

    /* ── Tooltip ──────────────────────────────── */
    #tooltip {
      position: fixed; z-index: 200;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 13px; max-width: 240px;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      pointer-events: none; opacity: 0; transition: opacity .1s;
    }
    #tooltip.show { opacity: 1; }
    #tooltip h4 { font-size: .8rem; font-weight: 600; margin-bottom: 2px; }
    #tooltip .tt-yr  { font-size: .66rem; color: var(--muted); margin-bottom: 3px; }
    #tooltip .tt-desc { font-size: .69rem; color: var(--muted); line-height: 1.4; }

    /* ── Detail Panel ─────────────────────────── */
    #panel {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: var(--panel-w);
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transform: translateX(var(--panel-w));
      transition: transform .22s ease;
      overflow: hidden;
      z-index: 50;
      box-shadow: -4px 0 24px rgba(0,0,0,.45);
    }
    #panel.open { transform: translateX(0); }
    .ph {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    }
    .ph h2 { font-size: .95rem; font-weight: 700; line-height: 1.3; flex: 1; }
    .ph-close { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 0 0 0 10px; line-height: 1; }
    .ph-close:hover { color: var(--text); }
    .pb { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .pmeta { display: flex; flex-wrap: wrap; gap: 6px; }
    .mtag { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; font-size: .63rem; color: var(--muted); }
    .pdesc { font-size: .8rem; line-height: 1.65; color: var(--text); }
    .pdetail { font-size: .74rem; line-height: 1.7; color: var(--muted); }
    .psect { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 5px; }
    .map-loc-tag { font-size: .64rem; color: var(--accent); display: flex; align-items: center; gap: 4px; margin-top: -4px; }
    .rel-list { display: flex; flex-direction: column; gap: 5px; }
    .rel-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; padding: 7px 10px; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: border-color .12s;
    }
    .rel-item:hover { border-color: var(--accent); }
    .rel-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .rel-name { font-size: .72rem; font-weight: 500; }
    .rel-yr   { font-size: .62rem; color: var(--muted); }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 600px) {
      :root { --panel-w: 100vw; --map-h: 180px; }
      .era-btns { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>🌍 Human History Timeline</h1>
    <p>300,000 BCE → Present · Scroll to zoom · Drag to pan · Click events for details</p>
  </div>
  <div class="era-btns" id="eraBtns"></div>
  <div class="zoom-btns">
    <button class="zoom-btn" id="btnZoomIn"  title="Zoom in (+)">+</button>
    <button class="zoom-btn" id="btnZoomOut" title="Zoom out (−)">−</button>
  </div>
</header>

<div class="scale-bar">
  <div id="scaleRange"></div>
  <span id="scaleCount"></span>
</div>

<div class="legend-bar">
  <span class="legend-label">Category:</span>
  <div class="legend-items" id="legendItems"></div>
</div>

<div class="main">
  <div class="left-col">
    <div id="map">
      <div class="map-hint-overlay" id="mapHint">🗺 Click an event on the timeline to see its location</div>
    </div>
    <div class="canvas-area" id="canvasArea">
      <canvas id="c"></canvas>
      <div class="hint">🖱 Scroll to zoom · Left or middle drag to pan · Click events for details</div>
    </div>
  </div>

  <div id="panel">
    <div class="ph">
      <h2 id="panelTitle"></h2>
      <button class="ph-close" id="panelClose">✕</button>
    </div>
    <div class="pb">
      <div class="pmeta"   id="panelMeta"></div>
      <div class="map-loc-tag" id="panelLoc"></div>
      <p class="pdesc"     id="panelDesc"></p>
      <p class="pdetail"   id="panelDetail"></p>
      <div id="panelRel"></div>
    </div>
  </div>
</div>

<div id="tooltip">
  <h4 id="ttTitle"></h4>
  <div class="tt-yr"   id="ttYear"></div>
  <div class="tt-desc" id="ttDesc"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════════════════════════════

const MIN_YEAR = -300000, MAX_YEAR = 2026;

const CATS = {
  biology:     { label: 'Biology & Evolution',  color: '#a0742a' },
  society:     { label: 'Society & Culture',    color: '#2e9e6a' },
  politics:    { label: 'Politics & Empires',   color: '#c0392b' },
  technology:  { label: 'Science & Technology', color: '#2980b9' },
  religion:    { label: 'Religion & Ideas',     color: '#9b59b6' },
  exploration: { label: 'Exploration',          color: '#e67e22' },
  conflict:    { label: 'Wars & Conflict',      color: '#e74c3c' },
  environment: { label: 'Environment',          color: '#27ae60' },
};

// Minimum scale (px/year) at which each tier becomes visible
const TIER_SCALE = [0, 0.010, 0.080, 0.70, 4.0, 18.0];

const ERA_ZONES = [
  { label:'Prehistoric',   start:-300000, end:-10000, color:'rgba(139,105,20,.07)' },
  { label:'Ancient',       start:-10000,  end:500,    color:'rgba(218,165,32,.055)' },
  { label:'Medieval',      start:500,     end:1500,   color:'rgba(90,50,180,.07)' },
  { label:'Early Modern',  start:1500,    end:1800,   color:'rgba(30,140,80,.065)' },
  { label:'Modern',        start:1800,    end:1945,   color:'rgba(41,128,185,.065)' },
  { label:'Contemporary',  start:1945,    end:2026,   color:'rgba(200,60,50,.065)' },
];

// loc: [lat, lng, mapZoom, 'Location Name'] or null for global events
const EVENTS = [

  // ── TIER 0 · cosmic anchors ────────────────────────────────────────────
  { id:'e_human_emerge', name:'Human Origins',           year:-200000, minTier:0, cat:'biology',    imp:1.0,
    loc:[9.02,38.74,5,'East Africa'],
    desc:'Homo sapiens emerge in Africa — the first anatomically modern humans.',
    detail:'Fossil evidence from Jebel Irhoud (Morocco, ~315,000 BP) and Omo Kibish (Ethiopia) places Homo sapiens in Africa. These early humans had larger brains, flatter faces, and more complex social behaviour than earlier hominins.' },

  { id:'e_agri',         name:'Agricultural Revolution', year:-10000,  minTier:0, cat:'society',    imp:1.0,
    loc:[36.5,38.5,5,'Fertile Crescent'],
    desc:'Humans shift from nomadic hunter-gathering to settled farming.',
    detail:'The Neolithic Revolution began independently in multiple regions: the Fertile Crescent (wheat, barley), China (rice, millet), Mesoamerica (maize), and New Guinea (taro). This shift enabled population growth, food surpluses, and eventually civilisation.' },

  { id:'e_writing',      name:'Writing Invented',        year:-3200,   minTier:0, cat:'society',    imp:1.0,
    loc:[31.32,45.64,8,'Uruk, Iraq'],
    desc:"Cuneiform script — humanity's first writing system — developed in Sumer.",
    detail:"Writing emerged independently in Sumer (cuneiform, ~3200 BCE), Egypt (hieroglyphs, ~3100 BCE), China (~1200 BCE) and Mesoamerica (~900 BCE). The Sumerian system began as pictographic accounting and evolved into abstract phonetic symbols." },

  { id:'e_industrial',   name:'Industrial Revolution',   year:1760,    minTier:0, cat:'technology', imp:1.0,
    loc:[52.48,-1.89,7,'Birmingham, England'],
    desc:'Steam power transforms manufacturing, transport, and daily life.',
    detail:"Beginning in Britain, the Industrial Revolution mechanised production using coal and steam. It spawned factories, railways, and mass urbanisation, triggering unprecedented economic growth while also causing severe labour exploitation and pollution." },

  { id:'e_digital',      name:'Digital Revolution',      year:1975,    minTier:0, cat:'technology', imp:1.0,
    loc:[37.39,-122.08,9,'Silicon Valley, USA'],
    desc:'Personal computers and the internet reshape civilisation.',
    detail:"The convergence of the microprocessor, personal computer, and internet created the Information Age. From the Altair 8800 (1975) and Apple II (1977) to the World Wide Web (1989) and smartphones (2007), digital technology restructured economies, communication, and knowledge." },

  // ── TIER 1 · prehistoric ──────────────────────────────────────────────
  { id:'e_fire',         name:'Control of Fire',         year:-280000, minTier:1, cat:'biology',    imp:0.95,
    loc:[-27.7,23.6,5,'Wonderwerk Cave, South Africa'],
    desc:'Early humans learn to control fire — cooking, warmth, and social life.',
    detail:'Evidence from Wonderwerk Cave, South Africa, suggests fire use ~1 million years ago. By 280,000 BCE, controlled fire was widespread among archaic Homo sapiens. Cooking increased caloric efficiency, enabling larger brains; hearths became centres of social life.' },

  { id:'e_language',     name:'Language Emerges',        year:-100000, minTier:1, cat:'society',    imp:0.95,
    loc:null,
    desc:'Complex symbolic language emerges among modern humans.',
    detail:'Evidence of symbolic thought — ochre use, shell beads, engraved ochre — suggests complex language existed by 100,000 BCE. Language transformed human cooperation, cultural transmission, and long-term planning: the cognitive leap that made everything else possible.' },

  { id:'e_ooa',          name:'Out of Africa Migration', year:-70000,  minTier:1, cat:'biology',    imp:0.9,
    loc:[11.8,42.0,5,'Horn of Africa'],
    desc:'Homo sapiens leave Africa and spread across the globe.',
    detail:'Around 70,000 BCE, a small group — perhaps a few hundred individuals — left Africa via the Arabian Peninsula. Their descendants spread across Asia, Australia (by ~65,000 BCE), Europe (~45,000 BCE), and the Americas (~15,000 BCE).' },

  { id:'e_cave_art',     name:'Cave Art & Symbolism',    year:-40000,  minTier:1, cat:'society',    imp:0.85,
    loc:[44.4,5.9,9,'Chauvet Cave, France'],
    desc:'Humans create figurative art — the oldest known symbolic expression.',
    detail:"Chauvet Cave (France, ~36,000 BCE) and Sulawesi (Indonesia, ~45,500 BCE) contain the world's oldest known figurative art. Cave paintings, Venus figurines, and bone flutes reveal fully modern cognitive capacities — abstract thought, shared mythology, aesthetic sense." },

  { id:'e_americas',     name:'Americas First Settled',  year:-15000,  minTier:1, cat:'biology',    imp:0.85,
    loc:[65.7,-168.5,4,'Beringia / Bering Strait'],
    desc:'Humans cross from Siberia into the Americas via the Bering land bridge.',
    detail:'During the Last Glacial Maximum, lower sea levels exposed Beringia. Hunter-gatherer bands spread rapidly through North and South America, reaching Patagonia by ~12,500 BCE — one of the fastest colonisations of a continent in human history.' },

  { id:'e_megafauna',    name:'Megafauna Extinction',    year:-12000,  minTier:1, cat:'environment', imp:0.8,
    loc:null,
    desc:'Ice Age giants — mammoths, mastodons, giant sloths — go extinct.',
    detail:'A combination of human overhunting and rapid climate change at the end of the last Ice Age caused the extinction of most large mammals worldwide. This dramatically reshaped ecosystems and eliminated the animals humans had co-evolved alongside for millennia.' },

  // ── TIER 2 · ancient world ────────────────────────────────────────────
  { id:'e_pottery',      name:'Pottery Spreads',         year:-9500,   minTier:2, cat:'technology', imp:0.75,
    loc:[28.3,116.9,6,'Jiangxi, China'],
    desc:'Pottery enables food storage, fermentation, and new cooking techniques.',
    detail:"The oldest known pottery is from Xianrendong Cave, China (~18,000 BCE), but widespread adoption came with the Neolithic (~9,500 BCE). Pottery enabled long-term food storage and fermentation. The potter's wheel (~3500 BCE) later revolutionised production scale." },

  { id:'e_copper',       name:'Copper Age',              year:-5000,   minTier:2, cat:'technology', imp:0.8,
    loc:[42.0,25.0,5,'Balkans / Middle East'],
    desc:'Humans begin smelting copper — the first systematic use of metal.',
    detail:'Copper smelting developed in the Middle East and Balkans around 5000 BCE. Though too soft for most tools, copper was the first metal systematically worked by humans, laying the groundwork for bronze metallurgy that followed.' },

  { id:'e_wheel',        name:'Wheel Invented',          year:-3500,   minTier:2, cat:'technology', imp:0.9,
    loc:[32.5,45.3,7,'Mesopotamia, Iraq'],
    desc:'The wheel revolutionises transport and pottery production.',
    detail:"The earliest known wheels were potter's wheels (~3500 BCE, Mesopotamia). Wheeled vehicles followed, and combined with draft animals, transformed long-distance trade and warfare. One of the most consequential mechanical inventions in human history." },

  { id:'e_uruk',         name:'First Cities',            year:-3500,   minTier:2, cat:'society',    imp:0.95,
    loc:[31.32,45.64,9,'Uruk, Iraq'],
    desc:"Uruk — the world's first major city — reaches a population of 50,000+.",
    detail:"The Sumerian city of Uruk grew to 50,000–80,000 inhabitants by 3200 BCE, fed by irrigation agriculture. It featured monumental temples (ziggurats), specialised artisans, long-distance trade networks, and the first writing system — the template for urban civilisation." },

  { id:'e_egypt',        name:'Egypt Unified',           year:-3100,   minTier:2, cat:'politics',   imp:0.9,
    loc:[26.0,32.0,5,'Egypt'],
    desc:'Pharaoh Narmer unites Upper and Lower Egypt into one kingdom.',
    detail:"The unification under Narmer c. 3100 BCE created one of history's first nation-states. The resulting civilisation endured 3,000 years, producing the pyramids, hieroglyphic literature, advanced medicine, and an administrative model copied across the ancient world." },

  { id:'e_bronze',       name:'Bronze Age Begins',       year:-3300,   minTier:2, cat:'technology', imp:0.85,
    loc:[36.5,38.5,6,'Fertile Crescent'],
    desc:'Tin and copper are alloyed into bronze — harder than either metal alone.',
    detail:'Bronze first appeared in the Fertile Crescent c. 3300 BCE. Significantly harder than copper, it revolutionised weapons, tools, and armour. Bronze Age civilisations built the first cities, empires, and legal codes.' },

  { id:'e_indus',        name:'Indus Valley Civilization', year:-2600, minTier:2, cat:'society',    imp:0.9,
    loc:[27.33,68.14,9,'Mohenjo-daro, Pakistan'],
    desc:'Mohenjo-daro and Harappa become sophisticated planned cities.',
    detail:'The Indus Valley Civilisation (2600–1900 BCE) encompassed over 1,000 settlements across modern Pakistan and NW India. Mohenjo-daro featured grid streets, sophisticated sewage systems, and standardised weights and measures — remarkable for its era.' },

  { id:'e_pyramid',      name:'Great Pyramid of Giza',   year:-2560,   minTier:2, cat:'society',    imp:0.9,
    loc:[29.98,31.13,13,'Giza, Egypt'],
    desc:'The Great Pyramid — tallest structure on Earth for 3,800 years.',
    detail:'Built under Pharaoh Khufu using ~2.3 million stone blocks, the Great Pyramid stands 146.5 m and remained the world\'s tallest structure until Lincoln Cathedral in 1311 CE. A remarkable feat of logistics, engineering, and state power.' },

  { id:'e_hammurabi',    name:'Code of Hammurabi',       year:-1754,   minTier:2, cat:'politics',   imp:0.85,
    loc:[32.54,44.42,9,'Babylon, Iraq'],
    desc:'One of the earliest written legal codes, established in Babylon.',
    detail:"Hammurabi's 282 laws codified punishments, property rights, trade, and family law. Engraved on a 2.25 m stele, it established written, public law as the basis of governance — foundational to all later legal systems." },

  { id:'e_iron',         name:'Iron Age Begins',         year:-1200,   minTier:2, cat:'technology', imp:0.85,
    loc:[39.0,35.0,5,'Anatolia, Turkey'],
    desc:'Iron smelting spreads, making metal tools and weapons widely accessible.',
    detail:'Iron smelting began in Anatolia c. 1800 BCE but became widespread after the Bronze Age Collapse (~1200 BCE). Iron ore was far more abundant than copper and tin, democratising access to metal and accelerating agricultural productivity and military capability.' },

  { id:'e_bronze_fall',  name:'Bronze Age Collapse',     year:-1195,   minTier:2, cat:'conflict',   imp:0.8,
    loc:[36.0,32.0,5,'Eastern Mediterranean'],
    desc:'Multiple civilisations collapse simultaneously across the Eastern Mediterranean.',
    detail:'Around 1200 BCE, the palace economies of Mycenae, Hatti, Ugarit, and others collapsed in a cascade of invasions, drought, earthquakes, and trade disruption. Writing and long-distance trade largely ceased for centuries — one of history\'s great mysteries.' },

  { id:'e_phoenician',   name:'Phoenician Alphabet',     year:-1050,   minTier:2, cat:'society',    imp:0.80,
    loc:[34.12,35.65,10,'Byblos, Lebanon'],
    desc:'The Phoenicians develop the first widely-used alphabet — ancestor of most scripts today.',
    detail:'The Phoenician alphabet (~22 consonants, no vowels) was adopted and adapted by the Greeks, who added vowels, creating the ancestor of Latin, Cyrillic, Arabic, and Hebrew scripts. It is arguably the most influential writing system ever devised.' },

  { id:'e_olympics',     name:'Ancient Olympics',        year:-776,    minTier:2, cat:'society',    imp:0.72,
    loc:[37.64,21.63,12,'Olympia, Greece'],
    desc:'The first recorded Olympic Games are held at Olympia, Greece.',
    detail:'The Ancient Olympics began in 776 BCE in honor of Zeus and were held every four years for over 1,000 years. They provided a rare pan-Hellenic truce, uniting competing city-states. The modern Games, revived in 1896, are their direct descendant.' },

  { id:'e_confucius',    name:'Confucius',               year:-551,    minTier:2, cat:'religion',   imp:0.85,
    loc:[35.60,117.04,10,'Qufu, China'],
    desc:"Confucius codifies ethics, governance, and social harmony in China.",
    detail:"Confucius (551–479 BCE) developed a philosophy of moral cultivation, filial piety, and virtuous governance. Confucianism became the dominant ethical framework of Chinese civilisation for 2,500 years, profoundly shaping East Asian culture, politics, and education." },

  { id:'e_persia',       name:'Persian Empire',          year:-550,    minTier:2, cat:'politics',   imp:0.85,
    loc:[29.93,52.88,7,'Persepolis, Iran'],
    desc:'Cyrus the Great founds the Achaemenid Persian Empire — the largest the world had yet seen.',
    detail:'Cyrus II united Persia and Media, then conquered Lydia and Babylon. At its height under Darius I, the Achaemenid Empire stretched from Greece to India — 5.5 million km². Famous for religious tolerance, the Royal Road, and a sophisticated bureaucracy.' },

  { id:'e_buddha',       name:'Buddhism Founded',        year:-528,    minTier:2, cat:'religion',   imp:0.9,
    loc:[24.70,84.99,12,'Bodh Gaya, India'],
    desc:'Siddhartha Gautama attains enlightenment; Buddhism is born in India.',
    detail:"Siddhartha Gautama's enlightenment c. 528 BCE founded one of history's great religions. Buddhism spread across Asia along trade routes, shaping the cultures of India, Southeast Asia, China, Japan, Korea, and Tibet." },

  { id:'e_athens',       name:'Greek Democracy',         year:-508,    minTier:2, cat:'politics',   imp:0.9,
    loc:[37.97,23.73,11,'Athens, Greece'],
    desc:'Cleisthenes establishes the world\'s first democratic government in Athens.',
    detail:"Cleisthenes' reforms of 508 BCE gave all male citizens the right to vote in the Assembly. While excluding women, slaves, and foreigners, this model profoundly influenced republican and democratic thought for two millennia." },

  { id:'e_library_alex', name:'Library of Alexandria',   year:-283,    minTier:2, cat:'society',    imp:0.78,
    loc:[31.20,29.91,12,'Alexandria, Egypt'],
    desc:'The greatest library of the ancient world gathers the sum of human knowledge.',
    detail:'Founded under Ptolemy I (~283 BCE), the Library of Alexandria held an estimated 400,000–700,000 scrolls. It attracted scholars from across the ancient world, making Alexandria the intellectual capital of the Hellenistic era.' },

  { id:'e_alexander',    name:'Alexander the Great',     year:-334,    minTier:2, cat:'politics',   imp:0.9,
    loc:[40.8,22.5,7,'Pella, Macedonia'],
    desc:'Alexander conquers a vast empire stretching from Greece to India.',
    detail:'Between 334 and 323 BCE, Alexander of Macedon conquered 2 million square miles in 11 years, spreading Greek culture (Hellenism) across Persia, Egypt, Central Asia, and northwest India, fusing it with local traditions.' },

  { id:'e_qin',          name:'China Unified',           year:-221,    minTier:2, cat:'politics',   imp:0.9,
    loc:[34.27,108.93,6,'Xi\'an, China'],
    desc:"Qin Shi Huang unifies China — the world's most populous state.",
    detail:'Qin Shi Huang defeated six rival kingdoms in 221 BCE. He standardised weights, measures, currency, and writing; built the first Great Wall sections; and created the Terracotta Army. His centralised model defined Chinese governance for 2,000 years.' },

  { id:'e_han_dynasty',  name:'Han Dynasty',             year:-202,    minTier:2, cat:'politics',   imp:0.80,
    loc:[34.27,108.93,6,'Xi\'an, China'],
    desc:'The Han Dynasty unifies and expands China, opening the Silk Road.',
    detail:'The Han Dynasty (202 BCE – 220 CE) consolidated Chinese identity, expanded territory, established the civil service exam system, and opened Silk Road trade. The period is so foundational that the Chinese majority ethnic group is still called the Han people.' },

  { id:'e_rome_rep',     name:'Roman Republic',          year:-509,    minTier:2, cat:'politics',   imp:0.85,
    loc:[41.89,12.48,10,'Rome, Italy'],
    desc:'Romans overthrow their king and establish a republic.',
    detail:"The overthrow of Tarquin c. 509 BCE established the Roman Republic with elected consuls, the Senate, and written law (the Twelve Tables). Republican Rome developed concepts of citizenship, separation of powers, and legal equality." },

  { id:'e_silk_road',    name:'Silk Road Opens',         year:-130,    minTier:2, cat:'exploration', imp:0.85,
    loc:[39.9,60.0,4,'Central Asia'],
    desc:'Trade routes connect China to the Mediterranean, spreading goods and ideas.',
    detail:"The Silk Road connected Han-dynasty China to the Roman Empire from ~130 BCE. Beyond silk, it transmitted Buddhism, Islam, paper-making, gunpowder, and mathematical concepts across Eurasia — history's most consequential trade network." },

  { id:'e_caesar',       name:'Roman Empire',            year:-44,     minTier:2, cat:'politics',   imp:0.9,
    loc:[41.89,12.48,10,'Rome, Italy'],
    desc:"Caesar's assassination leads to the fall of the Republic and rise of the Empire.",
    detail:"Julius Caesar's assassination (44 BCE) ended the Roman Republic. His heir Octavian became Emperor Augustus in 27 BCE. The empire dominated the Mediterranean for 500 years, shaping Western law, language, and culture." },

  { id:'e_jesus',        name:'Life of Jesus Christ',    year:4,       minTier:2, cat:'religion',   imp:1.0,
    loc:[31.78,35.23,11,'Jerusalem'],
    desc:'Jesus of Nazareth preaches in Judaea; Christianity is founded after his death.',
    detail:"Jesus of Nazareth was crucified c. 30–33 CE. His followers founded Christianity, which became the Roman Empire's official religion by 380 CE and eventually the world's largest religion, with ~2.4 billion adherents today." },

  { id:'e_maya_classic', name:'Maya Civilization',       year:250,     minTier:2, cat:'society',    imp:0.80,
    loc:[17.25,-89.62,7,'Maya Lowlands, Guatemala'],
    desc:'The Maya build cities, develop a calendar, and create the Americas\' only full writing system.',
    detail:'The Maya Classic period (250–900 CE) saw city-states like Tikal and Palenque flourish with populations of 50,000–100,000. The Maya developed a precise calendar, advanced mathematics (including zero), hieroglyphic writing, and monumental architecture.' },

  { id:'e_byzantine',    name:'Constantinople Founded',  year:330,     minTier:2, cat:'politics',   imp:0.82,
    loc:[41.01,28.97,11,'Constantinople (Istanbul)'],
    desc:'Constantine founds Constantinople — the new capital of the Roman Empire.',
    detail:"Constantine I founded Constantinople (modern Istanbul) in 330 CE on the site of Byzantium. It became the world's largest city and the centre of the Byzantine Empire, which preserved Roman and Greek learning for 1,100 years until its fall in 1453." },

  { id:'e_rome_fall',    name:'Fall of Western Rome',    year:476,     minTier:2, cat:'politics',   imp:0.9,
    loc:[41.89,12.48,8,'Rome, Italy'],
    desc:'The Western Roman Empire falls, ending classical antiquity.',
    detail:"The deposition of Romulus Augustulus in 476 CE marks the end of the Western Roman Empire. In reality a gradual process over a century, it ushered in the Middle Ages: fragmented kingdoms, declining urban life, and the rise of the Catholic Church." },

  // ── TIER 3 · medieval ─────────────────────────────────────────────────
  { id:'e_justinian',    name:'Justinian Code',          year:529,     minTier:3, cat:'politics',   imp:0.76,
    loc:[41.01,28.97,10,'Constantinople'],
    desc:"Byzantine Emperor Justinian codifies Roman law — the foundation of European legal systems.",
    detail:"The Corpus Juris Civilis (529 CE) consolidated centuries of Roman law. Rediscovered in medieval Europe, it became the basis for the legal systems of France, Germany, Spain, Italy, and most of the world outside the Anglo-American common-law tradition." },

  { id:'e_islam',        name:'Islam Founded',           year:610,     minTier:3, cat:'religion',   imp:1.0,
    loc:[21.42,39.82,10,'Mecca, Saudi Arabia'],
    desc:'Muhammad receives his first revelation; Islam emerges in Arabia.',
    detail:"Muhammad ibn Abdullah received his first revelation in 610 CE. Within a century of his death (632 CE), Islamic armies conquered Arabia, Persia, Egypt, and Spain, spreading a faith and civilisation that would number 1.8 billion adherents by 2020." },

  { id:'e_zero',         name:'Indian Numerals & Zero',  year:628,     minTier:3, cat:'technology', imp:0.80,
    loc:[23.18,77.40,5,'India'],
    desc:'Indian mathematicians formalise zero and the decimal positional number system.',
    detail:'Brahmagupta (628 CE) formalised the rules for zero and negative numbers. The Hindu-Arabic numeral system (0–9) was transmitted to Europe via Islamic scholars, replacing Roman numerals and enabling modern mathematics, science, and commerce.' },

  { id:'e_charlemagne',  name:"Charlemagne's Empire",    year:800,     minTier:3, cat:'politics',   imp:0.85,
    loc:[50.77,6.08,9,'Aachen, Germany'],
    desc:'Charlemagne is crowned Holy Roman Emperor, uniting much of western Europe.',
    detail:"Charlemagne's coronation by Pope Leo III (Christmas 800 CE) symbolised the alliance of church and state that defined medieval Europe. His Carolingian Empire covered modern France, Germany, and Italy, and his promotion of literacy laid foundations for European civilisation." },

  { id:'e_abbasid',      name:'Abbasid Caliphate',       year:762,     minTier:3, cat:'politics',   imp:0.80,
    loc:[33.34,44.40,9,'Baghdad, Iraq'],
    desc:"Baghdad becomes the world's largest city and centre of Islamic Golden Age learning.",
    detail:'The Abbasid Caliphate (750–1258 CE) established Baghdad as the intellectual capital of the world. The House of Wisdom translated Greek, Indian, and Persian texts and made breakthroughs in algebra, astronomy, medicine, and optics.' },

  { id:'e_vikings',      name:'Viking Age',              year:793,     minTier:3, cat:'exploration', imp:0.8,
    loc:[59.9,10.75,5,'Scandinavia'],
    desc:'Norse raiders and explorers range from North America to Russia.',
    detail:"The Viking Age (793–1066 CE) saw Norse people raid, trade, settle, and explore across Europe and the North Atlantic. They settled Iceland, Greenland, and briefly North America (Vinland, c. 1000 CE), while trading from the British Isles to Byzantium." },

  { id:'e_gunpowder_china', name:'Chinese Gunpowder',    year:850,     minTier:3, cat:'technology', imp:0.78,
    loc:[35.0,105.0,4,'China'],
    desc:'Chinese alchemists develop gunpowder — a discovery that will transform warfare.',
    detail:'Chinese alchemists accidentally discovered gunpowder (~9th century CE) while searching for immortality elixirs. By the 10th century it was used in fire-arrows and bombs. Transmitted westward via the Mongols and Silk Road, gunpowder shattered medieval fortifications and feudal warfare.' },

  { id:'e_song_dynasty', name:'Song Dynasty China',      year:960,     minTier:3, cat:'society',    imp:0.78,
    loc:[30.26,120.15,7,'Hangzhou, China'],
    desc:'China\'s Song Dynasty achieves the world\'s first industrial economy and printing revolution.',
    detail:"The Song Dynasty (960–1279) produced extraordinary innovations: movable type printing (1040), paper money, the magnetic compass, and iron/steel production dwarfing contemporary Europe. Hangzhou had over 1 million inhabitants — the world's largest city." },

  { id:'e_leif_erikson', name:'Norse Reach Americas',    year:1000,    minTier:3, cat:'exploration', imp:0.74,
    loc:[51.6,-55.5,8,"L'Anse aux Meadows, Newfoundland"],
    desc:"Leif Erikson establishes a Norse settlement in North America — 500 years before Columbus.",
    detail:"Around 1000 CE, Norse explorers established Vinland — likely at L'Anse aux Meadows, Newfoundland. Archaeological evidence confirmed in 1960, this was the first confirmed European contact with the Americas. The colony was short-lived due to conflict with Indigenous peoples." },

  { id:'e_crusades',     name:'The Crusades',            year:1096,    minTier:3, cat:'conflict',   imp:0.85,
    loc:[31.78,35.23,9,'Jerusalem'],
    desc:'Christian armies launch religious wars for the Holy Land.',
    detail:"Pope Urban II called the First Crusade in 1096; Jerusalem fell in 1099. Over 200 years, nine major Crusades were launched. They intensified Christian-Muslim conflict, established Crusader states, and spurred trade and cultural exchange between Europe and the Islamic world." },

  { id:'e_angkor',       name:'Angkor Wat',              year:1113,    minTier:3, cat:'society',    imp:0.74,
    loc:[13.41,103.87,13,'Angkor Wat, Cambodia'],
    desc:'The Khmer Empire builds Angkor Wat — the largest religious monument ever constructed.',
    detail:"Angkor Wat was built under Suryavarman II (1113–1150 CE) as a Hindu temple complex covering 1.6 km². It later became a Buddhist site. The Khmer Empire at its peak controlled much of Southeast Asia, with Angkor being the world's largest pre-industrial city." },

  { id:'e_mongols',      name:'Mongol Empire',           year:1206,    minTier:3, cat:'politics',   imp:0.9,
    loc:[47.9,106.9,5,'Ulaanbaatar, Mongolia'],
    desc:'Genghis Khan creates the largest contiguous land empire in history.',
    detail:"Genghis Khan united the Mongol tribes in 1206. His campaigns created an empire of 24 million km². The Mongol conquests killed an estimated 40 million people (10% of world population) but also unified Eurasian trade routes and enabled remarkable cross-cultural exchange." },

  { id:'e_magna',        name:'Magna Carta',             year:1215,    minTier:3, cat:'politics',   imp:0.9,
    loc:[51.44,-0.56,12,'Runnymede, England'],
    desc:'English barons force King John to accept limits on royal power.',
    detail:"The Magna Carta (1215) established that even the king was subject to the rule of law, enshrining habeas corpus. Though initially a feudal compromise, it became the foundational document for constitutional government in the English-speaking world." },

  { id:'e_aztec_found',  name:'Aztec Empire',            year:1325,    minTier:3, cat:'politics',   imp:0.80,
    loc:[19.43,-99.13,11,'Tenochtitlan (Mexico City)'],
    desc:"The Aztecs found Tenochtitlan — a city that will grow larger than any in contemporary Europe.",
    detail:"Founded in 1325 on an island in Lake Texcoco, Tenochtitlan grew to 200,000–300,000 people by 1500 — larger than London or Paris. The Aztec Empire controlled central Mexico through a tribute system until its conquest by Hernán Cortés in 1521." },

  { id:'e_mali',         name:'Mali Empire & Mansa Musa', year:1312,   minTier:3, cat:'politics',   imp:0.8,
    loc:[12.65,-8.0,5,'Mali Empire, West Africa'],
    desc:"The world's wealthiest empire controls Africa's gold and salt trade.",
    detail:"Under Mansa Musa (1312–1337), the Mali Empire produced most of the world's gold. His 1324 pilgrimage to Mecca — distributing so much gold he caused inflation across North Africa — demonstrated the extraordinary wealth of sub-Saharan Africa." },

  { id:'e_hundred_years', name:"Hundred Years' War",     year:1337,    minTier:3, cat:'conflict',   imp:0.74,
    loc:[48.85,2.35,6,'France / England'],
    desc:'England and France fight a century-long war that forges both nations\' identities.',
    detail:"The Hundred Years' War (1337–1453) was a series of conflicts over the French throne. Joan of Arc's inspired campaigns (1429–1431) turned the tide for France. The war ended English claims to France and gave birth to French national identity, the longbow age, and early nationalism." },

  { id:'e_black_death',  name:'Black Death',             year:1347,    minTier:3, cat:'environment', imp:0.95,
    loc:[45.46,9.19,5,'Europe'],
    desc:'Bubonic plague kills 30–60% of Europe\'s population.',
    detail:'The Black Death (1347–1351) killed 75–200 million people across Eurasia. It devastated economies and feudal structures, but created labour shortages that broke serfdom, accelerated the Renaissance, and fundamentally reshaped European society and religious life.' },

  { id:'e_renaissance',  name:'Renaissance',             year:1350,    minTier:3, cat:'society',    imp:0.9,
    loc:[43.77,11.25,10,'Florence, Italy'],
    desc:'A cultural rebirth in Italy revives classical learning and launches modern art.',
    detail:"Beginning in 14th-century Italian city-states, the Renaissance rediscovered ancient Greek and Roman texts. Leonardo da Vinci, Michelangelo, and Petrarch revolutionised art, literature, architecture, and humanist philosophy, laying the groundwork for the modern world." },

  { id:'e_inca_empire',  name:'Inca Empire',             year:1438,    minTier:3, cat:'politics',   imp:0.78,
    loc:[-13.53,-71.97,9,'Cusco, Peru'],
    desc:'The Inca build the largest empire in pre-Columbian America.',
    detail:"The Inca Empire (Tawantinsuyu) at its height (1438–1533) stretched 4,300 km along the Andes, linked by 40,000 km of roads. With no writing system, it used quipu (knotted cords) for record-keeping. Conquered by Francisco Pizarro in 1533 with just 168 men." },

  { id:'e_gutenberg',    name:'Printing Press',          year:1440,    minTier:3, cat:'technology', imp:0.95,
    loc:[49.99,8.27,11,'Mainz, Germany'],
    desc:"Gutenberg's movable-type press democratises knowledge across Europe.",
    detail:"Gutenberg's printing press (c. 1440) allowed books to be produced 1,000× faster than hand-copying. By 1500, over 20 million books had been printed. Mass dissemination of information accelerated the Renaissance, fuelled the Reformation, and democratised knowledge." },

  { id:'e_fall_const',   name:'Fall of Constantinople',  year:1453,    minTier:3, cat:'conflict',   imp:0.83,
    loc:[41.01,28.97,11,'Constantinople (Istanbul)'],
    desc:'The Ottoman Turks capture Constantinople, ending the Byzantine Empire.',
    detail:"Mehmed II's 53-day siege (1453) ended the 1,100-year-old Byzantine Empire. The fall drove Greek scholars and texts to Italy, accelerating the Renaissance. It also cut overland Silk Road routes, motivating European powers to seek sea routes to Asia." },

  { id:'e_ottoman',      name:'Ottoman Empire',          year:1299,    minTier:3, cat:'politics',   imp:0.85,
    loc:[41.01,28.97,8,'Constantinople (Istanbul)'],
    desc:'The Ottomans build an empire spanning three continents.',
    detail:"Founded by Osman I c. 1299, the Ottoman Empire reached its height under Suleiman the Magnificent (1520–1566), controlling Southeast Europe, the Middle East, and North Africa. Constantinople fell in 1453, ending the Byzantine Empire. The Ottomans ruled until 1922." },

  { id:'e_columbus',     name:'Columbus Reaches Americas', year:1492,  minTier:3, cat:'exploration', imp:0.95,
    loc:[24.0,-75.0,7,'Bahamas / Caribbean'],
    desc:'Columbus triggers permanent contact between the Old and New Worlds.',
    detail:"Columbus's 1492 voyage initiated the Columbian Exchange — transfer of plants, animals, diseases, and cultures between hemispheres. It triggered European colonialism that would reshape the globe, while diseases brought by Europeans killed an estimated 90% of Indigenous American populations." },

  // ── TIER 4 · early modern ─────────────────────────────────────────────
  { id:'e_reform',       name:'Protestant Reformation',  year:1517,    minTier:4, cat:'religion',   imp:0.9,
    loc:[51.85,12.63,10,'Wittenberg, Germany'],
    desc:"Luther's 95 Theses split Christianity and spark the Wars of Religion.",
    detail:"Martin Luther's 1517 theses ignited the Reformation, splintering Western Christianity into Catholic and Protestant branches. The resulting Wars of Religion killed millions, while driving individual conscience, literacy, and eventual separation of church and state." },

  { id:'e_magellan',     name:'First Circumnavigation',  year:1519,    minTier:4, cat:'exploration', imp:0.82,
    loc:[-20.0,-50.0,3,'South America'],
    desc:"Magellan's expedition proves Earth's spherical shape by sailing around it.",
    detail:"Magellan set out in 1519 with 5 ships and 270 men. Though he died in the Philippines (1521), 18 survivors under Elcano completed the first circumnavigation, demonstrating the vast scale of the Pacific." },

  { id:'e_slave_trade',  name:'Transatlantic Slave Trade', year:1526,  minTier:4, cat:'conflict',   imp:0.9,
    loc:[0.0,-30.0,3,'Atlantic Ocean'],
    desc:'~12 million Africans are forcibly transported to the Americas as enslaved people.',
    detail:"The transatlantic slave trade forcibly transported 12.5 million Africans (10.7 million surviving the voyage). The largest forced migration in history, it underpinned colonial economies, and its legacy of racial inequality continues to shape societies today." },

  { id:'e_sci_rev',      name:'Scientific Revolution',   year:1543,    minTier:4, cat:'technology', imp:0.95,
    loc:[52.0,0.0,5,'Europe'],
    desc:'Copernicus, Galileo, and Newton establish the foundations of modern science.',
    detail:"Copernicus's heliocentric model (1543), Galileo's telescopic discoveries (1609), and Newton's laws of motion and gravity (1687) created a new method: observation, hypothesis, mathematical proof. The Scientific Revolution broke the hold of ancient authority." },

  { id:'e_shakespeare',  name:'Shakespeare',             year:1564,    minTier:4, cat:'society',    imp:0.80,
    loc:[52.19,-1.71,11,'Stratford-upon-Avon, England'],
    desc:'William Shakespeare writes the most influential body of literature in English.',
    detail:"Shakespeare (1564–1616) wrote 37 plays and 154 sonnets that explored the full range of human experience. Coined or popularised over 1,700 words still in use; his works are performed more than any other playwright's and have been translated into every major language." },

  { id:'e_galileo',      name:"Galileo's Telescope",     year:1609,    minTier:4, cat:'technology', imp:0.83,
    loc:[45.41,12.35,10,'Venice, Italy'],
    desc:'Galileo turns the telescope to the sky, discovering moons of Jupiter and confirming heliocentrism.',
    detail:'Galileo Galilei (1609) observed four moons orbiting Jupiter, sunspots, and the phases of Venus — proving planets orbit the Sun. His conflict with the Inquisition and his method of empirical observation defined the tension between faith and science for centuries.' },

  { id:'e_thirty_years', name:'Thirty Years War',        year:1618,    minTier:4, cat:'conflict',   imp:0.76,
    loc:[50.08,14.44,5,'Central Europe'],
    desc:"Europe's most destructive conflict before the 20th century reshapes the continent.",
    detail:"The Thirty Years War (1618–1648) began as a religious conflict between Catholic and Protestant states but became a general European war. It killed up to 8 million people — one-third of Germany's population. The Peace of Westphalia (1648) established the modern system of sovereign nation-states." },

  { id:'e_taj_mahal',    name:'Taj Mahal',               year:1632,    minTier:4, cat:'society',    imp:0.74,
    loc:[27.17,78.04,13,'Agra, India'],
    desc:'Emperor Shah Jahan builds the Taj Mahal as a monument to love.',
    detail:'The Taj Mahal (1632–1653) was built by Mughal Emperor Shah Jahan for his wife Mumtaz Mahal who died in childbirth. Combining Persian, Islamic, and Indian architecture, it employed 20,000 artisans and is widely considered the finest example of Mughal architecture.' },

  { id:'e_english_cw',   name:'English Civil War',       year:1642,    minTier:4, cat:'politics',   imp:0.8,
    loc:[51.5,-1.8,7,'England'],
    desc:'Parliament defeats King Charles I; England briefly becomes a republic.',
    detail:"The English Civil War (1642–1651) established parliamentary supremacy. Charles I was executed in 1649. The conflict's principles — that rulers answer to law — influenced the Glorious Revolution (1688) and later democratic revolutions worldwide." },

  { id:'e_newton',       name:"Newton's Principia",      year:1687,    minTier:4, cat:'technology', imp:0.9,
    loc:[52.25,-0.50,10,'Woolsthorpe, England'],
    desc:"Newton's laws of motion and gravity unify physics and astronomy.",
    detail:"Newton's Principia Mathematica (1687) unified terrestrial and celestial mechanics. It demonstrated that the same mathematical principles govern both falling apples and orbiting planets — defining physics for 230 years until Einstein." },

  { id:'e_glorious_rev', name:'Glorious Revolution',     year:1688,    minTier:4, cat:'politics',   imp:0.76,
    loc:[51.5,-0.12,9,'London, England'],
    desc:"England's bloodless revolution establishes constitutional monarchy and parliamentary supremacy.",
    detail:"The Glorious Revolution (1688) deposed James II and established William of Orange and Mary II. The Bill of Rights (1689) enshrined parliamentary sovereignty, freedom of speech in Parliament, and regular elections — the template for modern constitutional government." },

  { id:'e_steam',        name:'Steam Engine (Watt)',      year:1769,    minTier:4, cat:'technology', imp:0.9,
    loc:[55.87,-4.27,10,'Glasgow, Scotland'],
    desc:"James Watt's steam engine powers the Industrial Revolution.",
    detail:"James Watt's separate condenser design (1769) made steam engines dramatically more efficient. His engines powered factories, mines, and locomotives, harnessing fossil fuels on a civilisational scale and making Britain the world's first industrial nation." },

  { id:'e_boston_tea',   name:'Boston Tea Party',        year:1773,    minTier:4, cat:'politics',   imp:0.74,
    loc:[42.36,-71.05,12,'Boston, USA'],
    desc:"American colonists dump British tea into Boston Harbour, igniting the Revolution.",
    detail:"On December 16, 1773, 116 men dumped 342 chests of tea (~92,000 lb) into Boston Harbour to protest 'taxation without representation'. The incident led directly to British crackdown and the convening of the First Continental Congress (1774)." },

  { id:'e_amer_rev',     name:'American Revolution',     year:1776,    minTier:4, cat:'politics',   imp:0.9,
    loc:[39.95,-75.17,9,'Philadelphia, USA'],
    desc:'The United States declares independence — the first modern constitutional republic.',
    detail:"The Declaration of Independence (1776) and Constitution (1787) established the first major modern republic based on Enlightenment principles: popular sovereignty, separation of powers, individual rights. It inspired revolutions in France, Haiti, and Latin America." },

  { id:'e_haitian_rev',  name:'Haitian Revolution',      year:1791,    minTier:4, cat:'politics',   imp:0.80,
    loc:[18.54,-72.34,9,'Port-au-Prince, Haiti'],
    desc:'Enslaved people revolt and found the first Black republic in history.',
    detail:"The Haitian Revolution (1791–1804) was the only successful slave revolt in history. Led by Toussaint Louverture and Jean-Jacques Dessalines, it abolished slavery and established Haiti as the world's first Black republic — a seismic challenge to the slave-based Atlantic order." },

  { id:'e_french_rev',   name:'French Revolution',       year:1789,    minTier:4, cat:'politics',   imp:0.95,
    loc:[48.85,2.35,10,'Paris, France'],
    desc:'The French Revolution dismantles monarchy and spreads liberal ideals across Europe.',
    detail:"The French Revolution (1789–1799) abolished feudalism, executed Louis XVI, and proclaimed liberté, égalité, fraternité. The Napoleonic Wars that followed spread revolutionary ideals across Europe, permanently reshaping its political landscape." },

  // ── TIER 5 · modern / contemporary ────────────────────────────────────
  { id:'e_napoleon',     name:'Napoleonic Wars',         year:1803,    minTier:5, cat:'conflict',   imp:0.85,
    loc:[48.85,2.35,6,'Paris / Europe'],
    desc:"Napoleon's campaigns reshape Europe and spread revolutionary ideals.",
    detail:"Napoleon's campaigns (1803–1815) spread the Napoleonic Code (legal equality), abolished feudalism across conquered territories, and stirred nationalist movements. His defeat at Waterloo (1815) led to a generation of conservative reaction." },

const canvas  = document.getElementById('c');

let W = 0, H = 0;
let scale   = 1;
let scrollX = 0;

let dragging   = false;

let hoveredEv  = null;
let selectedEv = null;
let activeCategories = new Set(Object.keys(CATS));

// ═══════════════════════════════════════════════════════════════════
//  MAP
// ═══════════════════════════════════════════════════════════════════

const leafMap = L.map('map', {
  center: [25, 15],
  zoom: 2,
  zoomControl: true,
  attributionControl: false,
  scrollWheelZoom: false,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(leafMap);

let mapMarker = null;

function updateMap(ev) {
  // Always clear old marker
  if (mapMarker) { leafMap.removeLayer(mapMarker); mapMarker = null; }

  const hint = document.getElementById('mapHint');
  if (!ev || !ev.loc) {
    hint.classList.remove('hidden');
    return;
  }
  hint.classList.add('hidden');

  const [lat, lng, zoom, locName] = ev.loc;
  const color = (CATS[ev.cat] || { color: '#7c83ff' }).color;

  const icon = L.divIcon({
    className: '',
    html: `<div class="hist-marker" style="background:${color}"></div>`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });

  mapMarker = L.marker([lat, lng], { icon }).addTo(leafMap);
  leafMap.flyTo([lat, lng], zoom, { duration: 0.9 });
}

function clearMapMarker() {
  if (mapMarker) { leafMap.removeLayer(mapMarker); mapMarker = null; }
  document.getElementById('mapHint').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════════════
//  CORE MATH
// ═══════════════════════════════════════════════════════════════════

function yearToX(yr) { return (yr - MIN_YEAR) * scale - scrollX; }
function xToYear(x)  { return MIN_YEAR + (x + scrollX) / scale; }
function totalW()    { return (MAX_YEAR - MIN_YEAR) * scale; }
function axisY()     { return Math.round(H * 0.54); }

function clampScroll() {
  const max = Math.max(0, totalW() - W);
  scrollX   = Math.max(0, Math.min(scrollX, max));
}

function zoomAt(factor, cx) {
  const yr   = xToYear(cx);
  const minS = W / (MAX_YEAR - MIN_YEAR) * 0.95;
  scale = Math.max(minS, Math.min(250, scale * factor));
  scrollX = (yr - MIN_YEAR) * scale - cx;
  clampScroll();
  scheduleRender();
  updateScaleBar();
}

function jumpTo(minY, maxY) {
  const pad = (maxY - minY) * 0.04;
  scale   = W / (maxY - minY + pad * 2);
  scrollX = (minY - pad - MIN_YEAR) * scale;
  clampScroll();
  scheduleRender();
  updateScaleBar();
}

function scheduleRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; render(); });
}

function stableHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return h >>> 0;
}

function eventY(ev) {
  const ay    = axisY();
  const above = (stableHash(ev.id) & 1) === 0;
  const span  = H * 0.22 * ev.imp;
  const raw   = above ? ay - span - 6 : ay + span + 6;
  return Math.max(H * 0.07, Math.min(H * 0.90, raw));
}

// ═══════════════════════════════════════════════════════════════════
//  VISIBLE EVENTS
// ═══════════════════════════════════════════════════════════════════

function visibleEvents() {
  const vMin = xToYear(-50);
  const vMax = xToYear(W + 50);
  return EVENTS.filter(ev =>
    scale >= TIER_SCALE[ev.minTier] &&
    ev.year >= vMin && ev.year <= vMax &&
    activeCategories.has(ev.cat)
  );
}

function labelSet(evs) {
  const sorted = [...evs].sort((a, b) => b.imp - a.imp);
  const shown  = new Set();
  const used   = [];
  for (const ev of sorted) {
    const x  = yearToX(ev.year);
    const lw = ev.name.length * 6.5 + 8;
    const clash = used.some(u => Math.abs(u.x - x) < (u.w / 2 + lw / 2 + 12));
    const force = ev === hoveredEv || ev === selectedEv || ev.imp >= 0.98;
    if (!clash || force) {
      shown.add(ev.id);
      if (!clash) used.push({ x, w: lw });
    }
  }
  return shown;
}

// ═══════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W, H);
  drawEraZones();
  drawAxis();
  drawTicks();
  drawEvents();
}

function drawEraZones() {
  const ay = axisY();
  ERA_ZONES.forEach(z => {
    const x1 = yearToX(z.start), x2 = yearToX(z.end);
    if (x2 < 0 || x1 > W) return;
    ctx.fillStyle = z.color;
    ctx.fillRect(x1, 0, x2 - x1, H);
    const vx1 = Math.max(x1, 0), vx2 = Math.min(x2, W);
    if (vx2 - vx1 < 20) return;
    const lx = Math.max(vx1 + 5, Math.min(vx2 - 5, (vx1 + vx2) / 2));
    ctx.save();
    ctx.fillStyle    = 'rgba(220,220,255,0.14)';
    ctx.font         = `bold ${Math.max(10, H * 0.022)}px 'Segoe UI', sans-serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(z.label.toUpperCase(), lx, ay - 28);
    ctx.restore();
  });
}

function drawAxis() {
  const ay = axisY();
  const g  = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0,    'rgba(100,108,255,0)');
  g.addColorStop(0.04, 'rgba(100,108,255,.65)');
  g.addColorStop(0.96, 'rgba(100,108,255,.65)');
  g.addColorStop(1,    'rgba(100,108,255,0)');
  ctx.strokeStyle = g;
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(0, ay);
  ctx.lineTo(W, ay);
  ctx.stroke();
}

function niceInterval(viewRange, maxTicks) {
  const steps = [1,2,5,10,25,50,100,200,500,1000,2000,5000,10000,25000,50000,100000];
  const rough = viewRange / maxTicks;
  return steps.find(s => s >= rough) || 100000;
}

function drawTicks() {
  const ay       = axisY();
  const vMin     = xToYear(0);
  const vMax     = xToYear(W);
  const interval = niceInterval(vMax - vMin, 10);
  const start    = Math.ceil(vMin / interval) * interval;
  ctx.fillStyle    = 'rgba(150,152,185,0.85)';
  ctx.font         = `${Math.max(10, H * 0.017)}px 'Segoe UI', sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'top';
  for (let yr = start; yr <= vMax + interval; yr += interval) {
    if (yr < MIN_YEAR || yr > MAX_YEAR) continue;
    const x = yearToX(yr);
    if (x < 18 || x > W - 18) continue;
    ctx.strokeStyle = 'rgba(100,108,255,0.3)';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.moveTo(x, ay - 5); ctx.lineTo(x, ay + 5); ctx.stroke();
    ctx.fillStyle = 'rgba(150,152,185,0.85)';
    ctx.fillText(formatYear(yr), x, ay + 9);
  }
}

function drawEvents() {
  const ay     = axisY();
  const evs    = visibleEvents();
  const labels = labelSet(evs);
  const sorted = [...evs].sort((a, b) => a.imp - b.imp);

  sorted.forEach(ev => {
    const x     = yearToX(ev.year);
    const y     = eventY(ev);
    const isSel = selectedEv && selectedEv.id === ev.id;
    const isHov = hoveredEv  && hoveredEv.id  === ev.id;
    const baseR = Math.max(4, ev.imp * 9.5);
    const r     = baseR * (isSel ? 1.65 : isHov ? 1.35 : 1);
    const color = (CATS[ev.cat] || {color:'#888'}).color;
    const thr   = TIER_SCALE[ev.minTier];
    const alpha = thr === 0 ? 1 : Math.min(1, (scale - thr) / (thr * 2.5));

    ctx.globalAlpha = alpha * (isSel ? 1 : isHov ? 0.96 : 0.82);

    ctx.strokeStyle = (isSel || isHov) ? color : 'rgba(190,192,220,0.18)';
    ctx.lineWidth   = isSel ? 1.5 : 0.7;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(x, ay); ctx.lineTo(x, y); ctx.stroke();
    ctx.setLineDash([]);

    if (isSel || isHov) { ctx.shadowColor = color; ctx.shadowBlur = isSel ? 14 : 9; }

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    if (isSel) {
      ctx.beginPath();
      ctx.arc(x, y, r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth   = 1.5;
      ctx.globalAlpha = alpha * 0.45;
      ctx.stroke();
    }

    ctx.shadowBlur  = 0;
    ctx.shadowColor = 'transparent';
    ctx.globalAlpha = 1;

    if (labels.has(ev.id) || isSel || isHov) {
      const above  = y < ay;
      const labelY = above ? y - r - 5 : y + r + 5;
      ctx.globalAlpha  = alpha * (isSel || isHov ? 1 : 0.85);
      ctx.font         = `${isSel || isHov ? 'bold ' : ''}${Math.max(9, 9.5 + Math.min(scale * 0.25, 3))}px 'Segoe UI', sans-serif`;
      ctx.fillStyle    = isSel || isHov ? '#fff' : 'rgba(215,218,245,0.9)';
      ctx.textAlign    = 'center';
      ctx.textBaseline = above ? 'bottom' : 'top';
      ctx.fillText(ev.name, x, labelY);
      ctx.globalAlpha  = 1;
    }
  });
}

// ═══════════════════════════════════════════════════════════════════
//  FORMAT HELPERS
// ═══════════════════════════════════════════════════════════════════

function formatYear(y) {
  const abs = Math.abs(Math.round(y));
  if (y < -999)  return `${abs.toLocaleString()} BCE`;
  if (y < 0)     return `${abs} BCE`;
  return `${abs} CE`;
}

// ═══════════════════════════════════════════════════════════════════
//  HIT TEST
// ═══════════════════════════════════════════════════════════════════

function hitTest(mx, my) {
  const evs    = visibleEvents();
  const sorted = [...evs].sort((a, b) => b.imp - a.imp);
  for (const ev of sorted) {
    const x = yearToX(ev.year);
    const y = eventY(ev);
    const r = Math.max(4, ev.imp * 9.5) + 8;
    if ((mx - x) ** 2 + (my - y) ** 2 <= r * r) return ev;
  }
  return null;
}

// ═══════════════════════════════════════════════════════════════════
//  SCALE BAR
// ═══════════════════════════════════════════════════════════════════

function updateScaleBar() {
  const vMin = xToYear(0), vMax = xToYear(W);
  document.getElementById('scaleRange').innerHTML =
    `Viewing: <strong>${formatYear(vMin)}</strong> → <strong>${formatYear(vMax)}</strong>`;
  const n = EVENTS.filter(e => scale >= TIER_SCALE[e.minTier] && activeCategories.has(e.cat)).length;
  document.getElementById('scaleCount').textContent = `${n} / ${EVENTS.length} events visible`;
}

// ═══════════════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════════════

function openPanel(ev) {
  selectedEv = ev;
  document.getElementById('panelTitle').textContent = ev.name;

  const cat = CATS[ev.cat] || { label: ev.cat, color: '#888' };
  document.getElementById('panelMeta').innerHTML = `
    <span class="mtag" style="color:${cat.color};border-color:${cat.color}44">${cat.label}</span>
    <span class="mtag">${formatYear(ev.year)}</span>
  `;

  const locEl = document.getElementById('panelLoc');
  if (ev.loc) {
    locEl.innerHTML = `📍 <span style="color:var(--muted)">${ev.loc[3]}</span>`;
    locEl.style.display = 'flex';
  } else {
    locEl.style.display = 'none';
  }

  document.getElementById('panelDesc').textContent   = ev.desc   || '';
  document.getElementById('panelDetail').textContent = ev.detail || '';

  const rel = EVENTS
    .filter(e => e.id !== ev.id && (e.cat === ev.cat || Math.abs(e.year - ev.year) < 300))
    .sort((a, b) => Math.abs(a.year - ev.year) - Math.abs(b.year - ev.year))
    .slice(0, 5);

  const relEl = document.getElementById('panelRel');
  relEl.innerHTML = rel.length
    ? `<div class="psect">Related Events</div>
       <div class="rel-list">${rel.map(r => `
         <div class="rel-item" data-id="${r.id}">
           <div class="rel-dot" style="background:${(CATS[r.cat]||{color:'#888'}).color}"></div>
           <div>
             <div class="rel-name">${r.name}</div>
             <div class="rel-yr">${formatYear(r.year)}</div>
           </div>
         </div>`).join('')}
       </div>`
    : '';

  relEl.querySelectorAll('.rel-item').forEach(el => {
    el.addEventListener('click', () => {
      const found = EVENTS.find(e => e.id === el.dataset.id);
      if (found) navigateTo(found);
    });
  });

  panel.classList.add('open');

  // Update map after panel opens (so map has final size)
  setTimeout(() => {
    leafMap.invalidateSize();
    updateMap(ev);
  }, 230);

  scheduleRender();
}

function closePanel() {
  selectedEv = null;
  clearMapMarker();
  panel.classList.remove('open');
  setTimeout(() => leafMap.invalidateSize(), 230);
  scheduleRender();
}

function navigateTo(ev) {
  const needed = TIER_SCALE[ev.minTier];
  if (scale < needed * 1.5) scale = needed * 2.5;
  scrollX = (ev.year - MIN_YEAR) * scale - W / 2;
  clampScroll();
  updateScaleBar();
  openPanel(ev);
}

// ═══════════════════════════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════════════════════════

function showTooltip(ev, cx, cy) {
  document.getElementById('ttTitle').textContent = ev.name;
  document.getElementById('ttYear').textContent  = formatYear(ev.year);
  document.getElementById('ttDesc').textContent  = ev.desc || '';
  tooltip.classList.add('show');
  const tw = tooltip.offsetWidth  || 230;
  const th = tooltip.offsetHeight || 80;
  let tx = cx + 16, ty = cy - th / 2;
  if (tx + tw > window.innerWidth  - 8) tx = cx - tw - 16;
  if (ty < 6)                            ty = 6;
  if (ty + th > window.innerHeight - 6) ty = window.innerHeight - th - 6;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

// ═══════════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════════

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 || e.button === 1) {
    e.preventDefault();
    dragging = true; dragStartX = e.clientX; dragBaseX = scrollX;
    canvas.style.cursor = 'grabbing';
  }
});
canvas.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); }, true);

window.addEventListener('mouseup', e => {
  if (!dragging) return;
  const moved = Math.abs(e.clientX - dragStartX);
  dragging = false;
  canvas.style.cursor = 'grab';
  if (moved < 5 && e.button === 0) {
    const rect = canvas.getBoundingClientRect();
    const hit  = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    if (hit) openPanel(hit);
    else     closePanel();
  }
});

window.addEventListener('mousemove', e => {
  if (dragging) {
    scrollX = dragBaseX - (e.clientX - dragStartX);
    clampScroll(); scheduleRender(); return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (mx < 0 || mx > W || my < 0 || my > H) {
    if (hoveredEv) { hoveredEv = null; hideTooltip(); scheduleRender(); }
    return;
  }
  const hit = hitTest(mx, my);
  if (hit !== hoveredEv) { hoveredEv = hit; scheduleRender(); }
  if (hit) {
    showTooltip(hit, e.clientX, e.clientY);
    canvas.style.cursor = 'pointer';
  } else {
    hideTooltip();
    canvas.style.cursor = 'grab';
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect   = canvas.getBoundingClientRect();
  const cx     = e.clientX - rect.left;
  const factor = e.deltaY < 0 ? 1.12 : (1 / 1.12);
  zoomAt(factor, cx);
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const PAN = W * 0.18;
  if (e.key === '+' || e.key === '=') zoomAt(1.3, W / 2);
  if (e.key === '-')                  zoomAt(1 / 1.3, W / 2);
  if (e.key === 'ArrowLeft')  { scrollX -= PAN; clampScroll(); scheduleRender(); updateScaleBar(); }
  if (e.key === 'ArrowRight') { scrollX += PAN; clampScroll(); scheduleRender(); updateScaleBar(); }
  if (e.key === 'Escape')     closePanel();
});

let _touch = null, _pinch = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    _touch = { cx: e.touches[0].clientX, sx: scrollX }; _pinch = null;
  } else if (e.touches.length === 2) {
    _pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    _touch = null;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && _touch) {
    scrollX = _touch.sx - (e.touches[0].clientX - _touch.cx);
    clampScroll(); scheduleRender(); updateScaleBar();
  } else if (e.touches.length === 2 && _pinch != null) {
    const d   = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const mid = (e.touches[0].clientX + e.touches[1].clientX) / 2 - canvas.getBoundingClientRect().left;
    zoomAt(d / _pinch, mid); _pinch = d;
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { _touch = null; _pinch = null; });

// ═══════════════════════════════════════════════════════════════════
//  BUILD UI
// ═══════════════════════════════════════════════════════════════════

function buildUI() {
  const eraBtns = document.getElementById('eraBtns');
  ERA_JUMPS.forEach(e => {
    const btn = document.createElement('button');
    btn.className   = 'era-btn';
    btn.textContent = e.label;
    btn.addEventListener('click', () => jumpTo(e.min, e.max));
    eraBtns.appendChild(btn);
  });

  document.getElementById('btnZoomIn').addEventListener('click',  () => zoomAt(1.5, W / 2));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomAt(1 / 1.5, W / 2));
  document.getElementById('panelClose').addEventListener('click', closePanel);

  const legendItems = document.getElementById('legendItems');
  Object.entries(CATS).forEach(([key, cat]) => {
    const item = document.createElement('div');
    item.className = 'legend-item active';
    item.innerHTML = `<div class="legend-dot" style="background:${cat.color}"></div><span>${cat.label}</span>`;
    item.addEventListener('click', () => {
      if (activeCategories.has(key)) {
        if (activeCategories.size > 1) { activeCategories.delete(key); item.classList.remove('active'); }
      } else {
        activeCategories.add(key); item.classList.add('active');
      }
      updateScaleBar(); scheduleRender();
    });
    legendItems.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════════════════
//  RESIZE & INIT
// ═══════════════════════════════════════════════════════════════════

const DEFAULT_MIN = -4000, DEFAULT_MAX = 2026;
let _firstResize = true;

function resize() {
  const rect    = area.getBoundingClientRect();
  W             = rect.width;
  H             = rect.height;
  canvas.width  = W;
  canvas.height = H;

  if (_firstResize) {
    _firstResize = false;
    const pad = (DEFAULT_MAX - DEFAULT_MIN) * 0.03;
    scale   = W / (DEFAULT_MAX - DEFAULT_MIN + pad * 2);
    scrollX = (DEFAULT_MIN - pad - MIN_YEAR) * scale;
  } else {
    const minS = W / (MAX_YEAR - MIN_YEAR);
    if (scale < minS) { scale = minS; scrollX = 0; }
  }

  clampScroll();
  updateScaleBar();
  scheduleRender();
}

window.addEventListener('resize', () => { resize(); leafMap.invalidateSize(); });

buildUI();
resize();
</script>
</body>
</html>
