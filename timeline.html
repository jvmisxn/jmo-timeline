<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human History Timeline</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060612;
      --surface:    #0c0c20;
      --surface2:   #11112a;
      --surface3:   #181834;
      --border:     #1c1c3a;
      --border-hi:  #272750;
      --text:       #e2e2f0;
      --text-dim:   #9898c0;
      --muted:      #55557a;
      --accent:     #6366f1;
      --accent-hi:  #818cf8;
      --accent-glow:rgba(99,102,241,.18);
      --accent-dim: rgba(99,102,241,.08);
      --radius-sm:  6px;
      --radius:     10px;
      --radius-lg:  16px;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; }

    /* ── Header ─────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 0 18px; height: 50px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: nowrap;
      position: relative; z-index: 10;
    }
    header::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--accent-glow) 30%, var(--accent-glow) 70%, transparent 100%);
    }

    .header-title { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
    .header-title h1 {
      font-size: .95rem; font-weight: 700; white-space: nowrap; letter-spacing: -.01em;
      background: linear-gradient(135deg, #c7d2fe 0%, var(--accent-hi) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sep { width: 1px; height: 16px; background: var(--border-hi); flex-shrink: 0; }

    .era-btns { display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; }
    .era-btns::-webkit-scrollbar { display: none; }
    .era-btn {
      background: transparent; border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: 20px; padding: 3px 12px; font-size: .64rem; font-family: inherit;
      cursor: pointer; transition: all .18s; white-space: nowrap; letter-spacing: .02em;
    }
    .era-btn:hover {
      background: var(--accent-dim); border-color: var(--accent);
      color: var(--accent-hi);
    }

    .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }

    /* ── Search ─────────────────────────────── */
    .search-wrap {
      position: relative; display: flex; align-items: center;
    }
    .search-input {
      width: 0; opacity: 0; padding: 0; border: none;
      background: var(--surface3); color: var(--text);
      border-radius: 20px; font-size: .67rem; font-family: inherit;
      transition: width .25s, opacity .25s, padding .25s, border .15s;
      outline: none;
    }
    .search-wrap.open .search-input {
      width: 170px; opacity: 1; padding: 5px 14px 5px 30px;
      border: 1px solid var(--border-hi);
    }
    .search-wrap.open .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute; left: 0; z-index: 2;
      width: 28px; height: 28px; background: transparent;
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: 50%; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .15s;
      flex-shrink: 0;
    }
    .search-wrap.open .search-icon {
      left: 2px; border-color: transparent; background: transparent;
      pointer-events: none;
    }
    .search-icon:hover { border-color: var(--accent); color: var(--accent-hi); }
    .search-results {
      position: absolute; top: calc(100% + 6px); right: 0;
      width: 280px; max-height: 320px; overflow-y: auto;
      background: rgba(12,12,32,.97); backdrop-filter: blur(18px);
      border: 1px solid var(--border-hi); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.7);
      display: none; z-index: 2000;
    }
    .search-results.open { display: block; }
    .search-result {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; cursor: pointer; transition: background .1s;
    }
    .search-result:hover, .search-result.active {
      background: var(--accent-dim);
    }
    .search-result-name { font-size: .72rem; font-weight: 500; color: var(--text); }
    .search-result-yr   { font-size: .6rem; color: var(--muted); }
    .search-result-cat  { font-size: .56rem; color: var(--text-dim); }
    .search-empty {
      padding: 14px; font-size: .67rem; color: var(--muted); text-align: center;
    }

    /* ── Stories button (header) ────────────── */
    .stories-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface3); border: 1px solid var(--border-hi);
      color: var(--text-dim); border-radius: 20px;
      padding: 5px 14px; font-size: .67rem; font-family: inherit;
      font-weight: 500; cursor: pointer; transition: all .18s;
      letter-spacing: .02em; white-space: nowrap;
    }
    .stories-btn:hover {
      background: var(--accent-dim); border-color: var(--accent);
      color: var(--accent-hi); box-shadow: 0 0 14px var(--accent-glow);
    }

    /* ── Story active bar ───────────────────── */
    .story-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 18px;
      background: linear-gradient(90deg, rgba(99,102,241,.12) 0%, transparent 70%);
      border-bottom: 1px solid rgba(99,102,241,.28);
      flex-shrink: 0; font-size: .72rem; color: var(--accent-hi);
    }
    .story-bar.hidden { display: none; }
    .story-bar-icon   { font-size: 1rem; line-height: 1; }
    .story-bar-name   { font-weight: 600; }
    .story-bar-count  { color: var(--muted); font-size: .63rem; }
    .story-exit-btn {
      margin-left: auto; background: transparent;
      border: 1px solid rgba(99,102,241,.35); color: var(--muted);
      border-radius: 20px; padding: 2px 10px; font-size: .61rem;
      font-family: inherit; cursor: pointer; transition: all .15s;
    }
    .story-exit-btn:hover { border-color: var(--accent); color: var(--accent-hi); }

    /* ── Stories modal ──────────────────────── */
    #storiesModal {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(6,6,18,.88); backdrop-filter: blur(22px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    #storiesModal.open { display: flex; }

    .stories-modal-inner {
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      border-radius: 20px;
      width: 100%; max-width: 860px;
      max-height: 86vh; overflow-y: auto;
      box-shadow: 0 32px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(99,102,241,.15);
    }
    .stories-modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 24px 26px 18px; border-bottom: 1px solid var(--border);
      gap: 16px; position: sticky; top: 0;
      background: var(--surface2); z-index: 1;
      border-radius: 20px 20px 0 0;
    }
    .stories-modal-title { display: flex; align-items: flex-start; gap: 14px; }
    .stories-modal-icon  { font-size: 1.8rem; line-height: 1; margin-top: 2px; }
    .stories-modal-title h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .stories-modal-title p  { font-size: .72rem; color: var(--text-dim); line-height: 1.5; }
    .stories-modal-close {
      width: 30px; height: 30px; background: var(--surface3);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: 50%; cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
    }
    .stories-modal-close:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px; padding: 20px 26px 26px;
    }
    .story-card {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px;
      cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
    }
    .story-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--accent-dim) 0%, transparent 60%);
      opacity: 0; transition: opacity .2s;
    }
    .story-card:hover { border-color: var(--accent); transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(99,102,241,.2); }
    .story-card:hover::before { opacity: 1; }
    .story-card.active { border-color: var(--accent); background: rgba(99,102,241,.12); }
    .story-card-icon  { font-size: 2rem; line-height: 1; margin-bottom: 12px; display: block; }
    .story-card-name  { font-size: .88rem; font-weight: 700; margin-bottom: 5px; color: var(--text); }
    .story-card-range { font-size: .6rem; color: var(--accent-hi); font-weight: 500;
      letter-spacing: .04em; margin-bottom: 8px; }
    .story-card-desc  { font-size: .68rem; color: var(--text-dim); line-height: 1.55; }
    .story-card-count { margin-top: 12px; font-size: .6rem; color: var(--muted);
      display: flex; align-items: center; gap: 4px; }
    .story-card-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

    /* ── Scale + info bar ───────────────────── */
    .scale-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 18px; background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: .61rem; color: var(--muted); flex-shrink: 0; gap: 12px;
      letter-spacing: .01em;
    }
    .scale-bar strong { color: var(--accent-hi); font-weight: 600; }
    .scale-count { color: var(--muted); }

    /* ── Legend / filter bar ────────────────── */
    .legend-bar {
      display: flex; align-items: center; gap: 6px; padding: 5px 18px;
      background: var(--bg); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }
    .legend-bar::-webkit-scrollbar { display: none; }
    .legend-label {
      font-size: .58rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .09em; white-space: nowrap; flex-shrink: 0;
    }
    .legend-items { display: flex; gap: 4px; flex-wrap: nowrap; }
    .legend-item {
      display: flex; align-items: center; gap: 5px; font-size: .62rem;
      color: var(--muted); cursor: pointer; padding: 3px 10px;
      border-radius: 20px; border: 1px solid transparent;
      transition: all .15s; white-space: nowrap;
    }
    .legend-item:hover { border-color: var(--border-hi); color: var(--text-dim); background: var(--surface3); }
    .legend-item.active { border-color: var(--border-hi); color: var(--text); background: var(--surface2); }
    .legend-item svg { flex-shrink: 0; }

    /* ── Main layout ────────────────────────── */
    .main { flex: 1; display: flex; overflow: hidden; position: relative; min-height: 0; isolation: isolate; }
    .left-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* ── Map ────────────────────────────────── */
    #map { height: 380px; flex-shrink: 0; background: var(--bg); position: relative; }
    .map-hint-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(6,6,18,.82); backdrop-filter: blur(10px);
      border: 1px solid var(--border-hi); border-radius: 20px;
      padding: 6px 16px; font-size: .64rem; color: var(--muted);
      pointer-events: none; z-index: 500; white-space: nowrap;
      transition: opacity .3s; letter-spacing: .02em;
    }
    .map-hint-overlay.hidden { opacity: 0; pointer-events: none; }
    .leaflet-container { background: var(--bg) !important; }
    .leaflet-control-attribution { display: none !important; }

    /* Pulsing marker */
    .hist-marker { width: 14px; height: 14px; border-radius: 50%; position: relative; }
    .hist-marker::after {
      content: ''; position: absolute; top: -5px; left: -5px;
      width: 24px; height: 24px; border-radius: 50%; background: inherit; opacity: .4;
      animation: pulse-ring 1.6s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(.7); opacity: .4; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Map collapse button */
    .map-toggle-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 10;
      background: rgba(6,6,18,.85); backdrop-filter: blur(10px);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: 20px; padding: 4px 13px; font-size: .61rem;
      font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .map-toggle-btn:hover { border-color: var(--accent); color: var(--accent-hi); }

    /* ── Map resize handle ──────────────────── */
    #mapResizeHandle {
      height: 5px; flex-shrink: 0;
      background: var(--border); cursor: ns-resize;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    #mapResizeHandle:hover, #mapResizeHandle.dragging { background: var(--accent); }
    #mapResizeHandle::after {
      content: ''; width: 36px; height: 2px; border-radius: 2px;
      background: rgba(255,255,255,.12); pointer-events: none;
    }

    /* ── Canvas area ────────────────────────── */
    .canvas-area { flex: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0; }
    #c { display: block; cursor: grab; }
    .hint {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(6,6,18,.78); backdrop-filter: blur(12px);
      border: 1px solid var(--border-hi); border-radius: 20px;
      padding: 5px 16px; font-size: .6rem; color: var(--muted);
      pointer-events: none; white-space: nowrap; letter-spacing: .025em;
    }

    /* ── Tooltip ────────────────────────────── */
    #tooltip {
      position: fixed; z-index: 1100;
      background: rgba(12,12,32,.95); backdrop-filter: blur(18px);
      border: 1px solid var(--border-hi); border-radius: var(--radius);
      padding: 10px 14px; max-width: 240px;
      box-shadow: 0 8px 36px rgba(0,0,0,.65), 0 0 0 1px var(--accent-glow);
      pointer-events: none; opacity: 0; transition: opacity .1s;
    }
    #tooltip.show { opacity: 1; }
    #tooltip h4 { font-size: .78rem; font-weight: 600; margin-bottom: 3px; color: var(--text); }
    #tooltip .tt-yr   { font-size: .62rem; color: var(--accent-hi); margin-bottom: 4px; font-weight: 500; }
    #tooltip .tt-desc { font-size: .67rem; color: var(--text-dim); line-height: 1.45; }

    /* ── Popup (floating dot card) ──────────── */
    #popup {
      position: absolute; z-index: 1200;
      width: 360px; max-height: 64vh;
      background: rgba(11,11,28,.97); backdrop-filter: blur(24px);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgba(0,0,0,.85),
                  0 0 0 1px rgba(99,102,241,.14),
                  inset 0 1px 0 rgba(255,255,255,.05);
      display: flex; flex-direction: column; overflow: hidden;
      opacity: 0; pointer-events: none;
      transform: translateY(10px) scale(0.95);
      transition: opacity .2s cubic-bezier(.16,1,.3,1), transform .2s cubic-bezier(.16,1,.3,1);
    }
    #popup.open { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }

    /* Arrow */
    .pu-arrow {
      position: absolute; width: 12px; height: 12px;
      background: rgba(11,11,28,.97); border: 1px solid var(--border-hi);
      border-radius: 2px; transform: rotate(45deg); z-index: 1;
    }
    #popup.arrow-above .pu-arrow { bottom: -6px; border-top-color: transparent; border-left-color: transparent; }
    #popup.arrow-below .pu-arrow { top: -6px; border-bottom-color: transparent; border-right-color: transparent; }

    /* Popup header */
    .ph {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 16px 16px 12px; border-bottom: 1px solid var(--border);
      position: relative; z-index: 2;
      background: linear-gradient(180deg, var(--surface3) 0%, transparent 100%);
    }
    .ph h2 { font-size: .92rem; font-weight: 700; line-height: 1.35; flex: 1; color: var(--text); }
    .ph-close {
      width: 24px; height: 24px; background: var(--surface3);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; margin-left: 10px; transition: all .15s; flex-shrink: 0;
    }
    .ph-close:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Filter row */
    .ph-filter {
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .filter-related-btn {
      font-size: .62rem; font-family: inherit;
      background: transparent; border: 1px solid var(--border-hi);
      color: var(--muted); border-radius: 20px;
      padding: 3px 12px; cursor: pointer; transition: all .15s;
    }
    .filter-related-btn:hover { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-dim); }
    .filter-related-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-note { font-size: .58rem; color: var(--muted); }

    /* Popup body */
    .pb { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .pmeta { display: flex; flex-wrap: wrap; gap: 5px; }
    .mtag {
      background: var(--surface3); border: 1px solid var(--border-hi);
      border-radius: 20px; padding: 2px 10px; font-size: .6rem;
      color: var(--text-dim); letter-spacing: .02em;
    }
    .pdesc   { font-size: .79rem; line-height: 1.7;  color: var(--text); }
    .pdetail { font-size: .73rem; line-height: 1.75; color: var(--text-dim); }
    .psect   {
      font-size: .58rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 6px;
    }
    .map-loc-tag { font-size: .62rem; color: var(--accent-hi); display: flex; align-items: center; gap: 5px; }
    .span-tag    { font-size: .62rem; color: var(--text-dim);  display: flex; align-items: center; gap: 5px; }

    /* ── Gallery ────────────────────────────── */
    .gallery-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .gallery-scroll::-webkit-scrollbar { height: 3px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
    .gallery-img-wrap { flex-shrink: 0; width: 150px; }
    .gallery-img-wrap img {
      width: 150px; height: 95px; object-fit: cover;
      border-radius: var(--radius-sm); border: 1px solid var(--border-hi);
      display: block; background: var(--surface2); cursor: pointer;
      transition: all .18s;
    }
    .gallery-img-wrap img:hover { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
    .gallery-caption {
      font-size: .56rem; color: var(--muted); margin-top: 4px;
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gallery-loading { font-size: .63rem; color: var(--muted); padding: 6px 0; display: flex; align-items: center; gap: 7px; }
    .gallery-spinner {
      width: 12px; height: 12px; border: 2px solid var(--border-hi);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Lightbox ───────────────────────────── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.92); backdrop-filter: blur(6px);
      z-index: 9999; display: none; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 88vh; border-radius: var(--radius); box-shadow: 0 0 80px rgba(0,0,0,.9); }
    #lightboxClose {
      position: absolute; top: 18px; right: 22px; background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 1rem;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    #lightboxClose:hover { background: rgba(255,255,255,.2); }

    /* ── Wikipedia extract ──────────────────── */
    .wiki-section { display: flex; flex-direction: column; gap: 8px; }
    .wiki-extract {
      font-size: .71rem; line-height: 1.75; color: var(--text-dim);
      display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .wiki-extract.expanded { -webkit-line-clamp: unset; }
    .wiki-expand-btn {
      font-size: .6rem; color: var(--accent-hi); background: none; border: none;
      cursor: pointer; padding: 0; font-family: inherit; text-align: left;
      opacity: .8; transition: opacity .15s;
    }
    .wiki-expand-btn:hover { opacity: 1; }
    .wiki-link-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface3); border: 1px solid var(--border-hi);
      color: var(--text-dim); border-radius: 20px;
      padding: 4px 12px; font-size: .61rem; font-family: inherit;
      cursor: pointer; text-decoration: none; transition: all .15s;
      align-self: flex-start;
    }
    .wiki-link-btn:hover {
      border-color: var(--accent); color: var(--accent-hi);
      background: var(--accent-dim);
    }

    loc:[34.12,35.65,10,'Byblos, Lebanon'],
    desc:'The Phoenicians develop the first widely-used alphabet — ancestor of most scripts today.',
    detail:'The Phoenician alphabet (~22 consonants) was adopted by the Greeks who added vowels, creating the ancestor of Latin, Cyrillic, Arabic, and Hebrew scripts.' },

  { id:'e_olympics', name:'Ancient Olympics', year:-776, minTier:2, cat:'society', imp:0.72,
    loc:[37.64,21.63,12,'Olympia, Greece'],
    desc:'The first recorded Olympic Games are held at Olympia, Greece.',
    detail:'Held every four years for over 1,000 years in honour of Zeus, the Olympics provided a pan-Hellenic truce. The modern Games, revived in 1896, are their direct descendant.' },

  { id:'e_confucius', name:'Confucius', year:-551, minTier:2, cat:'religion', imp:0.85,
    loc:[35.60,117.04,10,'Qufu, China'],
    desc:"Confucius codifies ethics, governance, and social harmony in China.",
    detail:"Confucius (551–479 BCE) developed a philosophy of moral cultivation and virtuous governance. Confucianism became the dominant ethical framework of East Asian civilisation for 2,500 years." },

  { id:'e_persia', name:'Persian Empire', year:-550, minTier:2, cat:'politics', imp:0.85,
    span:[-550,-330],
    loc:[29.93,52.88,7,'Persepolis, Iran'],
    desc:'Cyrus the Great founds the Achaemenid Empire — the largest the world had yet seen.',
    detail:'Cyrus II united Persia, then conquered Lydia and Babylon. At its height under Darius I, the empire stretched from Greece to India — 5.5 million km². Famous for religious tolerance and the Royal Road.' },

  { id:'e_buddha', name:'Buddhism Founded', year:-528, minTier:2, cat:'religion', imp:0.9,
    loc:[24.70,84.99,12,'Bodh Gaya, India'],
    desc:'Siddhartha Gautama attains enlightenment; Buddhism is born.',
    detail:"Siddhartha Gautama's enlightenment c. 528 BCE founded one of history's great religions, shaping the cultures of India, Southeast Asia, China, Japan, Korea, and Tibet." },

  { id:'e_athens', name:'Greek Democracy', year:-508, minTier:2, cat:'politics', imp:0.9,
    loc:[37.97,23.73,11,'Athens, Greece'],
    desc:"Cleisthenes establishes the world's first democratic government in Athens.",
    detail:"Cleisthenes' reforms of 508 BCE gave all male citizens the right to vote in the Assembly. This model profoundly influenced republican and democratic thought for two millennia." },

  { id:'e_library_alex', name:'Library of Alexandria', year:-283, minTier:2, cat:'society', imp:0.78,
    loc:[31.20,29.91,12,'Alexandria, Egypt'],
    desc:"The greatest library of the ancient world gathers the sum of human knowledge.",
    detail:'Founded under Ptolemy I (~283 BCE), the Library held an estimated 400,000–700,000 scrolls and attracted scholars from across the ancient world.' },

  { id:'e_alexander', name:'Alexander the Great', year:-334, minTier:2, cat:'politics', imp:0.9,
    span:[-334,-323],
    loc:[40.8,22.5,7,'Pella, Macedonia'],
    desc:'Alexander conquers a vast empire stretching from Greece to India.',
    detail:'Between 334 and 323 BCE, Alexander of Macedon conquered 2 million square miles in 11 years, spreading Greek culture across Persia, Egypt, Central Asia, and northwest India.' },

  { id:'e_qin', name:'China Unified', year:-221, minTier:2, cat:'politics', imp:0.9,
    loc:[34.27,108.93,6,"Xi'an, China"],
    desc:"Qin Shi Huang unifies China — the world's most populous state.",
    detail:"Qin Shi Huang defeated six rival kingdoms. He standardised weights, measures, currency, and writing; built the first Great Wall sections; created the Terracotta Army. His model defined Chinese governance for 2,000 years." },

  { id:'e_han_dynasty', name:'Han Dynasty', year:-202, minTier:2, cat:'politics', imp:0.80,
    span:[-202,220],
    loc:[34.27,108.93,6,"Xi'an, China"],
    desc:'The Han Dynasty unifies and expands China, opening the Silk Road.',
    detail:'The Han Dynasty (202 BCE–220 CE) established the civil service exam system, opened Silk Road trade, and consolidated Chinese identity so deeply that the majority ethnic group is still called the Han people.' },

  { id:'e_rome_rep', name:'Roman Republic', year:-509, minTier:2, cat:'politics', imp:0.85,
    span:[-509,-27],
    loc:[41.89,12.48,10,'Rome, Italy'],
    desc:'Romans overthrow their king and establish a republic.',
    detail:"The overthrow of Tarquin c. 509 BCE established the Roman Republic with elected consuls, the Senate, and written law. Republican Rome developed concepts of citizenship, separation of powers, and legal equality." },

  { id:'e_silk_road', name:'Silk Road', year:-130, minTier:2, cat:'exploration', imp:0.85,
    span:[-130,1450],
    loc:[39.9,60.0,4,'Central Asia'],
    desc:'Trade routes connect China to the Mediterranean, spreading goods and ideas.',
    detail:"The Silk Road connected Han-dynasty China to the Roman Empire from ~130 BCE. Beyond silk, it transmitted Buddhism, Islam, paper-making, gunpowder, and mathematical concepts across Eurasia." },

  { id:'e_caesar', name:'Roman Empire', year:-27, minTier:2, cat:'politics', imp:0.9,
    span:[-27,476],
    loc:[41.89,12.48,10,'Rome, Italy'],
    desc:'Augustus founds the Roman Empire — it will dominate the Mediterranean for 500 years.',
    detail:"Caesar's assassination (44 BCE) ended the Republic; his heir Octavian became Emperor Augustus in 27 BCE. The empire shaped Western law, language, architecture, and culture." },

  { id:'e_jesus', name:'Life of Jesus Christ', year:4, minTier:2, cat:'religion', imp:1.0,
    loc:[31.78,35.23,11,'Jerusalem'],
    desc:'Jesus of Nazareth preaches in Judaea; Christianity is founded after his death.',
    detail:"Jesus was crucified c. 30–33 CE. His followers founded Christianity, which became the Roman Empire's official religion by 380 CE and eventually the world's largest religion, with ~2.4 billion adherents today." },

  { id:'e_maya_classic', name:'Maya Civilization', year:250, minTier:2, cat:'society', imp:0.80,
    span:[250,900],
    loc:[17.25,-89.62,7,'Maya Lowlands, Guatemala'],
    desc:"The Maya build cities, develop a calendar, and create the Americas' only full writing system.",
    detail:'The Maya Classic period (250–900 CE) saw city-states like Tikal and Palenque flourish. The Maya developed a precise calendar, advanced mathematics (including zero), and hieroglyphic writing.' },

  { id:'e_byzantine', name:'Byzantine Empire', year:330, minTier:2, cat:'politics', imp:0.82,
    span:[330,1453],
    loc:[41.01,28.97,11,'Constantinople (Istanbul)'],
    desc:"Constantinople — centre of the Byzantine Empire — preserves Roman and Greek learning for 1,100 years.",
    detail:"Constantine I founded Constantinople in 330 CE. The Byzantine Empire preserved ancient knowledge, produced Justinian's Code, and held the eastern Mediterranean until its fall in 1453." },

  { id:'e_rome_fall', name:'Fall of Western Rome', year:476, minTier:2, cat:'politics', imp:0.9,
    loc:[41.89,12.48,8,'Rome, Italy'],
    desc:'The Western Roman Empire falls, ending classical antiquity.',
    detail:"The deposition of Romulus Augustulus in 476 CE marks the end of the Western Roman Empire. It ushered in the Middle Ages: fragmented kingdoms, declining urban life, and the rise of the Catholic Church." },

  // ── TIER 3 ──────────────────────────────────────────────────────────
  { id:'e_justinian', name:'Justinian Code', year:529, minTier:3, cat:'politics', imp:0.76,
    loc:[41.01,28.97,10,'Constantinople'],
    desc:"Justinian codifies Roman law — the foundation of European legal systems.",
    detail:"The Corpus Juris Civilis (529 CE) consolidated centuries of Roman law. Rediscovered in medieval Europe, it became the basis for the legal systems of France, Germany, Spain, Italy, and most of the non-common-law world." },

  { id:'e_islam', name:'Islam Founded', year:610, minTier:3, cat:'religion', imp:1.0,
    span:[622,750],
    loc:[21.42,39.82,10,'Mecca, Saudi Arabia'],
    desc:'Muhammad receives his first revelation; Islam rapidly expands across the world.',
    detail:"Muhammad ibn Abdullah received his first revelation in 610 CE. Within a century of his death (632 CE), Islamic armies conquered Arabia, Persia, Egypt, and Spain. Islam now has 1.8 billion adherents." },

  { id:'e_zero', name:'Indian Numerals & Zero', year:628, minTier:3, cat:'technology', imp:0.80,
    loc:[23.18,77.40,5,'India'],
    desc:'Indian mathematicians formalise zero and the decimal positional number system.',
    detail:'Brahmagupta (628 CE) formalised the rules for zero and negative numbers. The Hindu-Arabic numeral system (0–9) was transmitted to Europe via Islamic scholars, enabling modern mathematics, science, and commerce.' },

  { id:'e_charlemagne', name:"Charlemagne's Empire", year:800, minTier:3, cat:'politics', imp:0.85,
    span:[768,814],
    loc:[50.77,6.08,9,'Aachen, Germany'],
    desc:'Charlemagne is crowned Holy Roman Emperor, uniting much of western Europe.',
    detail:"Charlemagne's coronation by Pope Leo III (Christmas 800 CE) symbolised the alliance of church and state. His Carolingian Empire covered modern France, Germany, and Italy, and his promotion of literacy laid foundations for European civilisation." },

  { id:'e_abbasid', name:'Abbasid Caliphate', year:762, minTier:3, cat:'politics', imp:0.80,
    span:[762,1258],
    loc:[33.34,44.40,9,'Baghdad, Iraq'],
    desc:"Baghdad becomes the world's largest city and centre of Islamic Golden Age learning.",
    detail:"The Abbasid Caliphate (750–1258 CE) established Baghdad as the intellectual capital of the world. The House of Wisdom made breakthroughs in algebra, astronomy, medicine, and optics." },

  { id:'e_vikings', name:'Viking Age', year:793, minTier:3, cat:'exploration', imp:0.8,
    span:[793,1066],
    loc:[59.9,10.75,5,'Scandinavia'],
    desc:'Norse raiders and explorers range from North America to Russia.',
    detail:"The Viking Age (793–1066 CE) saw Norse people raid, trade, settle, and explore. They settled Iceland, Greenland, and briefly North America (Vinland, c. 1000 CE), while trading from Britain to Byzantium." },

  { id:'e_gunpowder_china', name:'Chinese Gunpowder', year:850, minTier:3, cat:'technology', imp:0.78,
    loc:[35.0,105.0,4,'China'],
    desc:'Chinese alchemists develop gunpowder — a discovery that will transform warfare.',
    detail:"Chinese alchemists discovered gunpowder (~9th century CE). By the 10th century it was used in fire-arrows and bombs. Transmitted westward via the Mongols and Silk Road, gunpowder shattered medieval fortifications." },

  { id:'e_song_dynasty', name:'Song Dynasty China', year:960, minTier:3, cat:'society', imp:0.78,
    span:[960,1279],
    loc:[30.26,120.15,7,'Hangzhou, China'],
    desc:"China's Song Dynasty achieves the world's first industrial economy and printing revolution.",
    detail:"The Song Dynasty (960–1279) produced movable type printing (1040), paper money, the magnetic compass, and iron/steel production dwarfing contemporary Europe. Hangzhou had over 1 million inhabitants." },

  { id:'e_leif_erikson', name:'Norse Reach Americas', year:1000, minTier:3, cat:'exploration', imp:0.74,
    loc:[51.6,-55.5,8,"L'Anse aux Meadows, Newfoundland"],
    desc:"Leif Erikson establishes a Norse settlement in North America — 500 years before Columbus.",
    detail:"Around 1000 CE, Norse explorers established Vinland — confirmed at L'Anse aux Meadows, Newfoundland. The first confirmed European contact with the Americas, though the colony was short-lived." },

  { id:'e_crusades', name:'The Crusades', year:1096, minTier:3, cat:'conflict', imp:0.85,
    span:[1096,1291],
    loc:[31.78,35.23,9,'Jerusalem'],
    desc:'Christian armies launch religious wars for the Holy Land.',
    detail:"Pope Urban II called the First Crusade in 1096; Jerusalem fell in 1099. Nine major Crusades over 200 years intensified Christian-Muslim conflict and spurred trade and cultural exchange." },

  { id:'e_angkor', name:'Angkor Wat', year:1113, minTier:3, cat:'society', imp:0.74,
    loc:[13.41,103.87,13,'Angkor Wat, Cambodia'],
    desc:'The Khmer Empire builds Angkor Wat — the largest religious monument ever constructed.',
    detail:"Angkor Wat was built under Suryavarman II (1113–1150 CE) as a Hindu temple complex covering 1.6 km². The Khmer Empire at its peak controlled much of Southeast Asia." },

  { id:'e_mongols', name:'Mongol Empire', year:1206, minTier:3, cat:'politics', imp:0.9,
    span:[1206,1368],
    loc:[47.9,106.9,5,'Ulaanbaatar, Mongolia'],
    desc:"Genghis Khan creates the largest contiguous land empire in history.",
    detail:"Genghis Khan united the Mongol tribes in 1206. His campaigns created an empire of 24 million km². Conquered 40 million people (10% of world population) but unified Eurasian trade routes." },

  { id:'e_magna', name:'Magna Carta', year:1215, minTier:3, cat:'politics', imp:0.9,
    loc:[51.44,-0.56,12,'Runnymede, England'],
    desc:'English barons force King John to accept limits on royal power.',
    detail:"The Magna Carta (1215) established that even the king was subject to the rule of law, enshrining habeas corpus. It became the foundational document for constitutional government." },

  { id:'e_aztec_found', name:'Aztec Empire', year:1325, minTier:3, cat:'politics', imp:0.80,
    span:[1325,1521],
    loc:[19.43,-99.13,11,'Tenochtitlan (Mexico City)'],
    desc:"The Aztecs found Tenochtitlan — a city larger than any in contemporary Europe.",
    detail:"Founded in 1325 on Lake Texcoco, Tenochtitlan grew to 200,000–300,000 people by 1500. The Aztec Empire controlled central Mexico through a tribute system until its conquest by Cortés in 1521." },

  { id:'e_mali', name:'Mali Empire & Mansa Musa', year:1312, minTier:3, cat:'politics', imp:0.8,
    span:[1235,1600],
    loc:[12.65,-8.0,5,'Mali Empire, West Africa'],
    desc:"The world's wealthiest empire controls Africa's gold and salt trade.",
    detail:"Under Mansa Musa (1312–1337), the Mali Empire produced most of the world's gold. His 1324 pilgrimage to Mecca — distributing so much gold he caused inflation — demonstrated sub-Saharan Africa's extraordinary wealth." },

  { id:'e_hundred_years', name:"Hundred Years' War", year:1337, minTier:3, cat:'conflict', imp:0.74,
    span:[1337,1453],
    loc:[48.85,2.35,6,'France'],
    desc:"England and France fight a century-long war that forges both nations' identities.",
    detail:"The Hundred Years' War (1337–1453) was a series of conflicts over the French throne. Joan of Arc's campaigns (1429–1431) turned the tide for France. The war gave birth to French national identity." },

  { id:'e_black_death', name:'Black Death', year:1347, minTier:3, cat:'environment', imp:0.95,
    loc:[45.46,9.19,5,'Europe'],
    desc:"Bubonic plague kills 30–60% of Europe's population.",
    detail:'The Black Death (1347–1351) killed 75–200 million people across Eurasia. It created labour shortages that broke serfdom, accelerated the Renaissance, and fundamentally reshaped European society.' },

  { id:'e_renaissance', name:'Renaissance', year:1350, minTier:3, cat:'society', imp:0.9,
    span:[1350,1600],
    loc:[43.77,11.25,10,'Florence, Italy'],
    desc:'A cultural rebirth in Italy revives classical learning and launches modern art.',
    detail:"Beginning in 14th-century Italian city-states, the Renaissance rediscovered ancient Greek and Roman texts. Leonardo da Vinci, Michelangelo, and Petrarch revolutionised art, literature, and humanist philosophy." },

  { id:'e_inca_empire', name:'Inca Empire', year:1438, minTier:3, cat:'politics', imp:0.78,
    span:[1438,1533],
    loc:[-13.53,-71.97,9,'Cusco, Peru'],
    desc:'The Inca build the largest empire in pre-Columbian America.',
    detail:"The Inca Empire at its height (1438–1533) stretched 4,300 km along the Andes, linked by 40,000 km of roads. Conquered by Francisco Pizarro in 1533 with just 168 men." },

  { id:'e_gutenberg', name:'Printing Press', year:1440, minTier:3, cat:'technology', imp:0.95,
    loc:[49.99,8.27,11,'Mainz, Germany'],
    desc:"Gutenberg's movable-type press democratises knowledge across Europe.",
    detail:"Gutenberg's printing press (c. 1440) allowed books to be produced 1,000× faster than hand-copying. By 1500, over 20 million books had been printed, accelerating the Renaissance and fuelling the Reformation." },

  { id:'e_fall_const', name:'Fall of Constantinople', year:1453, minTier:3, cat:'conflict', imp:0.83,
    loc:[41.01,28.97,11,'Constantinople (Istanbul)'],
    desc:'The Ottoman Turks capture Constantinople, ending the Byzantine Empire.',
    detail:"Mehmed II's 53-day siege (1453) ended the 1,100-year-old Byzantine Empire. It drove Greek scholars and texts to Italy, accelerating the Renaissance, and cut overland Silk Road routes." },

  { id:'e_ottoman', name:'Ottoman Empire', year:1299, minTier:3, cat:'politics', imp:0.85,
    span:[1299,1922],
    loc:[41.01,28.97,8,'Constantinople (Istanbul)'],
    desc:'The Ottomans build an empire spanning three continents for over 600 years.',
    detail:"Founded by Osman I c. 1299, the Ottoman Empire reached its height under Suleiman the Magnificent (1520–1566), controlling Southeast Europe, the Middle East, and North Africa." },

  { id:'e_columbus', name:'Columbus Reaches Americas', year:1492, minTier:3, cat:'exploration', imp:0.95,
    loc:[24.0,-75.0,7,'Bahamas / Caribbean'],
    desc:'Columbus triggers permanent contact between the Old and New Worlds.',
    detail:"Columbus's 1492 voyage initiated the Columbian Exchange — transfer of plants, animals, diseases, and cultures between hemispheres. European diseases killed an estimated 90% of Indigenous American populations." },

  // ── TIER 4 ──────────────────────────────────────────────────────────
  { id:'e_reform', name:'Protestant Reformation', year:1517, minTier:4, cat:'religion', imp:0.9,
    loc:[51.85,12.63,10,'Wittenberg, Germany'],
    desc:"Luther's 95 Theses split Christianity and spark the Wars of Religion.",
    detail:"Martin Luther's 1517 theses ignited the Reformation, splintering Western Christianity. The resulting Wars of Religion killed millions, while driving individual conscience, literacy, and separation of church and state." },

  { id:'e_magellan', name:'First Circumnavigation', year:1519, minTier:4, cat:'exploration', imp:0.82,
    loc:[-20.0,-50.0,3,'South America'],
    desc:"Magellan's expedition proves Earth's spherical shape by sailing around it.",
    detail:"Magellan set out in 1519 with 5 ships and 270 men. Though he died in the Philippines (1521), 18 survivors under Elcano completed the first circumnavigation." },

  { id:'e_slave_trade', name:'Transatlantic Slave Trade', year:1526, minTier:4, cat:'conflict', imp:0.9,
    span:[1526,1888],
    loc:[0.0,-30.0,3,'Atlantic Ocean'],
    desc:'~12 million Africans are forcibly transported to the Americas as enslaved people.',
    detail:"The transatlantic slave trade forcibly transported 12.5 million Africans (10.7 million surviving the voyage). The largest forced migration in history, its legacy continues to shape societies today." },

  { id:'e_sci_rev', name:'Scientific Revolution', year:1543, minTier:4, cat:'technology', imp:0.95,
    span:[1543,1700],
    loc:[52.0,0.0,5,'Europe'],
    desc:'Copernicus, Galileo, and Newton establish the foundations of modern science.',
    detail:"Copernicus's heliocentric model (1543), Galileo's telescopic discoveries (1609), and Newton's laws (1687) created the scientific method: observation, hypothesis, mathematical proof." },

  { id:'e_shakespeare', name:'Shakespeare', year:1564, minTier:4, cat:'society', imp:0.80,
    loc:[52.19,-1.71,11,'Stratford-upon-Avon, England'],
    desc:'William Shakespeare writes the most influential body of literature in English.',
    detail:"Shakespeare (1564–1616) wrote 37 plays and 154 sonnets. He coined or popularised over 1,700 words still in use; his works are performed more than any other playwright's." },

  { id:'e_galileo', name:"Galileo's Telescope", year:1609, minTier:4, cat:'technology', imp:0.83,
    loc:[45.41,12.35,10,'Venice, Italy'],
    desc:'Galileo turns the telescope to the sky, confirming heliocentrism.',
    detail:"Galileo observed four moons orbiting Jupiter and phases of Venus — proving planets orbit the Sun. His conflict with the Inquisition defined the tension between faith and science for centuries." },

  { id:'e_thirty_years', name:'Thirty Years War', year:1618, minTier:4, cat:'conflict', imp:0.76,
    span:[1618,1648],
    loc:[50.08,14.44,5,'Central Europe'],
    desc:"Europe's most destructive conflict before the 20th century reshapes the continent.",
    detail:"The Thirty Years War (1618–1648) killed up to 8 million people — one-third of Germany's population. The Peace of Westphalia (1648) established the modern system of sovereign nation-states." },

  { id:'e_taj_mahal', name:'Taj Mahal', year:1632, minTier:4, cat:'society', imp:0.74,
    loc:[27.17,78.04,13,'Agra, India'],
    desc:"Emperor Shah Jahan builds the Taj Mahal as a monument to love.",
    detail:"The Taj Mahal (1632–1653) was built by Mughal Emperor Shah Jahan for his wife Mumtaz Mahal. Combining Persian, Islamic, and Indian architecture, it employed 20,000 artisans." },

  { id:'e_english_cw', name:'English Civil War', year:1642, minTier:4, cat:'politics', imp:0.8,
    span:[1642,1651],
    loc:[51.5,-1.8,7,'England'],
    desc:'Parliament defeats King Charles I; England briefly becomes a republic.',
    detail:"The English Civil War (1642–1651) established parliamentary supremacy. Charles I was executed in 1649. Its principles influenced the Glorious Revolution (1688) and later democratic revolutions worldwide." },

  { id:'e_newton', name:"Newton's Principia", year:1687, minTier:4, cat:'technology', imp:0.9,
    loc:[52.25,-0.50,10,'Woolsthorpe, England'],
    desc:"Newton's laws of motion and gravity unify physics and astronomy.",
    detail:"Newton's Principia Mathematica (1687) unified terrestrial and celestial mechanics — defining physics for 230 years until Einstein." },

  { id:'e_glorious_rev', name:'Glorious Revolution', year:1688, minTier:4, cat:'politics', imp:0.76,
    loc:[51.5,-0.12,9,'London, England'],
    desc:"England's bloodless revolution establishes constitutional monarchy.",
    detail:"The Glorious Revolution (1688) deposed James II. The Bill of Rights (1689) enshrined parliamentary sovereignty, freedom of speech in Parliament, and regular elections." },

  { id:'e_steam', name:'Steam Engine (Watt)', year:1769, minTier:4, cat:'technology', imp:0.9,
    loc:[55.87,-4.27,10,'Glasgow, Scotland'],
    desc:"James Watt's steam engine powers the Industrial Revolution.",
    detail:"Watt's separate condenser design (1769) made steam engines dramatically more efficient. His engines powered factories, mines, and locomotives, making Britain the world's first industrial nation." },

  { id:'e_boston_tea', name:'Boston Tea Party', year:1773, minTier:4, cat:'politics', imp:0.74,
    loc:[42.36,-71.05,12,'Boston, USA'],
    desc:"American colonists dump British tea into Boston Harbour, igniting the Revolution.",
    detail:"On December 16, 1773, 116 men dumped 342 chests of tea into Boston Harbour to protest 'taxation without representation'. This led directly to the First Continental Congress (1774)." },

  { id:'e_amer_rev', name:'American Revolution', year:1776, minTier:4, cat:'politics', imp:0.9,
    span:[1775,1783],
    loc:[39.95,-75.17,9,'Philadelphia, USA'],
    desc:'The United States declares independence — the first modern constitutional republic.',
    detail:"The Declaration of Independence (1776) and Constitution (1787) established the first major modern republic: popular sovereignty, separation of powers, individual rights. It inspired revolutions in France, Haiti, and Latin America." },

  { id:'e_haitian_rev', name:'Haitian Revolution', year:1791, minTier:4, cat:'politics', imp:0.80,
    span:[1791,1804],
    loc:[18.54,-72.34,9,'Port-au-Prince, Haiti'],
    desc:'Enslaved people revolt and found the first Black republic in history.',
    detail:"The Haitian Revolution (1791–1804) was the only successful slave revolt in history. Led by Toussaint Louverture and Dessalines, it established the world's first Black republic." },

  { id:'e_french_rev', name:'French Revolution', year:1789, minTier:4, cat:'politics', imp:0.95,
    span:[1789,1799],
    loc:[48.85,2.35,10,'Paris, France'],
    desc:'The French Revolution dismantles monarchy and spreads liberal ideals across Europe.',
    detail:"The French Revolution (1789–1799) abolished feudalism, executed Louis XVI, and proclaimed liberté, égalité, fraternité. The Napoleonic Wars that followed spread revolutionary ideals across Europe." },

  // ── TIER 5 ──────────────────────────────────────────────────────────
  { id:'e_napoleon', name:'Napoleonic Wars', year:1803, minTier:5, cat:'conflict', imp:0.85,
    span:[1803,1815],
    loc:[48.85,2.35,6,'France / Europe'],
    desc:"Napoleon's campaigns reshape Europe and spread revolutionary ideals.",
    detail:"Napoleon's campaigns (1803–1815) spread the Napoleonic Code, abolished feudalism across conquered territories, and stirred nationalist movements. His defeat at Waterloo (1815) led to a generation of conservative reaction." },

  { id:'e_communist_manifesto', name:'Communist Manifesto', year:1848, minTier:5, cat:'politics', imp:0.82,
    loc:[51.5,-0.12,9,'London, England'],
    desc:'Marx and Engels publish the manifesto that will inspire socialist revolutions worldwide.',
    detail:"The Communist Manifesto (1848) analysed capitalism as a system of class struggle and called for proletarian revolution. It became the foundational text for communist and socialist movements, shaping 20th-century politics." },

  { id:'e_darwin', name:'Darwin: Origin of Species', year:1859, minTier:5, cat:'biology', imp:0.95,
    loc:[51.34,0.04,11,'Down House, England'],
    desc:"Darwin's theory of evolution by natural selection transforms biology.",
    detail:"On the Origin of Species (1859) proposed that species evolve through natural selection. Combined with Mendelian genetics and DNA science, it created the modern evolutionary synthesis — the unifying framework of all life sciences." },

  { id:'e_us_civil_war', name:'US Civil War', year:1861, minTier:5, cat:'conflict', imp:0.85,
    span:[1861,1865],
    loc:[38.9,-77.04,5,'USA'],
    desc:'The bloodiest American conflict ends slavery and reshapes the nation.',
    detail:"The Civil War (1861–1865) killed 620,000–850,000 people. The Union victory and 13th Amendment (1865) abolished slavery, though unresolved tensions over racial equality would define American politics for another 160 years." },

  { id:'e_germ_theory', name:'Germ Theory of Disease', year:1861, minTier:5, cat:'biology', imp:0.9,

    desc:'Pasteur and Koch prove microorganisms cause infectious disease.',

async function fetchWikiImages(wikiTitles) {
  if (!wikiTitles || !wikiTitles.length) return [];
  const titles = wikiTitles.slice(0, 3).join('|'); // max 3 articles
  const url = `https://en.wikipedia.org/w/api.php?` + new URLSearchParams({
    action: 'query', titles, prop: 'pageimages', format: 'json',
    pithumbsize: 400, origin: '*',
  });
  try {
    const res  = await fetch(url);
    const data = await res.json();
    return Object.values(data.query.pages)
      .filter(p => p.thumbnail && p.thumbnail.source)
      .map(p => ({ url: p.thumbnail.source, caption: p.title.replace(/_/g, ' ') }));
  } catch { return []; }
}

async function fetchWikiExtract(title) {
  if (wikiExtractCache.has(title)) return wikiExtractCache.get(title);
  const url = `https://en.wikipedia.org/w/api.php?` + new URLSearchParams({
    action: 'query', titles: title, prop: 'extracts',
    exintro: '1', explaintext: '1', exsectionformat: 'plain',
    format: 'json', origin: '*',
  });
  try {
    const res  = await fetch(url);
    const data = await res.json();
    const pages = Object.values(data.query.pages);
    const text  = pages[0]?.extract || '';
    // Trim to first ~600 chars ending at a sentence boundary
    const trimmed = text.length > 600
      ? text.slice(0, 600).replace(/\.[^.]*$/, '.') + '..'
      : text;
    wikiExtractCache.set(title, trimmed);
    return trimmed;
  } catch { return ''; }
}

// ── Shared wikitext helpers ──────────────────────
function _stripWikiMarkup(raw) {
  const clean = raw.replace(/\[\[([^\]|]*)\|([^\]]+)\]\]/g, '$2')
                   .replace(/\[\[([^\]]+)\]\]/g, '$1')
                   .replace(/\{\{[^}]*\}\}/g, '')
                   .replace(/'{2,3}/g, '');
  const tmp = document.createElement('div');
  tmp.innerHTML = clean;
  return (tmp.textContent || '').trim();
}

async function _fetchWikitext(title) {
  const url = `https://en.wikipedia.org/w/api.php?` + new URLSearchParams({
    action: 'query', titles: title, prop: 'revisions',
    rvprop: 'content', rvslots: 'main', format: 'json', origin: '*',
  });
  const res  = await fetch(url);
  const data = await res.json();
  const page = Object.values(data.query.pages)[0];
  if (page?.missing) return '';
  return page?.revisions?.[0]?.slots?.main?.['*'] || '';
}

function _guessCat(text) {
  const t = text.toLowerCase();
  if (/\b(war|battle|siege|invad|attack|bomb|milit|army|navy)\b/.test(t)) return 'conflict';
  if (/\b(treaty|elect|king|queen|emperor|parliament|law|constitution|president|republic|colony)\b/.test(t)) return 'politics';
  if (/\b(discover|invent|engine|telescope|vaccine|theory|science|math|phys)\b/.test(t)) return 'technology';
  if (/\b(church|pope|bishop|mosque|temple|religi|christian|islam|buddhis|hindu)\b/.test(t)) return 'religion';
  if (/\b(earthquake|flood|hurricane|famine|plague|eruption|drought|climate)\b/.test(t)) return 'environment';
  if (/\b(voyage|expedition|explore|sail|land|coast|discover.*land)\b/.test(t)) return 'exploration';
  if (/\b(born|die|paint|compose|writ|novel|poet|art|music|university|book)\b/.test(t)) return 'society';
  return 'society';  // default
}

// ── CENTURY-LEVEL PARSER ─────────────────────────
// Wikipedia articles like "15th century" have an Events section
// with sub-headers by decade or bullet points by year.
function _parseCenturyEvents(centuryKey, wikitext) {
  const results = [];
  const evSection = wikitext.match(/==\s*Events\s*==\s*([\s\S]*?)(?:\n==\s*[^=]|\s*$)/i)?.[1] || '';
  const lines = evSection.split('\n');
  for (const line of lines) {
    // Match lines like "* 1453 – Fall of Constantinople"
    // or "* c. 1440 – Gutenberg invents..."
    const m = line.match(/^\*+\s*(?:c\.\s*)?(\d{1,4})\s*(?:BC|BCE|AD|CE)?\s*[–\-—:]\s*(.+)/i);
    if (!m) continue;
    let year = parseInt(m[1], 10);
    // Handle BCE centuries
    if (/\b(BC|BCE)\b/i.test(line) || centuryKey < 0) year = -year;
    const desc = _stripWikiMarkup(m[2]);
    if (!desc || desc.length < 10) continue;
    const cat = _guessCat(desc);
    results.push({
      id: `dyn_c${centuryKey}_${year}_${results.length}`,
      name: desc.slice(0, 60) + (desc.length > 60 ? '…' : ''),
      fullDesc: desc, year, baseYear: centuryKey,
      dynLevel: 'century', minTier: 3, cat, imp: 0.35, isDynamic: true,
    });
  }
  return results;
}

function _centuryTitle(centuryKey) {
  // centuryKey: 15 → "15th century", -5 → "5th century BC"
  const abs = Math.abs(centuryKey);
  const suffix = abs === 1 ? 'st' : abs === 2 ? 'nd' : abs === 3 ? 'rd' : 'th';
  return centuryKey < 0
    ? `${abs}${suffix}_century_BC`
    : `${abs}${suffix}_century`;
}

function _yearToCentury(yr) {
  // 1453 → 15, -500 → -5, 2024 → 21
  if (yr > 0) return Math.ceil(yr / 100);
  return -Math.ceil(Math.abs(yr) / 100);
}

async function fetchCenturyEvents(centuryKey) {
  const fetched = _wikiFetched.century, fetching = _wikiFetching.century;
  if (fetched.has(centuryKey) || fetching.has(centuryKey)) return;
  fetching.add(centuryKey);
  try {
    const wikitext = await _fetchWikitext(_centuryTitle(centuryKey));
    if (!wikitext) { fetched.add(centuryKey); return; }
    const evs = _parseCenturyEvents(centuryKey, wikitext);
    dynamicEvents = dynamicEvents.filter(e => !(e.dynLevel === 'century' && e.baseYear === centuryKey)).concat(evs);
    fetched.add(centuryKey);
    scheduleRender();
  } catch {
    fetched.add(centuryKey);
  } finally {
    fetching.delete(centuryKey);
  }
}

// ── DECADE-LEVEL PARSER ──────────────────────────
// Wikipedia articles like "1920s" have Events sections
// with year-prefixed bullets.
function _parseDecadeEvents(decadeKey, wikitext) {
  const results = [];
  const evSection = wikitext.match(/==\s*Events\s*==\s*([\s\S]*?)(?:\n==\s*[^=]|\s*$)/i)?.[1] || '';
  const lines = evSection.split('\n');
  for (const line of lines) {
    // Match "* 1923 – Description" or "* March 15 – Description" (year implicit from article)
    const mYear = line.match(/^\*+\s*(\d{4})\s*[–\-—:]\s*(.+)/);
    const mDate = line.match(/^\*+\s*(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d+)\s*[–\-—:]\s*(.+)/i);
    if (!mYear && !mDate) continue;

    let year, desc;
    if (mYear) {
      year = parseInt(mYear[1], 10);
      desc = _stripWikiMarkup(mYear[2]);
    } else {
      // For month-day entries, use the decade midpoint as approximate year
      year = decadeKey + 5;
      desc = _stripWikiMarkup(mDate[3]);
    }
    if (!desc || desc.length < 10) continue;
    const cat = _guessCat(desc);
    results.push({
      id: `dyn_d${decadeKey}_${year}_${results.length}`,
      name: desc.slice(0, 58) + (desc.length > 58 ? '…' : ''),
      fullDesc: desc, year, baseYear: decadeKey,
      dynLevel: 'decade', minTier: 4, cat, imp: 0.28, isDynamic: true,
    });
  }
  return results;
}

function _decadeTitle(decadeKey) {
  // decadeKey: 1920 → "1920s", 500 → "500s", -200 → "200s BC"
  const abs = Math.abs(decadeKey);
  return decadeKey < 0 ? `${abs}s_BC` : `${abs}s`;
}

function _yearToDecade(yr) {
  return Math.floor(yr / 10) * 10;
}

async function fetchDecadeEvents(decadeKey) {
  const fetched = _wikiFetched.decade, fetching = _wikiFetching.decade;
  if (fetched.has(decadeKey) || fetching.has(decadeKey)) return;
  fetching.add(decadeKey);
  try {
    const wikitext = await _fetchWikitext(_decadeTitle(decadeKey));
    if (!wikitext) { fetched.add(decadeKey); return; }
    const evs = _parseDecadeEvents(decadeKey, wikitext);
    dynamicEvents = dynamicEvents.filter(e => !(e.dynLevel === 'decade' && e.baseYear === decadeKey)).concat(evs);
    fetched.add(decadeKey);
    scheduleRender();
  } catch {
    fetched.add(decadeKey);
  } finally {
    fetching.delete(decadeKey);
  }
}

// ── YEAR-LEVEL PARSER ────────────────────────────
function _parseYearEvents(year, wikitext) {
  const results = [];
  const evSection = wikitext.match(/==\s*Events\s*==\s*([\s\S]*?)(?:\n==\s*[^=]|\s*$)/i)?.[1] || '';
  const lines = evSection.split('\n');
  const MONTHS = {january:0,february:1,march:2,april:3,may:4,june:5,
                  july:6,august:7,september:8,october:9,november:10,december:11};
  for (const line of lines) {
    const m = line.match(/^\*+\s*(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d+)\s*[–\-—:]\s*(.+)/i);
    if (!m) continue;
    const month = MONTHS[m[1].toLowerCase()];
    const day   = parseInt(m[2], 10);
    const desc  = _stripWikiMarkup(m[3]);
    if (!desc || desc.length < 10) continue;
    const fracYear = year + (month * 30.44 + day) / 365.25;
    const cat = _guessCat(desc);
    results.push({
      id: `dyn_y${year}_${month}_${day}_${results.length}`,
      name: desc.slice(0, 55) + (desc.length > 55 ? '…' : ''),
      fullDesc: desc, year: fracYear, baseYear: year,
      month: m[1], day,
      dynLevel: 'year', minTier: 5, cat, imp: 0.22, isDynamic: true,
    });
  }
  return results;
}

async function fetchYearEvents(year) {
  const fetched = _wikiFetched.year, fetching = _wikiFetching.year;
  if (fetched.has(year) || fetching.has(year)) return;
  fetching.add(year);
  if (year < 1 || year > MAX_YEAR) { fetched.add(year); fetching.delete(year); return; }
  try {
    const wikitext = await _fetchWikitext(String(year));
    if (!wikitext) { fetched.add(year); return; }
    const evs = _parseYearEvents(year, wikitext);
    dynamicEvents = dynamicEvents.filter(e => !(e.dynLevel === 'year' && e.baseYear === year)).concat(evs);
    fetched.add(year);
    scheduleRender();
  } catch {
    fetched.add(year);
  } finally {
    fetching.delete(year);
  }
}

// ── UNIFIED LOADER (called on each render) ───────
function _doLoadWikiEvents() {
  if (activeStory) return;   // don't load dynamic events in story mode
  const vMin = xToYear(0), vMax = xToYear(W);

  // CENTURY LEVEL — scale 0.5+ (viewing <600k years)
  if (scale >= 0.5) {
    const cMin = _yearToCentury(Math.max(Math.ceil(vMin), -3000));
    const cMax = _yearToCentury(Math.min(Math.floor(vMax), MAX_YEAR));
    for (let c = cMin; c <= cMax && _wikiInFlight() < WIKI_MAX_CONCURRENT; c++) {
      if (c === 0) continue;  // no "0th century"
      fetchCenturyEvents(c);
    }
  }

  // DECADE LEVEL — scale 5+ (viewing <250 years)
  if (scale >= 5) {
    const dMin = _yearToDecade(Math.max(Math.ceil(vMin), -500));
    const dMax = _yearToDecade(Math.min(Math.floor(vMax), MAX_YEAR));
    for (let d = dMin; d <= dMax && _wikiInFlight() < WIKI_MAX_CONCURRENT; d += 10) {
      fetchDecadeEvents(d);
    }
  }

  // YEAR LEVEL — scale 25+ (viewing <50 years)
  if (scale >= 25) {
    const yMin = Math.max(1, Math.ceil(vMin));
    const yMax = Math.min(MAX_YEAR, Math.floor(vMax));
    let queued = 0;
    for (let yr = yMin; yr <= yMax && _wikiInFlight() < WIKI_MAX_CONCURRENT && queued < 15; yr++) {
      if (!_wikiFetched.year.has(yr) && !_wikiFetching.year.has(yr)) { fetchYearEvents(yr); queued++; }
    }
  }
}

function maybeLoadWikiEvents() {
  clearTimeout(_wikiDebounceTimer);
  _wikiDebounceTimer = setTimeout(_doLoadWikiEvents, 300);
}

// ═══════════════════════════════════════════════
//  SHAPE HELPERS
// ═══════════════════════════════════════════════

function drawShapePath(ctx, x, y, r, shape) {
  ctx.beginPath();
  switch (shape) {
    case 'diamond':
      ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.85, y);
      ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.85, y); ctx.closePath(); break;
    case 'square': {
      const s = r * 0.82;
      ctx.rect(x - s, y - s, s * 2, s * 2); break;
    }
    case 'triangle':
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.9, y + r * 0.72);
      ctx.lineTo(x - r * 0.9, y + r * 0.72); ctx.closePath(); break;
    case 'triangle-down':
      ctx.moveTo(x, y + r);
      ctx.lineTo(x + r * 0.9, y - r * 0.72);
      ctx.lineTo(x - r * 0.9, y - r * 0.72); ctx.closePath(); break;
    case 'star':
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const ai = a + Math.PI / 5;
        const ox = x + r * Math.cos(a), oy = y + r * Math.sin(a);
        const ix = x + r * 0.42 * Math.cos(ai), iy = y + r * 0.42 * Math.sin(ai);
        if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
      } ctx.closePath(); break;
    case 'hexagon':
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        const hx = x + r * Math.cos(a), hy = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
      } ctx.closePath(); break;
    case 'pentagon':
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      } ctx.closePath(); break;
    default: // circle
      ctx.arc(x, y, r, 0, Math.PI * 2);
  }
}

function shapeToSVG(shape, color, sz = 12) {
  const c = sz / 2, r = sz / 2;
  let inner = '';
  switch (shape) {
    case 'diamond':
      inner = `<polygon points="${c},0 ${sz},${c} ${c},${sz} 0,${c}" fill="${color}"/>`; break;
    case 'square': {
      const s = r * 0.82;
      inner = `<rect x="${c-s}" y="${c-s}" width="${s*2}" height="${s*2}" fill="${color}"/>`; break;
    }
    case 'triangle':
      inner = `<polygon points="${c},0 ${sz},${sz} 0,${sz}" fill="${color}"/>`; break;
    case 'triangle-down':
      inner = `<polygon points="${c},${sz} ${sz},0 0,0" fill="${color}"/>`; break;
    case 'star': {
      let pts = '';
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const ai = a + Math.PI / 5;
        pts += `${c + r*Math.cos(a)},${c + r*Math.sin(a)} `;
        pts += `${c + r*0.42*Math.cos(ai)},${c + r*0.42*Math.sin(ai)} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}"/>`; break;
    }
    case 'hexagon': {
      let pts = '';
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        pts += `${c + r*Math.cos(a)},${c + r*Math.sin(a)} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}"/>`; break;
    }
    case 'pentagon': {
      let pts = '';
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        pts += `${c + r*Math.cos(a)},${c + r*Math.sin(a)} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}"/>`; break;
    }
    default:
      inner = `<circle cx="${c}" cy="${c}" r="${r}" fill="${color}"/>`;
  }
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="overflow:visible">${inner}</svg>`;
}

//  MAP SETUP
// ═══════════════════════════════════════════════

const WORLD_BOUNDS = [[-90, -180], [90, 180]];
// Calculate zoom so world fills container WIDTH exactly
// At zoom z, world = 256*2^z px wide → z = log2(containerWidth/256)
function mapWidthZoom() {
  return Math.log2(document.getElementById('map').offsetWidth / 256);
}

const leafMap = L.map('map', {
  center: [20, 0], zoom: mapWidthZoom(),
  zoomControl: false, attributionControl: false, scrollWheelZoom: true,
  worldCopyJump: false,
  maxBounds: WORLD_BOUNDS,
  maxBoundsViscosity: 1.0,
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19,
  noWrap: true,       // tiles don't repeat beyond ±180°
  bounds: WORLD_BOUNDS,
}).addTo(leafMap);

leafMap.whenReady(() => {
  const z = mapWidthZoom();
  leafMap.setMinZoom(z);
  leafMap.setZoom(z, { animate: false });
});

let mapMarker = null;

function updateMap(ev) {
  if (mapMarker) { leafMap.removeLayer(mapMarker); mapMarker = null; }
  const hint = document.getElementById('mapHint');
  if (!ev || !ev.loc) { hint.classList.remove('hidden'); return; }
  hint.classList.add('hidden');
  const [lat, lng, zoom] = ev.loc;
  const color = (CATS[ev.cat] || { color:'#6366f1' }).color;
  const icon = L.divIcon({
    className:'',
    html:`<div class="hist-marker" style="background:${color}"></div>`,
    iconSize:[14,14], iconAnchor:[7,7],
  });
  mapMarker = L.marker([lat,lng],{icon}).addTo(leafMap);
  leafMap.flyTo([lat,lng], zoom, { duration:0.9 });
}

function clearMapMarker() {
  if (mapMarker) { leafMap.removeLayer(mapMarker); mapMarker = null; }
  document.getElementById('mapHint').classList.remove('hidden');
}

// ── Map resize handle ──
const mapEl     = document.getElementById('map');
const mapHandle = document.getElementById('mapResizeHandle');
let mapResizing = false, mapResizeY0 = 0, mapResizeH0 = 0;

mapHandle.addEventListener('mousedown', e => {
  e.preventDefault();
  mapResizing = true; mapResizeY0 = e.clientY; mapResizeH0 = mapEl.offsetHeight;
  mapHandle.classList.add('dragging');
  document.body.style.cursor = 'ns-resize';
});
window.addEventListener('mousemove', e => {
  if (!mapResizing) return;
  const newH = Math.max(60, Math.min(600, mapResizeH0 + (e.clientY - mapResizeY0)));
  mapEl.style.height = newH + 'px';
  leafMap.invalidateSize();
  resize();
});
window.addEventListener('mouseup', () => {
  if (mapResizing) {
    mapResizing = false;
    mapHandle.classList.remove('dragging');
    document.body.style.cursor = '';
  }
});
