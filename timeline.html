const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const area    = document.getElementById('canvasArea');
const panel   = document.getElementById('popup');
const mainEl  = document.querySelector('.main');
const tooltip = document.getElementById('tooltip');

let W = 0, H = 0;
let scale   = 1;
let scrollX = 0;
let dragging = false, dragStartX = 0, dragBaseX = 0;
let hoveredEv = null, selectedEv = null;
let activeCategories = new Set(Object.keys(CATS));
let filterRelated = false;
let activeStory = null;   // null = free exploration, otherwise a STORIES entry
let storyIndex = -1;      // index into storyEventsSorted() for prev/next nav
let rafPending = false;

// ── Wikipedia extract cache ──
const wikiExtractCache = new Map();

// ── Dynamic events (fetched from Wikipedia at various zoom levels) ──
let dynamicEvents = [];

// Track fetched/fetching state per granularity
const _wikiFetched  = { century: new Set(), decade: new Set(), year: new Set() };
const _wikiFetching = { century: new Set(), decade: new Set(), year: new Set() };

// ── Wiki fetch throttling ──
const WIKI_MAX_CONCURRENT = 3;
let _wikiDebounceTimer = null;
function _wikiInFlight() {
  return _wikiFetching.century.size + _wikiFetching.decade.size + _wikiFetching.year.size;
}

// ── Text sanitisation helper (prevent XSS from API responses) ──
function escapeHTML(str) {
  const el = document.createElement('span');
  el.textContent = str;
  return el.innerHTML;
}

// ═══════════════════════════════════════════════
//  CORE MATH
// ═══════════════════════════════════════════════

function yearToX(yr) { return (yr - MIN_YEAR) * scale - scrollX; }
function xToYear(x)  { return MIN_YEAR + (x + scrollX) / scale; }
function totalW()    { return (MAX_YEAR - MIN_YEAR) * scale; }
function axisY()     { return Math.round(H * 0.54); }

function clampScroll() {
  const max = Math.max(0, totalW() - W);
  scrollX = Math.max(0, Math.min(scrollX, max));
}

function zoomAt(factor, cx) {
  const yr   = xToYear(cx);
  const minS = W / (MAX_YEAR - MIN_YEAR) * 0.95;
  scale = Math.max(minS, Math.min(250, scale * factor));
  scrollX = (yr - MIN_YEAR) * scale - cx;
  clampScroll(); scheduleRender(); updateScaleBar();
}

function jumpTo(minY, maxY) {
  const pad = (maxY - minY) * 0.04;
  scale   = W / (maxY - minY + pad * 2);
  scrollX = (minY - pad - MIN_YEAR) * scale;
  clampScroll(); scheduleRender(); updateScaleBar();
}

function scheduleRender() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false; render();
    // Keep popup anchored to its dot as the timeline pans/zooms
    if (panel.classList.contains('open') && selectedEv) positionPopup(selectedEv);
    // Trigger fetching of Wikipedia year events when zoomed in enough
    maybeLoadWikiEvents();
  });
}

function stableHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return h >>> 0;
}

// ═══════════════════════════════════════════════
//  LAYOUT ENGINE — collision-resolved dot positions
// ═══════════════════════════════════════════════

let _layout = new Map();                           // ev.id → y (px)
let _layoutSig = '';                               // cache invalidation key

function computeLayout() {
  // H is part of the signature — layout must recompute when canvas height changes
  // (e.g. when the map resize handle is dragged)
  const sig = `${scale.toFixed(8)}|${scrollX.toFixed(1)}|${H}|${[...activeCategories].sort()}|${filterRelated}|${activeStory?.id||''}|${dynamicEvents.length}`;
  if (sig === _layoutSig) return;
  _layoutSig = sig;
  _layout = new Map();

  const evs  = visibleEvents();
  const ay   = axisY();
  const PAD  = 8;        // minimum gap (px) between dot edges
  const LABEL_H = 18;    // approximate label text height (px)
  const placed = [];     // [{x, y, r, lw}] already-resolved dots

  // High-importance dots get first pick of good positions.
  // Within same importance, sort by year so left-to-right ordering is stable.
  const sorted = [...evs].sort((a, b) => b.imp - a.imp || a.year - b.year);

  for (const ev of sorted) {
    const x    = yearToX(ev.year);
    const r    = Math.max(4, ev.imp * 9.5);
    const pref = (stableHash(ev.id) & 1) === 0;   // true = prefer above axis
    const lw   = ev.name.length * 6.5 + 8;  // approximate label width

    // Natural starting distance from the axis — proportional to canvas height and
    // event importance, so dots spread to fill the available vertical space.
    const start = Math.max(r + LABEL_H + 6, H * 0.20 * ev.imp);

    const y = _resolveY(x, r, lw, ay, pref, placed, PAD, LABEL_H, start);
    placed.push({ x, y, r, lw });
    _layout.set(ev.id, y);
  }
}

function _resolveY(x, r, lw, ay, preferAbove, placed, pad, labelH, start) {
  // Check dots that could overlap horizontally (considering both dot and label width)
  const hReach = Math.max(r, lw / 2) + pad;
  const nearby = placed.filter(p => {
    const pReach = Math.max(p.r, p.lw / 2) + pad;
    return Math.abs(p.x - x) < hReach + pReach;
  });

  const STEP  = Math.max(3, r * 0.6);
  const MIN_Y = H * 0.03;
  const MAX_Y = H * 0.97;

  // Try preferred side first, then the opposite
  for (const dir of (preferAbove ? [-1, 1] : [1, -1])) {
    for (let offset = start; offset < H * 0.95; offset += STEP) {
      const y = ay + dir * offset;
      if (y < MIN_Y || y > MAX_Y) break;

      // Collision check using axis-aligned bounding boxes that include
      // the dot AND its label above/below. This prevents text overlap.
      const clear = nearby.every(p => {
        // Dot-to-dot circular distance
        const dx = x - p.x, dy = y - p.y;
        const dotNeed = r + p.r + pad;
        const dotClear = dx * dx + dy * dy >= dotNeed * dotNeed;

        // Label-to-label vertical overlap check:
        // Each dot's label extends ~labelH pixels above (if above axis) or below.
        // We need vertical separation of at least (r + labelH + pad) between
        // dots that are horizontally close enough for labels to overlap.
        const labelOverlapX = Math.abs(dx) < (lw / 2 + p.lw / 2 + 6);
        const vNeed = r + p.r + labelH + pad;
        const labelClear = !labelOverlapX || Math.abs(dy) >= vNeed;

        return dotClear && labelClear;
      });
      if (clear) return y;
    }
  }
  // Fallback — extremely rare
  return ay + (preferAbove ? -1 : 1) * start;
}

function eventY(ev) {
  return _layout.has(ev.id) ? _layout.get(ev.id) : axisY() - H * 0.15;
}

// ═══════════════════════════════════════════════
//  VISIBLE EVENTS
// ═══════════════════════════════════════════════

function isRelatedTo(ev, sel) {
  if (!sel) return true;
  if (ev.id === sel.id) return true;
  if (ev.cat === sel.cat) return true;
  if (Math.abs(ev.year - sel.year) <= 250) return true;
  if (sel.span && ev.year >= sel.span[0] && ev.year <= sel.span[1]) return true;
  if (ev.span  && sel.year >= ev.span[0]  && sel.year <= ev.span[1]) return true;
  return false;
}

function visibleEvents() {
  const vMin = xToYear(-50);
  const vMax = xToYear(W + 50);
  const base = EVENTS.filter(ev => {
    // In story mode show all story events regardless of zoom tier
    if (activeStory) {
      if (!activeStory.events.includes(ev.id)) return false;
    } else {
      if (scale < TIER_SCALE[ev.minTier]) return false;
    }
    if (ev.year < vMin || ev.year > vMax) return false;
    if (!activeCategories.has(ev.cat)) return false;
    if (filterRelated && selectedEv && !isRelatedTo(ev, selectedEv)) return false;
    return true;
  });
  // Inject dynamic Wikipedia events at appropriate zoom levels
  if (!activeStory && dynamicEvents.length) {
    const dynVisible = dynamicEvents.filter(ev => {
      if (ev.year < vMin || ev.year > vMax) return false;
      if (!activeCategories.has(ev.cat)) return false;
      // Only show dynamic events when zoom is high enough for their tier
      if (scale < TIER_SCALE[ev.minTier]) return false;
      if (filterRelated && selectedEv && !isRelatedTo(ev, selectedEv)) return false;
      return true;
    });
    return base.concat(dynVisible);
  }
  return base;
}

function labelSet(evs) {
  const sorted = [...evs].sort((a, b) => b.imp - a.imp);
  const shown  = new Set();
  const used   = [];     // [{x, y, w}]
  const ay     = axisY();
  for (const ev of sorted) {
    const x  = yearToX(ev.year);
    const y  = eventY(ev);
    const lw = ev.name.length * 6.5 + 8;
    const r  = Math.max(4, ev.imp * 9.5);
    // Label sits above or below the dot
    const labelY = y < ay ? y - r - 10 : y + r + 10;
    // Check clash: labels must not overlap in both X and Y
    const clash = used.some(u =>
      Math.abs(u.x - x) < (u.w / 2 + lw / 2 + 10) &&
      Math.abs(u.y - labelY) < 16
    );
    const force = ev === hoveredEv || ev === selectedEv || ev.imp >= 0.98;
    if (!clash || force) {
      shown.add(ev.id);
      if (!clash) used.push({ x, y: labelY, w: lw });
    }
  }
  return shown;
}

// ═══════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════

function render() {
  computeLayout();   // resolve dot positions before any drawing
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#060612';
  ctx.fillRect(0, 0, W, H);
  drawEraZones();
  drawSpans();
  drawAxis();
  drawTicks();
  drawEvents();
}

function drawEraZones() {
  const ay = axisY();
  ERA_ZONES.forEach(z => {
    const x1 = yearToX(z.start), x2 = yearToX(z.end);
    if (x2 < 0 || x1 > W) return;
    ctx.fillStyle = z.color;
    ctx.fillRect(x1, 0, x2 - x1, H);
    const vx1 = Math.max(x1, 0), vx2 = Math.min(x2, W);
    if (vx2 - vx1 < 20) return;
    const lx = Math.max(vx1 + 5, Math.min(vx2 - 5, (vx1 + vx2) / 2));
    ctx.save();
    ctx.fillStyle    = 'rgba(180,185,255,0.10)';
    ctx.font         = `700 ${Math.max(10, H * 0.022)}px 'Inter','Segoe UI',sans-serif`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(z.label.toUpperCase(), lx, axisY() - 30);
    ctx.restore();
  });
}

function drawSpans() {
  const ay    = axisY();
  const bandH = Math.max(8, Math.min(18, H * 0.022));

  EVENTS.forEach(ev => {
    if (!ev.span) return;
    if (!activeCategories.has(ev.cat)) return;
    if (scale < TIER_SCALE[ev.minTier]) return;
    if (filterRelated && selectedEv && !isRelatedTo(ev, selectedEv)) return;

    const x1 = yearToX(ev.span[0]), x2 = yearToX(ev.span[1]);
    if (x2 < 0 || x1 > W) return;

    const rx1 = Math.max(x1, -2), rx2 = Math.min(x2, W + 2);
    if (rx2 - rx1 < 2) return;

    const color  = (CATS[ev.cat] || { color:'#888' }).color;
    const isSel  = selectedEv && selectedEv.id === ev.id;
    const isHov  = hoveredEv  && hoveredEv.id  === ev.id;
    if (!isSel && !isHov) return; // only reveal span when event is focused
    const fillA  = isSel ? 0.42 : 0.28;
    const edgeA  = isSel ? 0.70 : isHov ? 0.55 : 0.35;

    // Filled band
    ctx.fillStyle   = color;
    ctx.globalAlpha = fillA;
    ctx.fillRect(rx1, ay - bandH / 2, rx2 - rx1, bandH);

    // Top and bottom edges
    ctx.globalAlpha = edgeA;
    ctx.fillRect(rx1, ay - bandH / 2, rx2 - rx1, 1);
    ctx.fillRect(rx1, ay + bandH / 2 - 1, rx2 - rx1, 1);

    // End caps
    ctx.fillRect(rx2 - 1, ay - bandH / 2, 1, bandH);
    if (x1 >= 0) ctx.fillRect(rx1, ay - bandH / 2, 1, bandH);

    // Label (only if wide enough)
    const spanPx = rx2 - rx1;
    if (spanPx > 55) {
      ctx.globalAlpha  = Math.min(fillA + 0.2, 0.65);
      ctx.fillStyle    = color;
      ctx.font         = `500 ${Math.max(8, Math.min(10, spanPx / ev.name.length * 0.8))}px 'Inter','Segoe UI',sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      const cx = Math.max(rx1 + 4, Math.min(rx2 - 4, (rx1 + rx2) / 2));
      ctx.fillText(ev.name, cx, ay);
    }

    ctx.globalAlpha = 1;
  });
}

function drawAxis() {
  const ay = axisY();
  // Main line
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0,    'rgba(99,102,241,0)');
  g.addColorStop(0.03, 'rgba(99,102,241,.65)');
  g.addColorStop(0.97, 'rgba(99,102,241,.65)');
  g.addColorStop(1,    'rgba(99,102,241,0)');
  ctx.shadowColor = 'rgba(99,102,241,.35)';
  ctx.shadowBlur  = 6;
  ctx.strokeStyle = g; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(0, ay); ctx.lineTo(W, ay); ctx.stroke();
  ctx.shadowBlur  = 0; ctx.shadowColor = 'transparent';
}

function niceInterval(viewRange, maxTicks) {
  const steps = [1,2,5,10,25,50,100,200,500,1000,2000,5000,10000,25000,50000,100000];
  const rough = viewRange / maxTicks;
  return steps.find(s => s >= rough) || 100000;
}

function drawTicks() {
  const ay       = axisY();
  const vMin     = xToYear(0), vMax = xToYear(W);
  const interval = niceInterval(vMax - vMin, 10);
  const start    = Math.ceil(vMin / interval) * interval;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.font      = `500 ${Math.max(10, H * 0.016)}px 'Inter','Segoe UI',sans-serif`;
  for (let yr = start; yr <= vMax + interval; yr += interval) {
    if (yr < MIN_YEAR || yr > MAX_YEAR) continue;
    const x = yearToX(yr);
    if (x < 18 || x > W - 18) continue;
    ctx.strokeStyle = 'rgba(99,102,241,.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, ay - 5); ctx.lineTo(x, ay + 5); ctx.stroke();
    ctx.fillStyle = 'rgba(152,155,210,.9)';
    ctx.fillText(formatYear(yr), x, ay + 9);
  }
}

function drawEvents() {
  const ay     = axisY();
  const evs    = visibleEvents();
  const labels = labelSet(evs);
  const sorted = [...evs].sort((a, b) => a.imp - b.imp);

  sorted.forEach(ev => {
    const x     = yearToX(ev.year);
    const y     = eventY(ev);
    const isSel = selectedEv && selectedEv.id === ev.id;
    const isHov = hoveredEv  && hoveredEv.id  === ev.id;
    const baseR = Math.max(4, ev.imp * 9.5);
    const r     = baseR * (isSel ? 1.65 : isHov ? 1.35 : 1);
    const color = (CATS[ev.cat] || { color:'#888' }).color;
    const shape = CAT_SHAPE[ev.cat] || 'circle';
    const thr   = activeStory ? 0 : TIER_SCALE[ev.minTier];
    const alpha = thr === 0 ? 1 : Math.min(1, (scale - thr) / (thr * 2.5));

    ctx.globalAlpha = alpha * (isSel ? 1 : isHov ? 0.97 : 0.85);

    // Connector line — dashed, colored on hover/select, subtle otherwise
    const connColor = (isSel || isHov) ? color : 'rgba(110,115,200,0.14)';
    ctx.strokeStyle = connColor;
    ctx.lineWidth   = isSel ? 1.5 : isHov ? 1 : 0.75;
    ctx.setLineDash(isSel ? [4, 4] : [2, 5]);
    ctx.beginPath(); ctx.moveTo(x, ay); ctx.lineTo(x, y); ctx.stroke();
    ctx.setLineDash([]);

    // Dot glow on hover/select
    if (isSel || isHov) {
      ctx.shadowColor = color;
      ctx.shadowBlur  = isSel ? 20 : 12;
    }

    // Fill shape
    drawShapePath(ctx, x, y, r, shape);
    ctx.fillStyle = color; ctx.fill();

    // Inner highlight
    drawShapePath(ctx, x, y, r * 0.55, shape);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();

    // Outline on hover/select
    if (isSel || isHov) {
      drawShapePath(ctx, x, y, r, shape);
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2;
      ctx.globalAlpha = alpha * 0.55; ctx.stroke();
    }

    // Selection ring
    if (isSel) {
      ctx.beginPath(); ctx.arc(x, y, r + 7, 0, Math.PI * 2);
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.globalAlpha = alpha * 0.35; ctx.stroke();
      // second ring
      ctx.beginPath(); ctx.arc(x, y, r + 13, 0, Math.PI * 2);
      ctx.lineWidth = 0.8; ctx.globalAlpha = alpha * 0.15; ctx.stroke();
    }

    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; ctx.globalAlpha = 1;

    // Label
    if (labels.has(ev.id) || isSel || isHov) {
      const above  = y < ay;
      const labelY = above ? y - r - 6 : y + r + 6;
      const fs     = Math.max(9, 9 + Math.min(scale * 0.22, 3));
      ctx.globalAlpha  = alpha * (isSel || isHov ? 1 : 0.82);
      ctx.font         = `${isSel || isHov ? '600 ' : '500 '}${fs}px 'Inter','Segoe UI',sans-serif`;
      ctx.fillStyle    = isSel ? '#fff' : isHov ? '#e8e8ff' : 'rgba(200,204,240,0.9)';
      ctx.textAlign    = 'center';
      ctx.textBaseline = above ? 'bottom' : 'top';
      // subtle text shadow for legibility
      if (isSel || isHov) { ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 4; }
      ctx.fillText(ev.name, x, labelY);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  });
}

// ═══════════════════════════════════════════════
//  FORMAT HELPERS
// ═══════════════════════════════════════════════

function formatYear(y) {
  const abs = Math.abs(Math.round(y));
  if (y < -999) return `${abs.toLocaleString()} BCE`;
  if (y < 0)    return `${abs} BCE`;
  return `${abs} CE`;
}

// ═══════════════════════════════════════════════
//  HIT TEST
// ═══════════════════════════════════════════════

const isTouchDevice = () => 'ontouchstart' in window || navigator.maxTouchPoints > 0;

function hitTest(mx, my) {
  computeLayout();   // ensure positions match what's drawn
  const evs    = visibleEvents();
  const sorted = [...evs].sort((a, b) => b.imp - a.imp);
  const pad    = isTouchDevice() ? 18 : 8;   // bigger tap zone on mobile
  for (const ev of sorted) {
    const x = yearToX(ev.year), y = eventY(ev);
    const r = Math.max(4, ev.imp * 9.5) + pad;
    if ((mx - x) ** 2 + (my - y) ** 2 <= r * r) return ev;
  }
  return null;
}

function hitTestSpan(mx, my) {
  const ay    = axisY();
  const bandH = Math.max(8, Math.min(18, H * 0.022));
  const pad   = isTouchDevice() ? 12 : 4;
  if (Math.abs(my - ay) > bandH + pad) return null;
  const yr = xToYear(mx);
  // Prefer events that are visible and already known to user
  const candidates = EVENTS.filter(ev =>
    ev.span && activeCategories.has(ev.cat) &&
    scale >= TIER_SCALE[ev.minTier] &&
    yr >= ev.span[0] && yr <= ev.span[1]
  );
  // Return the one with the narrowest span (most specific)
  if (!candidates.length) return null;
  return candidates.sort((a, b) => (a.span[1]-a.span[0]) - (b.span[1]-b.span[0]))[0];
}

// ═══════════════════════════════════════════════
//  SCALE BAR
// ═══════════════════════════════════════════════

function updateScaleBar() {
  const vMin = xToYear(0), vMax = xToYear(W);
  document.getElementById('scaleRange').innerHTML =
    `Viewing: <strong>${formatYear(vMin)}</strong> → <strong>${formatYear(vMax)}</strong>`;
  const visCount = visibleEvents().length;
  const total    = activeStory ? activeStory.events.length : EVENTS.length;
  document.getElementById('scaleCount').textContent = `${visCount} / ${total} events`;
}

function openPanel(ev) {
  selectedEv = ev;
  document.getElementById('panelTitle').textContent = ev.name;

  const cat = CATS[ev.cat] || { label:ev.cat, color:'#888' };
  const dateLabel = ev.isDynamic
    ? (ev.month && ev.day ? `${ev.month} ${ev.day}, ${ev.baseYear}` : formatYear(ev.year))
    : formatYear(ev.year);
  document.getElementById('panelMeta').innerHTML = `
    <span class="mtag" style="color:${cat.color};border-color:${cat.color}44">${cat.label}</span>
    <span class="mtag">${dateLabel}</span>
    ${ev.isDynamic ? '<span class="mtag" style="color:var(--muted);font-size:.55rem">📖 Wikipedia</span>' : ''}
  `;

  const locEl = document.getElementById('panelLoc');
  if (ev.loc) {
    locEl.innerHTML = `📍 <span style="color:var(--muted)">${ev.loc[3]}</span>`;
    locEl.style.display = 'flex';
  } else locEl.style.display = 'none';

  const spanEl = document.getElementById('panelSpan');
  if (ev.span) {
    spanEl.innerHTML = `⏳ <span style="color:var(--muted)">${formatYear(ev.span[0])} – ${formatYear(ev.span[1])}</span>`;
    spanEl.style.display = 'flex';
  } else spanEl.style.display = 'none';

  document.getElementById('panelDesc').textContent   = ev.desc   || '';
  document.getElementById('panelDetail').textContent = ev.detail || '';

  // Related filter button
  const btn = document.getElementById('btnFilterRelated');
  btn.classList.toggle('active', filterRelated);

  const rel = EVENTS
    .filter(e => e.id !== ev.id && isRelatedTo(e, ev))
    .sort((a, b) => Math.abs(a.year - ev.year) - Math.abs(b.year - ev.year))
    .slice(0, 6);

  const relEl = document.getElementById('panelRel');
  relEl.innerHTML = rel.length
    ? `<div class="psect">Related Events</div>
       <div class="rel-list">${rel.map(r => `
         <div class="rel-item" data-id="${r.id}">
           ${shapeToSVG(CAT_SHAPE[r.cat]||'circle', (CATS[r.cat]||{color:'#888'}).color, 10)}
           <div>
             <div class="rel-name">${r.name}</div>
             <div class="rel-yr">${formatYear(r.year)}</div>
           </div>
         </div>`).join('')}
       </div>`
    : '';

  relEl.querySelectorAll('.rel-item').forEach(el => {
    el.addEventListener('click', () => {
      const found = EVENTS.find(e => e.id === el.dataset.id);
      if (found) navigateTo(found);
    });
  });

  // Image gallery
  const galleryEl = document.getElementById('panelGallery');
  const wikiTitles = EVENT_WIKI[ev.id];
  if (wikiTitles) {
    galleryEl.innerHTML = `
      <div class="psect">Images</div>
      <div class="gallery-loading"><div class="gallery-spinner"></div> Loading…</div>`;
    fetchWikiImages(wikiTitles).then(imgs => {
      if (!imgs.length) { galleryEl.innerHTML = ''; return; }
      galleryEl.innerHTML = `<div class="psect">Images</div>
        <div class="gallery-scroll">
          ${imgs.map(img => `
            <div class="gallery-img-wrap">
              <img src="${img.url}" alt="${img.caption}" data-full="${img.url.replace(/\/\d+px-/, '/800px-')}" />
              <div class="gallery-caption">${img.caption}</div>
            </div>`).join('')}
        </div>`;
      galleryEl.querySelectorAll('img').forEach(img => {
        img.addEventListener('click', () => openLightbox(img.dataset.full || img.src));
      });
    });
  } else {
    galleryEl.innerHTML = '';
  }

  // Wikipedia extract
  const wikiEl = document.getElementById('panelWiki');
  if (wikiTitles && wikiTitles.length) {
    const primaryTitle = wikiTitles[0];
    const wikiPageUrl  = `https://en.wikipedia.org/wiki/${encodeURIComponent(primaryTitle)}`;
    wikiEl.innerHTML = `
      <div class="wiki-section">
        <div class="psect">From Wikipedia</div>
        <div class="gallery-loading"><div class="gallery-spinner"></div> Loading…</div>
      </div>`;
    fetchWikiExtract(primaryTitle).then(text => {
      if (!text) { wikiEl.innerHTML = ''; return; }
      const extractId  = `we_${ev.id}`;
      const expandId   = `wx_${ev.id}`;
      wikiEl.innerHTML = `
        <div class="wiki-section">
          <div class="psect">From Wikipedia</div>
          <p class="wiki-extract" id="${extractId}"></p>
          <button class="wiki-expand-btn" id="${expandId}">Show more ↓</button>
          <a class="wiki-link-btn" href="${wikiPageUrl}" target="_blank" rel="noopener">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
              <path d="M2 9L9 2M9 2H4.5M9 2V6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Read on Wikipedia
          </a>
        </div>`;
      // Safe: set text via textContent, not innerHTML
      const extractEl = document.getElementById(extractId);
      extractEl.textContent = text;
      const expandBtn = document.getElementById(expandId);
      expandBtn.addEventListener('click', () => {
        const expanded = extractEl.classList.toggle('expanded');
        expandBtn.textContent = expanded ? 'Show less ↑' : 'Show more ↓';
      });
      // Hide expand btn if text is short enough to not need it
      if (text.length < 300) expandBtn.style.display = 'none';
    });
  } else if (ev.isDynamic) {
    // Dynamic events: show the full description (escaped to prevent XSS)
    wikiEl.innerHTML = `<div class="wiki-section"><p class="wiki-extract expanded">${escapeHTML(ev.fullDesc || ev.name)}</p></div>`;
  } else {
    wikiEl.innerHTML = '';
  }

  // Sync story navigation index
  if (activeStory) {
    const sorted = storyEventsSorted();
    storyIndex = sorted.findIndex(e => e.id === ev.id);
    updateStoryNav();
  }

  positionPopup(ev);
  panel.classList.add('open');
  updateMap(ev);
  scheduleRender();
}

function positionPopup(ev) {
  const mainRect   = mainEl.getBoundingClientRect();
  const canvasRect = area.getBoundingClientRect();
  const isMobile   = window.innerWidth <= 768;

  const dotX = yearToX(ev.year);
  const dotY = eventY(ev);

  // dot position relative to .main
  const relX = (canvasRect.left - mainRect.left) + dotX;
  const relY = (canvasRect.top  - mainRect.top)  + dotY;

  const PW    = isMobile ? mainRect.width - 24 : 340;
  const GAP   = 14;   // gap between dot edge and popup
  const DOT_R = Math.max(4, (selectedEv?.imp ?? 5) * 9.5) + 6;

  // Temporarily show to measure height
  panel.style.width    = PW + 'px';
  panel.style.left     = '-9999px';
  panel.style.top      = '-9999px';
  panel.style.opacity  = '0';
  panel.style.display  = 'flex';
  const PH = Math.min(panel.scrollHeight, window.innerHeight * 0.62);
  panel.style.display  = '';
  panel.style.opacity  = '';

  // Horizontal: center popup on dot, clamped within main
  let left = relX - PW / 2;
  if (isMobile) left = 12;
  else left = Math.max(8, Math.min(mainRect.width - PW - 8, left));

  // Arrow horizontal offset (relative to popup)
  const arrowX = Math.max(18, Math.min(PW - 30, relX - left));

  // Vertical: prefer above dot
  let top, arrowClass;
  const spaceAbove = relY - DOT_R - GAP;
  const spaceBelow = mainRect.height - relY - DOT_R - GAP;

  if (spaceAbove >= PH || spaceAbove >= spaceBelow) {
    top        = relY - DOT_R - GAP - PH;
    arrowClass = 'arrow-above';
  } else {
    top        = relY + DOT_R + GAP;
    arrowClass = 'arrow-below';
  }
  top = Math.max(8, Math.min(mainRect.height - PH - 8, top));

  panel.style.left   = left + 'px';
  panel.style.top    = top  + 'px';
  panel.style.width  = PW   + 'px';

  const arrowEl = panel.querySelector('.pu-arrow');
  arrowEl.style.left = arrowX + 'px';

  panel.classList.remove('arrow-above', 'arrow-below');
  panel.classList.add(arrowClass);
}

// ── Lightbox ──
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxImg').src = '';
}
document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.getElementById('lightboxClose').addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });

function closePanel() {
  selectedEv = null;
  filterRelated = false;
  document.getElementById('btnFilterRelated').classList.remove('active');
  document.getElementById('panelGallery').innerHTML = '';
  document.getElementById('panelWiki').innerHTML = '';
  clearMapMarker();
  panel.classList.remove('open');
  scheduleRender();
}

function navigateTo(ev) {
  if (!ev.isDynamic) {
    const needed = TIER_SCALE[ev.minTier];
    if (scale < needed * 1.5) scale = needed * 2.5;
  }
  scrollX = (ev.year - MIN_YEAR) * scale - W / 2;
  clampScroll(); updateScaleBar(); openPanel(ev);
}

// ── Related filter toggle ──
document.getElementById('btnFilterRelated').addEventListener('click', () => {
  filterRelated = !filterRelated;
  document.getElementById('btnFilterRelated').classList.toggle('active', filterRelated);
  const note = document.getElementById('filterNote');
  note.textContent = filterRelated ? 'Showing related events only' : '';
  scheduleRender(); updateScaleBar();
});

// ═══════════════════════════════════════════════
//  TOOLTIP
// ═══════════════════════════════════════════════

function showTooltip(ev, cx, cy) {
  document.getElementById('ttTitle').textContent = ev.name;
  document.getElementById('ttYear').textContent  = ev.isDynamic
    ? (ev.month && ev.day ? `${ev.month} ${ev.day}, ${ev.baseYear}` : formatYear(ev.year))
    : formatYear(ev.year);
  document.getElementById('ttDesc').textContent  = ev.isDynamic
    ? (ev.fullDesc || ev.name)
    : (ev.desc || '');
  tooltip.classList.add('show');
  const tw = tooltip.offsetWidth || 230, th = tooltip.offsetHeight || 80;
  let tx = cx + 16, ty = cy - th / 2;
  if (tx + tw > window.innerWidth  - 8) tx = cx - tw - 16;
  if (ty < 6)                            ty = 6;
  if (ty + th > window.innerHeight - 6) ty = window.innerHeight - th - 6;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

// ═══════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 || e.button === 1) {
    e.preventDefault();
    dragging = true; dragStartX = e.clientX; dragBaseX = scrollX;
    canvas.style.cursor = 'grabbing';
  }
});
canvas.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); }, true);

window.addEventListener('mouseup', e => {
  if (!dragging) return;
  const moved = Math.abs(e.clientX - dragStartX);
  dragging = false; canvas.style.cursor = 'grab';
  if (moved < 5 && e.button === 0) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const hit = hitTest(mx, my) || hitTestSpan(mx, my);
    if (hit) openPanel(hit); else closePanel();
  }
});

window.addEventListener('mousemove', e => {
  if (dragging) {
    scrollX = dragBaseX - (e.clientX - dragStartX);
    clampScroll(); scheduleRender(); return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (mx < 0 || mx > W || my < 0 || my > H) {
    if (hoveredEv) { hoveredEv = null; hideTooltip(); scheduleRender(); }
    return;
  }
  const hit = hitTest(mx, my) || hitTestSpan(mx, my);
  if (hit !== hoveredEv) { hoveredEv = hit; scheduleRender(); }
  if (hit) { showTooltip(hit, e.clientX, e.clientY); canvas.style.cursor = 'pointer'; }
  else     { hideTooltip(); canvas.style.cursor = 'grab'; }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect   = canvas.getBoundingClientRect();
  const cx     = e.clientX - rect.left;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoomAt(factor, cx);
}, { passive:false });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const PAN = W * 0.18;
  if (e.key === '+' || e.key === '=') zoomAt(1.3, W / 2);
  if (e.key === '-')                  zoomAt(1 / 1.3, W / 2);
  if (e.key === 'ArrowLeft')  { scrollX -= PAN; clampScroll(); scheduleRender(); updateScaleBar(); }
  if (e.key === 'ArrowRight') { scrollX += PAN; clampScroll(); scheduleRender(); updateScaleBar(); }
  if (e.key === 'Escape') { closePanel(); closeStoriesModal(); closeSearch(); }
  // Press "/" to open search (common shortcut)
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openSearch(); }
});

let _touch = null, _pinch = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    _touch = { cx: e.touches[0].clientX, cy: e.touches[0].clientY, sx: scrollX };
    _pinch = null;
  } else if (e.touches.length === 2) {
    _pinch = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    _touch = null;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && _touch) {
    scrollX = _touch.sx - (e.touches[0].clientX - _touch.cx);
    clampScroll(); scheduleRender(); updateScaleBar();
  } else if (e.touches.length === 2 && _pinch != null) {
    const d   = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const mid = (e.touches[0].clientX + e.touches[1].clientX) / 2
                - canvas.getBoundingClientRect().left;
    zoomAt(d / _pinch, mid);
    _pinch = d;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  // Detect tap (minimal movement) and do hit-test
  if (_touch && _pinch === null && e.changedTouches.length === 1) {
    const dx   = e.changedTouches[0].clientX - _touch.cx;
    const dy   = e.changedTouches[0].clientY - _touch.cy;
    const dist = Math.hypot(dx, dy);

    if (dist < 12) {          // finger didn't move — it's a tap
      const rect = canvas.getBoundingClientRect();
      const tx   = e.changedTouches[0].clientX - rect.left;
      const ty   = e.changedTouches[0].clientY - rect.top;
      const hit  = hitTest(tx, ty) || hitTestSpan(tx, ty);
      if (hit) openPanel(hit);
      else     closePanel();
    }
  }
  _touch = null; _pinch = null;
}, { passive: false });

//  STORY SYSTEM
// ═══════════════════════════════════════════════

// ── Story navigation helpers ──────────────────────────
function storyEventsSorted() {
  if (!activeStory) return [];
  return activeStory.events
    .map(id => EVENTS.find(e => e.id === id))
    .filter(Boolean)
    .sort((a, b) => a.year - b.year);
}

function storyGoTo(idx) {
  const sorted = storyEventsSorted();
  if (!sorted.length) return;
  storyIndex = Math.max(0, Math.min(sorted.length - 1, idx));
  const ev = sorted[storyIndex];
  // Pan to bring event into view, then open its popup
  navigateTo(ev);
  updateStoryNav();
}

function storyNext() { storyGoTo(storyIndex + 1); }
function storyPrev() { storyGoTo(storyIndex - 1); }

function updateStoryNav() {
  const sorted  = storyEventsSorted();
  const navEl   = document.getElementById('storyNav');
  const posEl   = document.getElementById('storyNavPos');
  const prevBtn = document.getElementById('btnStoryPrev');
  const nextBtn = document.getElementById('btnStoryNext');
  if (!navEl) return;
  if (!activeStory || !sorted.length) { navEl.style.display = 'none'; return; }
  navEl.style.display = 'flex';
  const pos = storyIndex >= 0 ? storyIndex + 1 : '—';
  posEl.textContent = `${pos} / ${sorted.length}`;
  prevBtn.disabled  = storyIndex <= 0;
  nextBtn.disabled  = storyIndex >= sorted.length - 1;
}

function activateStory(story) {
  activeStory = story;
  storyIndex  = -1;
  closePanel();
  jumpTo(story.range[0], story.range[1]);
  updateStoryBar();
  updateScaleBar();
  scheduleRender();
  closeStoriesModal();
}

function exitStory() {
  activeStory = null;
  storyIndex  = -1;
  updateStoryBar();
  updateStoryNav();
  updateScaleBar();
  scheduleRender();
}

function updateStoryBar() {
  const bar = document.getElementById('storyBar');
  if (!activeStory) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  document.getElementById('storyBarIcon').textContent  = activeStory.icon;
  document.getElementById('storyBarName').textContent  = activeStory.name;
  document.getElementById('storyBarCount').textContent =
    `· ${activeStory.events.length} curated events`;
  updateStoryNav();
}

function openStoriesModal() {
  document.getElementById('storiesModal').classList.add('open');
}
function closeStoriesModal() {
  document.getElementById('storiesModal').classList.remove('open');
}

function buildStoriesGrid() {
  const grid = document.getElementById('storiesGrid');
  STORIES.forEach(story => {
    const rangeLabel = formatYear(story.range[0]) + ' – ' + formatYear(story.range[1]);
    const card = document.createElement('div');
    card.className = 'story-card';
    card.innerHTML = `
      <span class="story-card-icon">${story.icon}</span>
      <div class="story-card-name">${story.name}</div>
      <div class="story-card-range">${rangeLabel}</div>
      <div class="story-card-desc">${story.desc}</div>
      <div class="story-card-count">
        <span class="story-card-dot"></span>
        ${story.events.length} key events
      </div>`;
    card.addEventListener('click', () => {
      grid.querySelectorAll('.story-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      activateStory(story);
    });
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════

let _searchActiveIdx = -1;   // keyboard-highlighted result index

function searchEvents(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  return EVENTS
    .filter(ev => ev.name.toLowerCase().includes(q) ||
                  (ev.desc && ev.desc.toLowerCase().includes(q)) ||
                  (ev.detail && ev.detail.toLowerCase().includes(q)))
    .sort((a, b) => {
      // Prioritise name matches over description matches
      const aName = a.name.toLowerCase().includes(q) ? 0 : 1;
      const bName = b.name.toLowerCase().includes(q) ? 0 : 1;
      if (aName !== bName) return aName - bName;
      return b.imp - a.imp;   // then by importance
    })
    .slice(0, 12);   // cap results
}

function renderSearchResults(results) {
  const el = document.getElementById('searchResults');
  if (!results.length) {
    el.innerHTML = '<div class="search-empty">No events found</div>';
    el.classList.add('open');
    _searchActiveIdx = -1;
    return;
  }
  el.innerHTML = results.map((ev, i) => {
    const cat = CATS[ev.cat] || { label: ev.cat, color: '#888' };
    return `<div class="search-result" data-idx="${i}" data-id="${ev.id}">
      ${shapeToSVG(CAT_SHAPE[ev.cat] || 'circle', cat.color, 10)}
      <div>
        <div class="search-result-name">${escapeHTML(ev.name)}</div>
        <div class="search-result-yr">${formatYear(ev.year)} · <span class="search-result-cat">${cat.label}</span></div>
      </div>
    </div>`;
  }).join('');
  el.classList.add('open');
  _searchActiveIdx = -1;

  el.querySelectorAll('.search-result').forEach(item => {
    item.addEventListener('click', () => {
      const ev = EVENTS.find(e => e.id === item.dataset.id);
      if (ev) { closeSearch(); navigateTo(ev); }
    });
  });
}

function highlightSearchResult(idx) {
  const el = document.getElementById('searchResults');
  const items = el.querySelectorAll('.search-result');
  items.forEach(it => it.classList.remove('active'));
  if (idx >= 0 && idx < items.length) {
    items[idx].classList.add('active');
    items[idx].scrollIntoView({ block: 'nearest' });
  }
  _searchActiveIdx = idx;
}

function openSearch() {
  const wrap = document.getElementById('searchWrap');
  const input = document.getElementById('searchInput');
  wrap.classList.add('open');
  setTimeout(() => input.focus(), 60);
}

function closeSearch() {
  const wrap = document.getElementById('searchWrap');
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  wrap.classList.remove('open');
  input.value = '';
  results.classList.remove('open');
  results.innerHTML = '';
  _searchActiveIdx = -1;
}

function initSearch() {
  const icon    = document.getElementById('searchIcon');
  const input   = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  const wrap    = document.getElementById('searchWrap');

  icon.addEventListener('click', () => {
    if (wrap.classList.contains('open')) closeSearch();
    else openSearch();
  });

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (q.length < 2) { results.classList.remove('open'); results.innerHTML = ''; return; }
    renderSearchResults(searchEvents(q));
  });

  input.addEventListener('keydown', e => {
    const items = results.querySelectorAll('.search-result');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      highlightSearchResult(Math.min(_searchActiveIdx + 1, items.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlightSearchResult(Math.max(_searchActiveIdx - 1, 0));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (_searchActiveIdx >= 0 && items[_searchActiveIdx]) {
        items[_searchActiveIdx].click();
      } else if (items.length) {
        items[0].click();
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeSearch();
    }
  });

  // Close search when clicking outside
  document.addEventListener('pointerdown', e => {
    if (wrap.classList.contains('open') && !wrap.contains(e.target)) {
      closeSearch();
    }
  });
}

// ═══════════════════════════════════════════════
//  BUILD UI
// ═══════════════════════════════════════════════

function buildUI() {
  const eraBtns = document.getElementById('eraBtns');
  ERA_JUMPS.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'era-btn'; btn.textContent = e.label;
    btn.addEventListener('click', () => jumpTo(e.min, e.max));
    eraBtns.appendChild(btn);
  });

  document.getElementById('panelClose').addEventListener('click', closePanel);

  // Search
  initSearch();

  // Stories
  document.getElementById('btnStories').addEventListener('click', openStoriesModal);
  document.getElementById('btnCloseStories').addEventListener('click', closeStoriesModal);
  document.getElementById('storiesModal').addEventListener('click', e => {
    if (e.target === document.getElementById('storiesModal')) closeStoriesModal();
  });
  document.getElementById('btnExitStory').addEventListener('click', exitStory);
  document.getElementById('btnStoryPrev').addEventListener('click', storyPrev);
  document.getElementById('btnStoryNext').addEventListener('click', storyNext);
  buildStoriesGrid();

  // Legend with actual category shapes
  const legendItems = document.getElementById('legendItems');
  Object.entries(CATS).forEach(([key, cat]) => {
    const item = document.createElement('div');
    item.className = 'legend-item active';
    item.innerHTML = shapeToSVG(CAT_SHAPE[key], cat.color, 11) + `<span>${cat.label}</span>`;
    item.addEventListener('click', () => {
      if (activeCategories.has(key)) {
        if (activeCategories.size > 1) { activeCategories.delete(key); item.classList.remove('active'); }
      } else {
        activeCategories.add(key); item.classList.add('active');
      }
      updateScaleBar(); scheduleRender();
    });
    legendItems.appendChild(item);
  });
}

// ═══════════════════════════════════════════════
//  RESIZE & INIT
// ═══════════════════════════════════════════════

const DEFAULT_MIN = -4000, DEFAULT_MAX = 2026;
let _firstResize = true;

function resize() {
  const rect    = area.getBoundingClientRect();
  W = rect.width; H = rect.height;
  canvas.width = W; canvas.height = H;

  if (_firstResize) {
    _firstResize = false;
    const pad = (DEFAULT_MAX - DEFAULT_MIN) * 0.03;
    scale   = W / (DEFAULT_MAX - DEFAULT_MIN + pad * 2);
    scrollX = (DEFAULT_MIN - pad - MIN_YEAR) * scale;
  } else {
    const minS = W / (MAX_YEAR - MIN_YEAR);
    if (scale < minS) { scale = minS; scrollX = 0; }
  }
  clampScroll(); updateScaleBar(); scheduleRender();
}

window.addEventListener('resize', () => {
  resize();
  if (panel.classList.contains('open') && selectedEv) positionPopup(selectedEv);
  leafMap.invalidateSize();
  // Re-fit world to new container width
  const z = mapWidthZoom();
  leafMap.setMinZoom(z);
  if (leafMap.getZoom() < z) leafMap.setZoom(z, { animate: false });
  const hint = document.querySelector('.hint');
  if (hint) hint.textContent = window.innerWidth <= 768
    ? '👆 Pinch to zoom · Swipe to pan · Tap events'
    : '🖱 Scroll to zoom · Drag to pan · Click events for details';
});
buildUI();
resize();
</script>
