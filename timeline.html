<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human History Timeline</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #08090d;
      --surface:    #101219;
      --surface2:   #151822;
      --surface3:   #1d2230;
      --surface4:   #252b3a;
      --border:     #262c38;
      --border-hi:  #3a4252;
      --text:       #eef2f6;
      --text-dim:   #aab4c2;
      --muted:      #737f90;
      --accent:     #14b8a6;
      --accent-hi:  #5eead4;
      --accent-warm:#f59e0b;
      --accent-glow:rgba(20,184,166,.18);
      --accent-dim: rgba(20,184,166,.10);
      --radius-sm:  6px;
      --radius:     8px;
      --radius-lg:  8px;
      --panel-w:    clamp(360px, 34vw, 480px);
      --topbar-h:   52px;
    }

    html, body {
      height: 100%; overflow: hidden;
      background:
        radial-gradient(circle at 18% 0%, rgba(20,184,166,.10), transparent 32rem),
        linear-gradient(180deg, #090b10 0%, var(--bg) 50%, #06070a 100%);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; }
    button, .legend-item, .evidence-item, .story-card, canvas {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    button:focus-visible, input:focus-visible, a:focus-visible,
    .legend-item:focus-visible, .evidence-item:focus-visible, .story-card:focus-visible {
      outline: 2px solid var(--accent-hi);
      outline-offset: 2px;
    }

    /* ── Header ─────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 18px; min-height: var(--topbar-h);
      background: rgba(16,18,25,.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: nowrap;
      position: relative; z-index: 10;
    }
    header::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--accent-glow) 30%, var(--accent-glow) 70%, transparent 100%);
    }

    .header-title { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
    .header-title h1 {
      font-size: .98rem; font-weight: 750; white-space: nowrap; letter-spacing: 0;
      background: linear-gradient(135deg, #f8fafc 0%, var(--accent-hi) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sep { width: 1px; height: 16px; background: var(--border-hi); flex-shrink: 0; }

    .era-btns { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; min-width: 0; padding: 2px 0; }
    .era-btns::-webkit-scrollbar { display: none; }
    .era-btn {
      background: rgba(255,255,255,.025); border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 999px; min-height: 30px; padding: 0 12px; font-size: .66rem; font-family: inherit;
      cursor: pointer; transition: all .18s; white-space: nowrap; letter-spacing: .02em;
    }
    .era-btn:hover {
      background: var(--accent-dim); border-color: var(--accent);
      color: var(--accent-hi);
    }
    .era-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #042f2e;
      box-shadow: 0 0 0 1px rgba(94,234,212,.20), 0 10px 24px rgba(20,184,166,.18);
    }

    .header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }

    /* ── Search ─────────────────────────────── */
    .search-wrap {
      position: relative; display: flex; align-items: center;
      width: 32px; height: 34px; flex-shrink: 0;
      transition: width .25s;
    }
    .search-wrap.open { width: clamp(170px, 18vw, 260px); }
    .search-input {
      width: 0; opacity: 0; padding: 0; border: none;
      background: var(--surface3); color: var(--text);
      border-radius: 999px; font-size: .72rem; font-family: inherit;
      transition: width .25s, opacity .25s, padding .25s, border .15s;
      outline: none;
    }
    .search-wrap.open .search-input {
      width: 100%; opacity: 1; min-height: 34px; padding: 0 14px 0 34px;
      border: 1px solid var(--border-hi);
    }
    .search-wrap.open .search-input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute; left: 0; z-index: 2;
      width: 32px; height: 32px; background: rgba(255,255,255,.025);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: 999px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all .15s;
      flex-shrink: 0;
    }
    .search-wrap.open .search-icon {
      left: 2px; border-color: transparent; background: transparent;
      pointer-events: none;
    }
    .search-icon:hover { border-color: var(--accent); color: var(--accent-hi); }
    .search-results {
      position: absolute; top: calc(100% + 6px); right: 0;
      width: 280px; max-height: 320px; overflow-y: auto;
      background: rgba(12,12,32,.97); backdrop-filter: blur(18px);
      border: 1px solid var(--border-hi); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.7);
      display: none; z-index: 2000;
    }
    .search-results.open { display: block; }
    .search-result {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; cursor: pointer; transition: background .1s;
      user-select: text;
    }
    .search-result:hover, .search-result.active {
      background: var(--accent-dim);
    }
    .search-result-name { font-size: .72rem; font-weight: 500; color: var(--text); }
    .search-result-yr   { font-size: .6rem; color: var(--muted); }
    .search-result-cat  { font-size: .56rem; color: var(--text-dim); }
    .search-empty {
      padding: 14px; font-size: .67rem; color: var(--muted); text-align: center;
    }

    /* ── Stories button (header) ────────────── */
    .stories-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface3); border: 1px solid var(--border-hi);
      color: var(--text-dim); border-radius: 999px;
      min-height: 34px; padding: 0 14px; font-size: .7rem; font-family: inherit;
      font-weight: 500; cursor: pointer; transition: all .18s;
      letter-spacing: .02em; white-space: nowrap;
    }
    .chrome-btn {
      display: flex; align-items: center; gap: 6px;
      min-height: 34px; padding: 0 14px;
      background: transparent; border: 1px solid var(--border-hi);
      color: var(--text-dim); border-radius: 999px;
      font-size: .7rem; font-family: inherit; font-weight: 500;
      cursor: pointer; transition: all .18s; white-space: nowrap;
    }
    .chrome-btn:hover, .chrome-btn.active {
      background: var(--accent-dim); border-color: var(--accent);
      color: var(--accent-hi);
    }
    .stories-btn:hover {
      background: var(--accent-dim); border-color: var(--accent);
      color: var(--accent-hi); box-shadow: 0 0 14px var(--accent-glow);
    }

    /* ── Story active bar ───────────────────── */
    .story-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 18px;
      background: linear-gradient(90deg, rgba(20,184,166,.12) 0%, rgba(245,158,11,.05) 100%);
      border-bottom: 1px solid rgba(20,184,166,.28);
      flex-shrink: 0; font-size: .72rem; color: var(--accent-hi);
    }
    .story-bar.hidden { display: none; }
    .story-bar-icon   { font-size: 1rem; line-height: 1; }
    .story-bar-name   { font-weight: 600; }
    .story-bar-count  { color: var(--muted); font-size: .63rem; }
    .story-exit-btn {
      margin-left: auto; background: transparent;
      border: 1px solid rgba(99,102,241,.35); color: var(--muted);
      border-radius: 999px; min-height: 28px; padding: 0 10px; font-size: .61rem;
      font-family: inherit; cursor: pointer; transition: all .15s;
    }
    .story-exit-btn:hover { border-color: var(--accent); color: var(--accent-hi); }

    /* ── Stories modal ──────────────────────── */
    #storiesModal {
      position: fixed; inset: 0; z-index: 3000;
      background: rgba(6,6,18,.88); backdrop-filter: blur(22px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    #storiesModal.open { display: flex; }

    .stories-modal-inner {
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      width: 100%; max-width: 860px;
      max-height: 86vh; overflow-y: auto;
      box-shadow: 0 32px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(99,102,241,.15);
    }
    .stories-modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 24px 26px 18px; border-bottom: 1px solid var(--border);
      gap: 16px; position: sticky; top: 0;
      background: var(--surface2); z-index: 1;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .stories-modal-title { display: flex; align-items: flex-start; gap: 14px; }
    .stories-modal-icon  { font-size: 1.8rem; line-height: 1; margin-top: 2px; }
    .stories-modal-title h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .stories-modal-title p  { font-size: .72rem; color: var(--text-dim); line-height: 1.5; }
    .stories-modal-close {
      width: 34px; height: 34px; background: var(--surface3);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: var(--radius-sm); cursor: pointer; font-size: .8rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
    }
    .stories-modal-close:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px; padding: 20px 26px 26px;
    }
    .story-card {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px;
      cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
    }
    .story-card::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--accent-dim) 0%, transparent 60%);
      opacity: 0; transition: opacity .2s;
    }
    .story-card:hover { border-color: var(--accent); transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(99,102,241,.2); }
    .story-card:hover::before { opacity: 1; }
    .story-card.active { border-color: var(--accent); background: rgba(99,102,241,.12); }
    .story-card-icon  { font-size: 2rem; line-height: 1; margin-bottom: 12px; display: block; }
    .story-card-name  { font-size: .88rem; font-weight: 700; margin-bottom: 5px; color: var(--text); }
    .story-card-range { font-size: .6rem; color: var(--accent-hi); font-weight: 500;
      letter-spacing: .04em; margin-bottom: 8px; }
    .story-card-desc  { font-size: .68rem; color: var(--text-dim); line-height: 1.55; }
    .story-card-count { margin-top: 12px; font-size: .6rem; color: var(--muted);
      display: flex; align-items: center; gap: 4px; }
    .story-card-dot   { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

    /* ── Scale + info bar ───────────────────── */
    .scale-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 18px; background: rgba(8,9,13,.86);
      border-bottom: 1px solid var(--border);
      font-size: .65rem; color: var(--muted); flex-shrink: 0; gap: 12px;
      letter-spacing: .01em;
    }
    .scale-bar strong { color: var(--accent-hi); font-weight: 600; }
    .scale-count { color: var(--muted); }

    /* ── Legend / filter bar ────────────────── */
    .legend-bar {
      display: flex; align-items: center; gap: 10px; padding: 8px 18px;
      background: rgba(8,9,13,.86); border-bottom: 1px solid var(--border);
      overflow: visible; flex-shrink: 0; flex-wrap: wrap;
    }
    .legend-bar.is-hidden { display: none; }
    .legend-bar::-webkit-scrollbar { display: none; }
    .filter-section { display: flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
    .legend-label {
      font-size: .58rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .09em; white-space: nowrap; flex-shrink: 0;
    }
    .legend-items { display: flex; gap: 4px; flex-wrap: wrap; }
    .legend-item {
      display: flex; align-items: center; gap: 6px; font-size: .65rem;
      color: var(--muted); cursor: pointer; min-height: 30px; padding: 0 10px;
      border-radius: 999px; border: 1px solid transparent;
      transition: all .15s; white-space: nowrap;
    }
    .legend-item:hover { border-color: var(--border-hi); color: var(--text-dim); background: var(--surface3); }
    .legend-item.active { border-color: var(--border-hi); color: var(--text); background: var(--surface2); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
    .legend-item svg { flex-shrink: 0; }
    .legend-sep { width: 1px; height: 16px; background: var(--border-hi); flex-shrink: 0; margin: 0 2px; }
    .evidence-items { display: flex; gap: 4px; flex-wrap: wrap; }
    .evidence-item {
      display: flex; align-items: center; gap: 6px; font-size: .65rem;
      color: var(--muted); cursor: pointer; min-height: 30px; padding: 0 10px;
      border-radius: 999px; border: 1px solid transparent;
      transition: all .15s; white-space: nowrap;
    }
    .evidence-item:hover { border-color: var(--border-hi); color: var(--text-dim); background: var(--surface3); }
    .evidence-item.active { border-color: var(--border-hi); color: var(--text); background: var(--surface2); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
    .evidence-swatch {
      width: 12px; height: 12px; border-radius: 50%;
      border: 1px solid currentColor; flex-shrink: 0; position: relative;
    }
    .evidence-swatch.proven { background: currentColor; }
    .evidence-swatch.probable {
      background: currentColor; opacity: .75;
    }
    .evidence-swatch.hypothesis {
      background: transparent; border-style: dashed;
    }
    .evidence-swatch.traditional {
      background: transparent;
    }
    .evidence-swatch.traditional::after {
      content: ''; position: absolute; left: 2px; right: 2px; top: 50%;
      border-top: 1px solid currentColor; transform: rotate(-35deg);
    }
    .evidence-swatch.reference {
      border-radius: 3px; background: transparent;
    }

    /* ── Main layout ────────────────────────── */
    .main { flex: 1; display: flex; overflow: hidden; position: relative; min-height: 0; isolation: isolate; }
    .left-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; transition: margin-right .3s cubic-bezier(.16,1,.3,1); }
    .main.panel-open .left-col { margin-right: var(--panel-w); }

    /* ── Map ────────────────────────────────── */
    #map { height: clamp(260px, 34vh, 390px); flex-shrink: 0; background: var(--bg); position: relative; }
    #map.map-hidden, #mapResizeHandle.map-hidden { display: none; }
    .map-hint-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(6,6,18,.82); backdrop-filter: blur(10px);
      border: 1px solid var(--border-hi); border-radius: 999px;
      padding: 6px 16px; font-size: .64rem; color: var(--muted);
      pointer-events: none; z-index: 500; white-space: nowrap;
      transition: opacity .3s; letter-spacing: .02em;
    }
    .map-hint-overlay.hidden { opacity: 0; pointer-events: none; }
    .leaflet-container { background: var(--bg) !important; }
    .leaflet-control-attribution {
      background: rgba(8,9,13,.66) !important;
      color: var(--muted) !important;
      border-radius: var(--radius-sm) 0 0 0;
      font-size: .55rem !important;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }

    /* Pulsing marker */
    .hist-marker { width: 14px; height: 14px; border-radius: 50%; position: relative; }
    .hist-marker::after {
      content: ''; position: absolute; top: -5px; left: -5px;
      width: 24px; height: 24px; border-radius: 50%; background: inherit; opacity: .4;
      animation: pulse-ring 1.6s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(.7); opacity: .4; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Map collapse button */
    .map-toggle-btn {
      position: absolute; bottom: 10px; right: 10px; z-index: 10;
      background: rgba(6,6,18,.85); backdrop-filter: blur(10px);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: 999px; min-height: 32px; padding: 0 13px; font-size: .63rem;
      font-family: inherit; cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    .map-toggle-btn:hover { border-color: var(--accent); color: var(--accent-hi); }

    /* ── Map resize handle ──────────────────── */
    #mapResizeHandle {
      height: 5px; flex-shrink: 0;
      background: var(--border); cursor: ns-resize;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    #mapResizeHandle:hover, #mapResizeHandle.dragging { background: var(--accent); }
    #mapResizeHandle::after {
      content: ''; width: 36px; height: 2px; border-radius: 2px;
      background: rgba(255,255,255,.12); pointer-events: none;
    }

    /* ── Canvas area ────────────────────────── */
    .canvas-area { flex: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0; }
    #c { display: block; cursor: grab; touch-action: none; }
    .hint {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(6,6,18,.78); backdrop-filter: blur(12px);
      border: 1px solid var(--border-hi); border-radius: 999px;
      padding: 6px 14px; font-size: .62rem; color: var(--muted);
      pointer-events: none; white-space: nowrap; letter-spacing: .025em;
    }
    .canvas-controls {
      position: absolute; left: 14px; bottom: 14px; z-index: 20;
      display: flex; gap: 6px; padding: 4px;
      background: rgba(8,9,13,.74); border: 1px solid var(--border-hi);
      border-radius: 999px; backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .canvas-control-btn {
      width: 32px; height: 32px; border-radius: 999px;
      border: 1px solid transparent; background: transparent;
      color: var(--text-dim); font-size: .86rem; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s;
    }
    .canvas-control-btn:hover {
      color: var(--accent-hi); background: var(--accent-dim);
      border-color: rgba(94,234,212,.22);
    }

    /* ── Tooltip ────────────────────────────── */
    #tooltip {
      position: fixed; z-index: 1100;
      background: rgba(12,12,32,.95); backdrop-filter: blur(18px);
      border: 1px solid var(--border-hi); border-radius: var(--radius);
      padding: 10px 14px; max-width: 240px;
      box-shadow: 0 8px 36px rgba(0,0,0,.65), 0 0 0 1px var(--accent-glow);
      pointer-events: none; opacity: 0; transition: opacity .1s;
    }
    #tooltip.show { opacity: 1; }
    #tooltip h4 { font-size: .78rem; font-weight: 600; margin-bottom: 3px; color: var(--text); }
    #tooltip .tt-yr   { font-size: .62rem; color: var(--accent-hi); margin-bottom: 4px; font-weight: 500; }
    #tooltip .tt-desc { font-size: .67rem; color: var(--text-dim); line-height: 1.45; }

    /* ── Side Panel ─────────────────────────── */
    #popup {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: var(--panel-w); z-index: 1200;
      background: rgba(16,18,25,.98);
      backdrop-filter: blur(18px);
      border-left: 1px solid var(--border-hi);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.16,1,.3,1);
    }
    #popup.open { transform: translateX(0); }

    /* Panel header — large, dramatic */
    .ph {
      padding: 22px 24px 16px; border-bottom: 1px solid var(--border);
      position: relative; z-index: 2; flex-shrink: 0;
      background: linear-gradient(180deg, var(--surface2) 0%, var(--surface) 100%);
    }
    .ph-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .ph h2 { font-size: clamp(1.06rem, 1.2vw, 1.24rem); font-weight: 750; line-height: 1.32; flex: 1; color: var(--text); letter-spacing: 0; }
    .ph-close {
      width: 34px; height: 34px; background: var(--surface3);
      border: 1px solid var(--border-hi); color: var(--muted);
      border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem; transition: all .15s; flex-shrink: 0;
    }
    .ph-close:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ph-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .ph-loc-row { display: flex; flex-wrap: wrap; gap: 12px; }

    /* Filter row */
    .ph-filter {
      padding: 10px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .filter-related-btn {
      font-size: .62rem; font-family: inherit;
      background: transparent; border: 1px solid var(--border-hi);
      color: var(--muted); border-radius: 999px;
      min-height: 30px; padding: 0 12px; cursor: pointer; transition: all .15s;
    }
    .filter-related-btn:hover { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-dim); }
    .filter-related-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .filter-note { font-size: .58rem; color: var(--muted); }

    /* Panel body — scrollable, generous spacing */
    .pb { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
    .pb, .pb * { user-select: text; }

    /* Meta tags */
    .mtag {
      background: var(--surface3); border: 1px solid var(--border-hi);
      border-radius: 999px; padding: 4px 12px; font-size: .66rem;
      color: var(--text-dim); letter-spacing: .02em;
    }
    .mtag.evidence-proven { color: #86efac; border-color: rgba(134,239,172,.35); }
    .mtag.evidence-probable { color: #fde68a; border-color: rgba(253,230,138,.35); }
    .mtag.evidence-hypothesis { color: #93c5fd; border-color: rgba(147,197,253,.35); border-style: dashed; }
    .mtag.evidence-traditional { color: #f0abfc; border-color: rgba(240,171,252,.35); }
    .mtag.evidence-reference { color: var(--muted); border-color: var(--border-hi); }
    .evidence-note {
      background: rgba(255,255,255,.025); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      font-size: .74rem; line-height: 1.65; color: var(--text-dim);
    }
    .evidence-note strong { color: var(--text); font-weight: 600; }

    /* Content sections */
    .pdesc   { font-size: .92rem; line-height: 1.75; color: var(--text); }
    .pdetail { font-size: .84rem; line-height: 1.78; color: var(--text-dim); }
    .psect   {
      font-size: .6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: 6px;
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .map-loc-tag { font-size: .68rem; color: var(--accent-hi); display: flex; align-items: center; gap: 5px; }
    .span-tag    { font-size: .68rem; color: var(--text-dim);  display: flex; align-items: center; gap: 5px; }

    /* Region legend in panel */
    .region-legend { display: flex; flex-direction: column; gap: 4px; }
    .region-legend-item {
      display: flex; align-items: center; gap: 8px; font-size: .66rem; color: var(--text-dim);
    }
    .region-legend-swatch {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.15);
    }

    /* Region tooltip on map */
    .region-tooltip {
      background: var(--surface2) !important;
      color: var(--text-dim) !important;
      border: 1px solid var(--border-hi) !important;
      border-radius: var(--radius-sm) !important;
      font-size: .65rem !important;
      padding: 2px 7px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.4) !important;
      letter-spacing: .02em;
    }
    .region-tooltip::before { border: none !important; }

    /* ── Gallery ────────────────────────────── */
    .gallery-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .gallery-scroll::-webkit-scrollbar { height: 3px; }
    .gallery-scroll::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
    .gallery-img-wrap { flex-shrink: 0; width: 150px; }
    .gallery-img-wrap img {
      width: 150px; height: 95px; object-fit: cover;
      border-radius: var(--radius-sm); border: 1px solid var(--border-hi);
      display: block; background: var(--surface2); cursor: pointer;
      transition: all .18s;
    }
    .gallery-img-wrap img:hover { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-glow); }
    .gallery-caption {
      font-size: .56rem; color: var(--muted); margin-top: 4px;
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gallery-loading { font-size: .63rem; color: var(--muted); padding: 6px 0; display: flex; align-items: center; gap: 7px; }
    .gallery-spinner {
      width: 12px; height: 12px; border: 2px solid var(--border-hi);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Lightbox ───────────────────────────── */
    #lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.92); backdrop-filter: blur(6px);
      z-index: 9999; display: none; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 88vh; border-radius: var(--radius); box-shadow: 0 0 80px rgba(0,0,0,.9); }
    #lightboxClose {
      position: absolute; top: 18px; right: 22px; background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 1rem;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    #lightboxClose:hover { background: rgba(255,255,255,.2); }

    /* ── Wikipedia extract ──────────────────── */
    .wiki-section { display: flex; flex-direction: column; gap: 8px; }
    .wiki-extract {
      font-size: .78rem; line-height: 1.8; color: var(--text-dim);
      display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .wiki-extract.expanded { -webkit-line-clamp: unset; }
    .wiki-expand-btn {
      font-size: .6rem; color: var(--accent-hi); background: none; border: none;
      cursor: pointer; padding: 0; font-family: inherit; text-align: left;
      opacity: .8; transition: opacity .15s;
    }
    .wiki-expand-btn:hover { opacity: 1; }
    .wiki-link-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface3); border: 1px solid var(--border-hi);
      color: var(--text-dim); border-radius: 999px;
      min-height: 30px; padding: 0 12px; font-size: .62rem; font-family: inherit;
      cursor: pointer; text-decoration: none; transition: all .15s;
      align-self: flex-start;
    }
    .wiki-link-btn:hover {
      border-color: var(--accent); color: var(--accent-hi);
      background: var(--accent-dim);
    }

    /* ── Story prev/next nav ────────────────── */
    .story-nav {
      display: flex; align-items: center; gap: 4px;
      background: rgba(99,102,241,.1); border: 1px solid rgba(99,102,241,.25);
      border-radius: 999px; padding: 2px 5px;
    }
    .story-nav-btn {
      background: none; border: none; color: var(--accent-hi);
      font-size: .65rem; font-family: inherit; cursor: pointer;
      padding: 1px 5px; border-radius: 10px; transition: all .15s;
    }
    .story-nav-btn:hover:not(:disabled) { background: var(--accent-dim); }
    .story-nav-btn:disabled { opacity: .3; cursor: default; }
    .story-nav-pos {
      font-size: .6rem; color: var(--muted); white-space: nowrap; min-width: 34px;
      text-align: center;
    }

    /* ── Related events ─────────────────────── */
    .rel-list { display: flex; flex-direction: column; gap: 5px; }
    .rel-item {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; transition: all .15s;
    }
    .rel-item:hover { border-color: var(--accent); background: var(--accent-dim); }
    .rel-name { font-size: .7rem; font-weight: 500; }
    .rel-yr   { font-size: .6rem; color: var(--muted); }

    /* ── Scrollbars ─────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── Mobile legend toggle ───────────────── */
    .legend-toggle-btn {
      display: none; background: var(--surface3); border: 1px solid var(--border-hi);
      color: var(--muted); border-radius: 999px; min-height: 34px; padding: 0 12px;
      font-size: .62rem; font-family: inherit; cursor: pointer;
      white-space: nowrap; margin-left: auto; flex-shrink: 0; transition: all .15s;
    }
    .legend-toggle-btn:hover { border-color: var(--accent); color: var(--accent-hi); }

    /* ══════════════════════════════════════════
       MOBILE / TABLET ≤ 768 px
       ══════════════════════════════════════════ */
    @media (max-width: 1080px) {
      header { flex-wrap: wrap; align-content: center; row-gap: 8px; }
      .era-btns { order: 3; flex-basis: 100%; }
      .main.panel-open .left-col { margin-right: 0; }
      #popup {
        width: min(420px, 46vw);
        box-shadow: -18px 0 38px rgba(0,0,0,.38);
      }
    }

    @media (max-width: 768px) {
      :root { --topbar-h: 54px; }
      header { padding: 9px 12px; gap: 8px; min-height: var(--topbar-h); flex-wrap: nowrap; }
      .header-title { min-width: 0; }
      .header-title h1 { font-size: .86rem; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }
      .header-sep { display: none; }
      .era-btns { display: none; }
      .legend-toggle-btn { display: block; }
      .stories-btn { min-width: 38px; padding: 0 11px; }
      .stories-btn span, .chrome-btn .chrome-label { display: none; }
      .chrome-btn { min-width: 38px; padding: 0 11px; justify-content: center; }

      .search-wrap.open { width: min(52vw, 210px); }
      .search-wrap.open .search-input { font-size: .68rem; }
      .search-results { width: calc(100vw - 24px); right: -52px; max-height: min(420px, 70vh); }
      .search-result { min-height: 48px; }

      .scale-bar { padding: 6px 12px; font-size: .6rem; flex-wrap: wrap; gap: 4px 10px; }

      .legend-bar { padding: 8px 12px; gap: 8px; align-items: flex-start; }
      .filter-section { gap: 6px; }
      .legend-items { flex-wrap: nowrap; }
      .legend-item, .evidence-item { min-height: 38px; padding: 0 12px; font-size: .68rem; }
      .legend-bar.mob-collapsed .filter-section,
      .legend-bar.mob-collapsed .legend-sep { display: none; }
      .legend-bar.mob-collapsed { padding: 6px 12px; justify-content: flex-end; }

      #map { height: min(34vh, 230px); min-height: 150px; transition: height .25s cubic-bezier(.16,1,.3,1); overflow: hidden; }
      #map.mob-collapsed {
        flex: 0 0 44px !important;
        height: 44px !important;
        min-height: 44px !important;
        max-height: 44px !important;
        border-bottom: 1px solid var(--border);
      }
      #map.mob-collapsed .leaflet-pane,
      #map.mob-collapsed .leaflet-control-container,
      #map.mob-collapsed .map-hint-overlay { opacity: 0; pointer-events: none; }
      #mapResizeHandle { display: none; }
      .stories-grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
      .stories-modal-header { padding: 16px; }
      .story-bar { padding: 5px 12px; font-size: .67rem; flex-wrap: wrap; }
      .story-bar-count { display: none; }
      .story-nav-pos { min-width: 28px; font-size: .58rem; }

      .hint { font-size: .58rem; padding: 6px 12px; bottom: 10px; max-width: calc(100vw - 28px); overflow: hidden; text-overflow: ellipsis; }
      .canvas-controls { left: 10px; bottom: 10px; }
      .canvas-control-btn { width: 40px; height: 40px; font-size: 1rem; }

      .main.panel-open .left-col { margin-right: 0; }
      #popup { width: 100% !important; max-height: 72dvh;
        top: auto !important; bottom: 0; border-left: none;
        border-top: 1px solid var(--border-hi); border-radius: 18px 18px 0 0;
        transform: translateY(100%); box-shadow: 0 -18px 44px rgba(0,0,0,.5); }
      #popup.open { transform: translateY(0); }
      #popup::before {
        content: ''; width: 44px; height: 4px; border-radius: 4px;
        background: var(--border-hi); position: absolute; top: 8px; left: 50%;
        transform: translateX(-50%); z-index: 3;
      }

      .ph  { padding: 22px 16px 12px; }
      .ph h2 { font-size: 1rem; }
      .ph-filter { padding: 8px 16px; }
      .pb  { padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); gap: 16px; }
      .pdesc { font-size: .9rem; line-height: 1.65; }
      .pdetail, .wiki-extract { font-size: .82rem; line-height: 1.68; }

      .gallery-img-wrap      { width: 120px; }
      .gallery-img-wrap img  { width: 120px; height: 75px; }
      .story-nav-btn, .story-exit-btn, .filter-related-btn, .map-toggle-btn { min-height: 40px; }
      .ph-close, .stories-modal-close, #lightboxClose { min-width: 40px; min-height: 40px; }
    }

    @media (max-width: 400px) {
      .header-title h1 { font-size: .80rem; }
      .stories-grid { grid-template-columns: 1fr; }
      .legend-item span, .evidence-item span { max-width: 74px; overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <h1>Human History Timeline</h1>
  </div>
  <div class="header-sep"></div>
  <div class="era-btns" id="eraBtns"></div>
  <div class="header-right">
    <div class="search-wrap" id="searchWrap">
      <button class="search-icon" id="searchIcon" aria-label="Search events">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.5 8.5L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <input class="search-input" id="searchInput" type="text" placeholder="Search events…" autocomplete="off" />
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="chrome-btn" id="btnToggleMap" type="button" aria-pressed="false">
      <span class="chrome-icon" aria-hidden="true">□</span>
      <span class="chrome-label">Map</span>

      <span class="chrome-icon" aria-hidden="true">≡</span>
      <span class="chrome-label">Filters</span>

    <button class="stories-btn" id="btnStories" aria-label="Open stories">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="2" width="12" height="1.5" rx=".75" fill="currentColor"/>
        <rect x="1" y="5.5" width="8" height="1.5" rx=".75" fill="currentColor"/>
        <rect x="1" y="9" width="10" height="1.5" rx=".75" fill="currentColor"/>
      </svg>
      <span>Stories</span>
    </button>
  </div>
</header>

<div class="scale-bar">
  <div id="scaleRange"></div>
  <span class="scale-count" id="scaleCount"></span>
</div>

<div class="legend-bar" id="legendBar">

    <span class="legend-label">Category</span>
    <div class="legend-items" id="legendItems"></div>
  </div>
  <span class="legend-sep"></span>
  <div class="filter-section">
    <span class="legend-label">Evidence</span>
    <div class="evidence-items" id="evidenceItems"></div>
  </div>
  <button class="legend-toggle-btn" id="legendToggleBtn" aria-expanded="true">Close</button>
</div>

<div class="story-bar hidden" id="storyBar">
  <span class="story-bar-icon" id="storyBarIcon"></span>
  <span class="story-bar-name" id="storyBarName"></span>
  <span class="story-bar-count" id="storyBarCount"></span>
  <div class="story-nav" id="storyNav">
    <button class="story-nav-btn" id="btnStoryPrev" title="Previous event">‹</button>
    <span class="story-nav-pos" id="storyNavPos">— / —</span>
    <button class="story-nav-btn" id="btnStoryNext" title="Next event">›</button>
  </div>
  <button class="story-exit-btn" id="btnExitStory">Exit story ✕</button>
</div>

<div class="main">
  <div class="left-col">
    <div id="map">
      <div class="map-hint-overlay" id="mapHint">Event locations appear here</div>
      <button class="map-toggle-btn" id="mapToggleBtn">▾ Hide map</button>
    </div>
    <div id="mapResizeHandle" title="Drag to resize map"></div>
    <div class="canvas-area" id="canvasArea">
      <canvas id="c"></canvas>
      <div class="canvas-controls" aria-label="Timeline zoom controls">
        <button class="canvas-control-btn" id="btnZoomOut" type="button" aria-label="Zoom out">−</button>
        <button class="canvas-control-btn" id="btnZoomReset" type="button" aria-label="Reset zoom">⌂</button>
        <button class="canvas-control-btn" id="btnZoomIn" type="button" aria-label="Zoom in">+</button>
      </div>
      <div class="hint">Drag to pan · Scroll to zoom</div>
    </div>
  </div>

  <div id="popup">
    <div class="ph">
      <div class="ph-top">
        <h2 id="panelTitle"></h2>
        <button class="ph-close" id="panelClose" aria-label="Close details">✕</button>
      </div>
      <div class="ph-meta" id="panelMeta"></div>
      <div class="ph-loc-row">
        <div class="map-loc-tag" id="panelLoc"></div>
        <div class="span-tag"    id="panelSpan"></div>
      </div>
    </div>
    <div class="ph-filter">
      <button id="btnFilterRelated" class="filter-related-btn">Show related only</button>
      <span class="filter-note" id="filterNote"></span>
    </div>
    <div class="pb">
      <div>
        <p class="pdesc" id="panelDesc"></p>
      </div>
      <div class="evidence-note" id="panelEvidence"></div>
      <div>
        <div class="psect">Details</div>
        <p class="pdetail" id="panelDetail"></p>
      </div>
      <div id="panelRegions"></div>
      <div id="panelGallery"></div>
      <div id="panelWiki"></div>
      <div id="panelRel"></div>
    </div>
  </div>
</div>

<!-- Stories modal -->
<div id="storiesModal">
  <div class="stories-modal-inner">
    <div class="stories-modal-header">
      <div class="stories-modal-title">
        <span class="stories-modal-icon">📖</span>
        <div>
          <h2>History Stories</h2>
          <p>Explore a curated lens on history — each story filters the timeline to its key events.</p>
        </div>
      </div>
      <button class="stories-modal-close" id="btnCloseStories" aria-label="Close stories">✕</button>
    </div>
    <div class="stories-grid" id="storiesGrid"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightboxClose" aria-label="Close image">✕</button>
  <img id="lightboxImg" src="" alt="" />
</div>

<div id="tooltip">
  <h4 id="ttTitle"></h4>
  <div class="tt-yr"   id="ttYear"></div>
  <div class="tt-desc" id="ttDesc"></div>
</div>

  { id:'e_napoleon', name:'Napoleonic Wars', year:1803, minTier:5, cat:'conflict', imp:0.85,

  { id:'e_congress_vienna', name:'Congress of Vienna', year:1814, minTier:5, cat:'politics', imp:0.82,
    span:[1814,1815],
    loc:[48.21,16.37,8,'Vienna, Austria'],
    evidence:'proven', confidence:0.99,
    source:'Actes du Congrès de Vienne (1815); Harold Nicolson, The Congress of Vienna (1946).',
    desc:'European powers redraw the post-Napoleonic map and attempt to restore conservative order.',
    detail:'Meeting from September 1814 to June 1815, the Congress of Vienna was dominated by Austria (Metternich), Britain (Castlereagh), Prussia, and Russia. It restored the Bourbon dynasty in France, redrew borders, and established the Concert of Europe — a great-power system meant to suppress revolution and maintain the balance of power. Its conservative settlement directly caused the backlash revolutions of 1830 and 1848.' },

  { id:'e_slave_trade_act_1807', name:'British Slave Trade Act 1807', year:1807, minTier:5, cat:'politics', imp:0.82,
    loc:[51.5,-0.12,5,'London, England'],
    evidence:'proven', confidence:0.99,
    source:'Slave Trade Act 1807 (47 Geo. 3, Sess. 1, c. 36); legislation.gov.uk; Marcus Wood, Blind Memory (2000).',
    desc:'Britain abolishes the transatlantic slave trade — but not the institution of slavery itself.',
    detail:'The Slave Trade Act 1807 made it illegal for British subjects to participate in the transatlantic slave trade, with fines of £100 per enslaved person found on a British vessel. Passed after two decades of parliamentary campaigning by William Wilberforce, Thomas Clarkson, and the abolitionist network (the Clapham Sect), it was a landmark — but it did not free those already enslaved in British colonies. The Royal Navy\'s West Africa Squadron patrolled to intercept slavers after 1808, intercepting roughly 1,600 ships and liberating about 150,000 Africans by the 1860s. The 1807 Act set the stage for the full abolition debate that culminated in 1833.' },

  { id:'e_slavery_abolition_1833', name:'British Slavery Abolition Act 1833', year:1833, minTier:5, cat:'politics', imp:0.88,
    span:[1833,1838],
    loc:[51.5,-0.12,5,'London, England / Caribbean'],
    evidence:'proven', confidence:0.99,
    source:'Slavery Abolition Act 1833 (3 & 4 Will. 4, c. 73); legislation.gov.uk; Catherine Hall et al., Legacies of British Slave-ownership (2014).',
    desc:'Britain ends slavery across most of its empire — but compensates enslavers, not the enslaved.',
    detail:'The Slavery Abolition Act received royal assent on August 28, 1833, and came into force on August 1, 1834 — today\'s date in history. It freed approximately 800,000 enslaved people across British Caribbean colonies, South Africa, and Mauritius (India was excluded). The mechanism was controversial: the British government paid £20 million — roughly 40% of annual Treasury revenue — to slave owners as compensation for their "property." The enslaved received nothing. Moreover, the Act imposed a mandatory "apprenticeship" period of four to six years in which formerly enslaved people remained bound to labor for their former owners. Full freedom came on August 1, 1838, when the apprenticeship system was abolished early due to its obvious resemblance to slavery. The £20 million government loan was financed by taxpayers and was not fully repaid until 2015. Wilberforce died in July 1833, three days after hearing the bill would pass.' },

  { id:'e_july_revolution_1830', name:'July Revolution (France, 1830)', year:1830, minTier:5, cat:'politics', imp:0.78,
    span:[1830,1830],
    loc:[48.85,2.35,11,'Paris, France'],
    evidence:'proven', confidence:0.99,
    source:'Wikipedia: July Revolution; David Pinkney, The French Revolution of 1830 (1972).',
    desc:"Three days of Parisian barricades overthrow Charles X and install a constitutional monarchy.",
    detail:"On July 26, 1830, King Charles X issued the July Ordinances: suppressing press freedom, dissolving the newly elected Chamber, and narrowing the electorate to the wealthiest landowners. Paris erupted in three days of street fighting (July 27–29 — les Trois Glorieuses). The Royal Guard faltered; Charles X fled to England. Liberal parliamentary leaders maneuvered to install Louis-Philippe (Duke of Orléans) as 'King of the French' rather than 'King of France' — the phrasing itself signaling that sovereignty now derived from the people, not hereditary right. The revolution sparked the Belgian Revolution (August 1830), Polish and Italian uprisings, and planted the seeds of the 1848 wave." },

  { id:'e_revolutions_1830', name:'Revolutions of 1830', year:1830, minTier:6, cat:'politics', imp:0.70,
    span:[1830,1831],
    loc:[50.85,4.35,5,'Brussels, Belgium'],
    evidence:'proven', confidence:0.98,
    source:'Wikipedia: Revolutions of 1830; Jonathan Sperber, The European Revolutions 1848–1851 (2005).',
    desc:'The July Revolution ripples across Europe: Belgium wins independence, Poland rises against Russia.',
    detail:"Inspired by Paris, Belgium revolted against Dutch rule in August 1830 and achieved independence as a constitutional monarchy by 1831. Poland launched the November Uprising against Russian rule (November 1830), which was crushed by 1831. Uprisings also flared in Italian and German states. Together, the 1830 wave demonstrated that the Congress of Vienna's conservative settlement was fragile — and set the stage for the broader 1848 revolutions." },

  { id:'e_communist_manifesto', name:'Communist Manifesto', year:1848, minTier:5, cat:'politics', imp:0.82,

  { id:'e_us_civil_war', name:'US Civil War', year:1861, minTier:5, cat:'conflict', imp:0.85,

  { id:'e_abolition', name:'Abolition of Slavery (US)', year:1863, minTier:5, cat:'politics', imp:0.9,

  { id:'e_reconstruction', name:'US Reconstruction', year:1866, minTier:5, cat:'politics', imp:0.82,
    span:[1865,1877],
    loc:[38.9,-77.04,5,'Washington DC, USA'],
    evidence:'proven', confidence:0.95,
    source:'Library of Congress, African American Odyssey exhibit; Eric Foner, Reconstruction: America\'s Unfinished Revolution (1988)',
    desc:'Congressional Reconstruction reshapes the South — and is dismantled by 1877.',
    detail:"Reconstruction (1865–1877) attempted to integrate four million formerly enslaved people into American civic life. The 13th, 14th, and 15th Amendments abolished slavery, established birthright citizenship, and guaranteed Black male suffrage. African Americans voted, held office, built schools, and negotiated labor contracts in significant numbers. But organized white resistance — including the Ku Klux Klan and paramilitary groups — steadily eroded these gains. The Compromise of 1877 withdrew federal troops from the South; within two decades, Jim Crow laws and disenfranchisement campaigns reversed nearly all Reconstruction-era political gains. Historians call it 'America's unfinished revolution.'" },

  { id:'e_14th_amendment', name:'14th Amendment Ratified', year:1868, minTier:5, cat:'politics', imp:0.85,
    loc:[38.9,-77.04,6,'Washington DC, USA'],
    evidence:'proven', confidence:0.99,
    source:'National Archives; ratified July 9, 1868',
    desc:'Birthright citizenship and equal protection become constitutional law.',
    detail:"Ratified July 9, 1868, the 14th Amendment granted citizenship to all persons born or naturalized in the United States, overturning Dred Scott v. Sandford (1857). Its Equal Protection and Due Process clauses became the foundation for nearly all subsequent civil rights litigation, from Brown v. Board of Education (1954) to Obergefell v. Hodges (2015)." },

  { id:'e_wwi', name:'World War I', year:1914, minTier:5, cat:'conflict', imp:0.95,

  { id:'e_sarajevo_1914', name:'Assassination of Archduke Franz Ferdinand', year:1914, minTier:4, cat:'conflict', imp:0.88,
    loc:[43.86,18.41,12,'Sarajevo, Bosnia-Herzegovina'],
    evidence:'proven', confidence:0.99,
    source:'Broadly documented; Austro-Hungarian state records, contemporaneous press, and subsequent trials of conspirators.',
    desc:'Gavrilo Princip shoots Archduke Franz Ferdinand on June 28, triggering the July Crisis.',
    detail:'On June 28, 1914, Archduke Franz Ferdinand, heir to the Austro-Hungarian throne, and his wife Sophie were shot in Sarajevo by Gavrilo Princip, a Bosnian Serb nationalist connected to the Black Hand secret society. The assassination gave Austria-Hungary the pretext it had been seeking to move against Serbian nationalism. The 37-day "July Crisis" that followed — ultimatums, mobilizations, and treaty obligations — escalated a Balkan incident into a world war.' },

  { id:'e_july_crisis_1914', name:'Austria-Hungary Declares War on Serbia', year:1914, minTier:4, cat:'politics', imp:0.85,
    loc:[47.5,14.5,5,'Vienna, Austria-Hungary'],
    evidence:'proven', confidence:0.99,
    source:'Austro-Hungarian declaration of war, July 28, 1914; documented in diplomatic archives and the Avalon Project primary source collection.',
    desc:'July 28, 1914: Austria-Hungary declares war on Serbia, starting the alliance cascade into WWI.',
    detail:'After Serbia\'s partial rejection of Austria-Hungary\'s 10-point ultimatum (July 23), Austria-Hungary — backed by Germany\'s "blank check" of unconditional support — declared war on July 28, 1914. Russia mobilized to defend Serbia; Germany declared war on Russia (Aug 1) and France (Aug 3); Britain entered after Germany violated Belgian neutrality (Aug 4). The rigid Schlieffen Plan timetable left diplomats almost no room to halt the cascade once mobilization began.' },

  { id:'e_treaty_london_1839', name:'Treaty of London — Belgian Neutrality Guaranteed', year:1839, minTier:3, cat:'politics', imp:0.72,
    loc:[50.85,4.35,7,'Brussels, Belgium'],
    evidence:'proven', confidence:0.99,
    source:'Treaty of London, April 19, 1839; text available at the Avalon Project, Yale Law School.',
    desc:'The five great powers collectively guarantee Belgian neutrality — the legal tripwire that brings Britain into WWI 75 years later.',

function normalizeEventEvidence(ev) {
  if (!ev.evidence) ev.evidence = ev.isDynamic ? 'reference' : 'proven';
  if (!EVIDENCE[ev.evidence]) ev.evidence = 'proven';
  if (typeof ev.confidence !== 'number') {
    ev.confidence = ev.evidence === 'proven' ? 0.9
      : ev.evidence === 'probable' ? 0.68
      : ev.evidence === 'traditional' ? 0.35
      : ev.evidence === 'hypothesis' ? 0.3
      : 0.5;
  }
  ev.confidence = Math.max(0, Math.min(1, ev.confidence));
  return ev;
}

EVENTS.forEach(normalizeEventEvidence);

async function fetchWikiImages(wikiTitles) {
  if (!wikiTitles || !wikiTitles.length) return [];
  const titles = wikiTitles.slice(0, 3).join('|'); // max 3 articles
  const url = `https://en.wikipedia.org/w/api.php?` + new URLSearchParams({
    action: 'query', titles, prop: 'pageimages', format: 'json',
    pithumbsize: 400, origin: '*',
  });
  try {
    const res  = await fetch(url);
    const data = await res.json();
    return Object.values(data.query.pages)
      .filter(p => p.thumbnail && p.thumbnail.source)
      .map(p => ({ url: p.thumbnail.source, caption: p.title.replace(/_/g, ' ') }));
  } catch { return []; }
}

async function fetchWikiExtract(title) {
  if (wikiExtractCache.has(title)) return wikiExtractCache.get(title);
  const url = `https://en.wikipedia.org/w/api.php?` + new URLSearchParams({
    action: 'query', titles: title, prop: 'extracts',
    exintro: '1', explaintext: '1', exsectionformat: 'plain',
    format: 'json', origin: '*',
  });
  try {
    const res  = await fetch(url);
    const data = await res.json();
    const pages = Object.values(data.query.pages);
    const text  = pages[0]?.extract || '';
    // Trim to first ~600 chars ending at a sentence boundary
    const trimmed = text.length > 600
      ? text.slice(0, 600).replace(/\.[^.]*$/, '.') + '..'
      : text;
    wikiExtractCache.set(title, trimmed);
    return trimmed;
  } catch { return ''; }
}

// ═══════════════════════════════════════════════
//  MULTI-TIER DYNAMIC WIKIPEDIA LOADING
//
//  Three granularities fill in events as the user zooms:
//    century  (scale 0.5–5)    → Wikipedia "15th century" articles
//    decade   (scale 5–25)     → Wikipedia "1920s" articles
//    year     (scale 25+)      → Wikipedia "1969" articles
//
//  Each tier fetches wikitext, parses the Events section,
//  and injects lightweight dots into `dynamicEvents`.
// ═══════════════════════════════════════════════

// ── Shared wikitext helpers ──────────────────────
function _stripWikiMarkup(raw) {
  const clean = raw.replace(/\[\[([^\]|]*)\|([^\]]+)\]\]/g, '$2')
                   .replace(/\[\[([^\]]+)\]\]/g, '$1')
                   .replace(/\{\{[^}]*\}\}/g, '')
                   .replace(/'{2,3}/g, '');
  const tmp = document.createElement('div');
  tmp.innerHTML = clean;
  return (tmp.textContent || '').trim();
}

async function _fetchWikitext(title) {
  const url = `https://en.wikipedia.org/w/api.php?` + new URLSearchParams({
    action: 'query', titles: title, prop: 'revisions',
    rvprop: 'content', rvslots: 'main', format: 'json', origin: '*',
  });
  const res  = await fetch(url);
  const data = await res.json();
  const page = Object.values(data.query.pages)[0];
  if (page?.missing) return '';
  return page?.revisions?.[0]?.slots?.main?.['*'] || '';
}

function _guessCat(text) {
  const t = text.toLowerCase();
  if (/\b(war|battle|siege|invad|attack|bomb|milit|army|navy)\b/.test(t)) return 'conflict';
  if (/\b(treaty|elect|king|queen|emperor|parliament|law|constitution|president|republic|colony)\b/.test(t)) return 'politics';
  if (/\b(discover|invent|engine|telescope|vaccine|theory|science|math|phys)\b/.test(t)) return 'technology';
  if (/\b(church|pope|bishop|mosque|temple|religi|christian|islam|buddhis|hindu)\b/.test(t)) return 'religion';
  if (/\b(earthquake|flood|hurricane|famine|plague|eruption|drought|climate)\b/.test(t)) return 'environment';
  if (/\b(voyage|expedition|explore|sail|land|coast|discover.*land)\b/.test(t)) return 'exploration';
  if (/\b(born|die|paint|compose|writ|novel|poet|art|music|university|book)\b/.test(t)) return 'society';
  return 'society';  // default
}

// ── CENTURY-LEVEL PARSER ─────────────────────────
// Wikipedia articles like "15th century" have an Events section
// with sub-headers by decade or bullet points by year.
function _parseCenturyEvents(centuryKey, wikitext) {
  const results = [];
  const evSection = wikitext.match(/==\s*Events\s*==\s*([\s\S]*?)(?:\n==\s*[^=]|\s*$)/i)?.[1] || '';
  const lines = evSection.split('\n');
  for (const line of lines) {
    // Match lines like "* 1453 – Fall of Constantinople"
    // or "* c. 1440 – Gutenberg invents..."
    const m = line.match(/^\*+\s*(?:c\.\s*)?(\d{1,4})\s*(?:BC|BCE|AD|CE)?\s*[–\-—:]\s*(.+)/i);
    if (!m) continue;
    let year = parseInt(m[1], 10);
    // Handle BCE centuries
    if (/\b(BC|BCE)\b/i.test(line) || centuryKey < 0) year = -year;
    const desc = _stripWikiMarkup(m[2]);
    if (!desc || desc.length < 10) continue;
    const cat = _guessCat(desc);
    results.push({
      id: `dyn_c${centuryKey}_${year}_${results.length}`,
      name: desc.slice(0, 60) + (desc.length > 60 ? '…' : ''),
      fullDesc: desc, year, baseYear: centuryKey,
      dynLevel: 'century', minTier: 3, cat, imp: 0.35, isDynamic: true,
      evidence: 'reference', source: `${_centuryTitle(centuryKey)} Wikipedia events list`,
    });
  }
  return results;
}

function _centuryTitle(centuryKey) {
  // centuryKey: 15 → "15th century", -5 → "5th century BC"
  const abs = Math.abs(centuryKey);
  const suffix = abs === 1 ? 'st' : abs === 2 ? 'nd' : abs === 3 ? 'rd' : 'th';
  return centuryKey < 0
    ? `${abs}${suffix}_century_BC`
    : `${abs}${suffix}_century`;
}

function _yearToCentury(yr) {
  // 1453 → 15, -500 → -5, 2024 → 21
  if (yr > 0) return Math.ceil(yr / 100);
  return -Math.ceil(Math.abs(yr) / 100);
}

async function fetchCenturyEvents(centuryKey) {
  const fetched = _wikiFetched.century, fetching = _wikiFetching.century;
  if (fetched.has(centuryKey) || fetching.has(centuryKey)) return;
  fetching.add(centuryKey);
  try {
    const wikitext = await _fetchWikitext(_centuryTitle(centuryKey));
    if (!wikitext) { fetched.add(centuryKey); return; }
    const evs = _parseCenturyEvents(centuryKey, wikitext).map(normalizeEventEvidence);
    dynamicEvents = dynamicEvents.filter(e => !(e.dynLevel === 'century' && e.baseYear === centuryKey)).concat(evs);
    fetched.add(centuryKey);
    scheduleRender();
  } catch {
    fetched.add(centuryKey);
  } finally {
    fetching.delete(centuryKey);
  }
}

// ── DECADE-LEVEL PARSER ──────────────────────────
// Wikipedia articles like "1920s" have Events sections
// with year-prefixed bullets.
function _parseDecadeEvents(decadeKey, wikitext) {
  const results = [];
  const evSection = wikitext.match(/==\s*Events\s*==\s*([\s\S]*?)(?:\n==\s*[^=]|\s*$)/i)?.[1] || '';
  const lines = evSection.split('\n');
  for (const line of lines) {
    // Match "* 1923 – Description" or "* March 15 – Description" (year implicit from article)
    const mYear = line.match(/^\*+\s*(\d{4})\s*[–\-—:]\s*(.+)/);
    const mDate = line.match(/^\*+\s*(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d+)\s*[–\-—:]\s*(.+)/i);
    if (!mYear && !mDate) continue;

    let year, desc;
    if (mYear) {
      year = parseInt(mYear[1], 10);
      desc = _stripWikiMarkup(mYear[2]);
    } else {
      // For month-day entries, use the decade midpoint as approximate year
      year = decadeKey + 5;
      desc = _stripWikiMarkup(mDate[3]);
    }
    if (!desc || desc.length < 10) continue;
    const cat = _guessCat(desc);
    results.push({
      id: `dyn_d${decadeKey}_${year}_${results.length}`,
      name: desc.slice(0, 58) + (desc.length > 58 ? '…' : ''),
      fullDesc: desc, year, baseYear: decadeKey,
      dynLevel: 'decade', minTier: 4, cat, imp: 0.28, isDynamic: true,
      evidence: 'reference', source: `${_decadeTitle(decadeKey)} Wikipedia events list`,
    });
  }
  return results;
}

function _decadeTitle(decadeKey) {
  // decadeKey: 1920 → "1920s", 500 → "500s", -200 → "200s BC"
  const abs = Math.abs(decadeKey);
  return decadeKey < 0 ? `${abs}s_BC` : `${abs}s`;
}

function _yearToDecade(yr) {
  return Math.floor(yr / 10) * 10;
}

async function fetchDecadeEvents(decadeKey) {
  const fetched = _wikiFetched.decade, fetching = _wikiFetching.decade;
  if (fetched.has(decadeKey) || fetching.has(decadeKey)) return;
  fetching.add(decadeKey);
  try {
    const wikitext = await _fetchWikitext(_decadeTitle(decadeKey));
    if (!wikitext) { fetched.add(decadeKey); return; }
    const evs = _parseDecadeEvents(decadeKey, wikitext).map(normalizeEventEvidence);
    dynamicEvents = dynamicEvents.filter(e => !(e.dynLevel === 'decade' && e.baseYear === decadeKey)).concat(evs);
    fetched.add(decadeKey);
    scheduleRender();
  } catch {
    fetched.add(decadeKey);
  } finally {
    fetching.delete(decadeKey);
  }
}

// ── YEAR-LEVEL PARSER ────────────────────────────
function _parseYearEvents(year, wikitext) {
  const results = [];
  const evSection = wikitext.match(/==\s*Events\s*==\s*([\s\S]*?)(?:\n==\s*[^=]|\s*$)/i)?.[1] || '';
  const lines = evSection.split('\n');
  const MONTHS = {january:0,february:1,march:2,april:3,may:4,june:5,
                  july:6,august:7,september:8,october:9,november:10,december:11};
  for (const line of lines) {
    const m = line.match(/^\*+\s*(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d+)\s*[–\-—:]\s*(.+)/i);
    if (!m) continue;
    const month = MONTHS[m[1].toLowerCase()];
    const day   = parseInt(m[2], 10);
    const desc  = _stripWikiMarkup(m[3]);
    if (!desc || desc.length < 10) continue;
    const fracYear = year + (month * 30.44 + day) / 365.25;
    const cat = _guessCat(desc);
    results.push({
      id: `dyn_y${year}_${month}_${day}_${results.length}`,
      name: desc.slice(0, 55) + (desc.length > 55 ? '…' : ''),
      fullDesc: desc, year: fracYear, baseYear: year,
      month: m[1], day,
      dynLevel: 'year', minTier: 5, cat, imp: 0.22, isDynamic: true,
      evidence: 'reference', source: `${year} Wikipedia events list`,
    });
  }
  return results;
}

async function fetchYearEvents(year) {
  const fetched = _wikiFetched.year, fetching = _wikiFetching.year;
  if (fetched.has(year) || fetching.has(year)) return;
  fetching.add(year);
  if (year < 1 || year > MAX_YEAR) { fetched.add(year); fetching.delete(year); return; }
  try {
    const wikitext = await _fetchWikitext(String(year));
    if (!wikitext) { fetched.add(year); return; }
    const evs = _parseYearEvents(year, wikitext).map(normalizeEventEvidence);
    dynamicEvents = dynamicEvents.filter(e => !(e.dynLevel === 'year' && e.baseYear === year)).concat(evs);
    fetched.add(year);
    scheduleRender();
  } catch {
    fetched.add(year);
  } finally {
    fetching.delete(year);
  }
}

// ── UNIFIED LOADER (called on each render) ───────
function _doLoadWikiEvents() {
  if (activeStory) return;   // don't load dynamic events in story mode
  const vMin = xToYear(0), vMax = xToYear(W);

  // CENTURY LEVEL — scale 0.5+ (viewing <600k years)
  if (scale >= 0.5) {
    const cMin = _yearToCentury(Math.max(Math.ceil(vMin), -3000));
    const cMax = _yearToCentury(Math.min(Math.floor(vMax), MAX_YEAR));
    for (let c = cMin; c <= cMax && _wikiInFlight() < WIKI_MAX_CONCURRENT; c++) {
      if (c === 0) continue;  // no "0th century"
      fetchCenturyEvents(c);
    }
  }

  // DECADE LEVEL — scale 5+ (viewing <250 years)
  if (scale >= 5) {
    const dMin = _yearToDecade(Math.max(Math.ceil(vMin), -500));
    const dMax = _yearToDecade(Math.min(Math.floor(vMax), MAX_YEAR));
    for (let d = dMin; d <= dMax && _wikiInFlight() < WIKI_MAX_CONCURRENT; d += 10) {
      fetchDecadeEvents(d);
    }
  }

  // YEAR LEVEL — scale 25+ (viewing <50 years)
  if (scale >= 25) {
    const yMin = Math.max(1, Math.ceil(vMin));
    const yMax = Math.min(MAX_YEAR, Math.floor(vMax));
    let queued = 0;
    for (let yr = yMin; yr <= yMax && _wikiInFlight() < WIKI_MAX_CONCURRENT && queued < 15; yr++) {
      if (!_wikiFetched.year.has(yr) && !_wikiFetching.year.has(yr)) { fetchYearEvents(yr); queued++; }
    }
  }
}

function maybeLoadWikiEvents() {
  clearTimeout(_wikiDebounceTimer);
  _wikiDebounceTimer = setTimeout(_doLoadWikiEvents, 300);
}

function drawShapePath(ctx, x, y, r, shape) {
  ctx.beginPath();
  switch (shape) {
    case 'diamond':
      ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.85, y);
      ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.85, y); ctx.closePath(); break;
    case 'square': {
      const s = r * 0.82;
      ctx.rect(x - s, y - s, s * 2, s * 2); break;
    }
    case 'triangle':
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r * 0.9, y + r * 0.72);
      ctx.lineTo(x - r * 0.9, y + r * 0.72); ctx.closePath(); break;
    case 'triangle-down':
      ctx.moveTo(x, y + r);
      ctx.lineTo(x + r * 0.9, y - r * 0.72);
      ctx.lineTo(x - r * 0.9, y - r * 0.72); ctx.closePath(); break;
    case 'star':
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const ai = a + Math.PI / 5;
        const ox = x + r * Math.cos(a), oy = y + r * Math.sin(a);
        const ix = x + r * 0.42 * Math.cos(ai), iy = y + r * 0.42 * Math.sin(ai);
        if (i === 0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
        ctx.lineTo(ix, iy);
      } ctx.closePath(); break;
    case 'hexagon':
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        const hx = x + r * Math.cos(a), hy = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
      } ctx.closePath(); break;
    case 'pentagon':
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      } ctx.closePath(); break;
    default: // circle
      ctx.arc(x, y, r, 0, Math.PI * 2);
  }
}

function shapeToSVG(shape, color, sz = 12) {
  const c = sz / 2, r = sz / 2;
  let inner = '';
  switch (shape) {
    case 'diamond':
      inner = `<polygon points="${c},0 ${sz},${c} ${c},${sz} 0,${c}" fill="${color}"/>`; break;
    case 'square': {
      const s = r * 0.82;
      inner = `<rect x="${c-s}" y="${c-s}" width="${s*2}" height="${s*2}" fill="${color}"/>`; break;
    }
    case 'triangle':
      inner = `<polygon points="${c},0 ${sz},${sz} 0,${sz}" fill="${color}"/>`; break;
    case 'triangle-down':
      inner = `<polygon points="${c},${sz} ${sz},0 0,0" fill="${color}"/>`; break;
    case 'star': {
      let pts = '';
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        const ai = a + Math.PI / 5;
        pts += `${c + r*Math.cos(a)},${c + r*Math.sin(a)} `;
        pts += `${c + r*0.42*Math.cos(ai)},${c + r*0.42*Math.sin(ai)} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}"/>`; break;
    }
    case 'hexagon': {
      let pts = '';
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        pts += `${c + r*Math.cos(a)},${c + r*Math.sin(a)} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}"/>`; break;
    }
    case 'pentagon': {
      let pts = '';
      for (let i = 0; i < 5; i++) {
        const a = (i * 2 * Math.PI / 5) - Math.PI / 2;
        pts += `${c + r*Math.cos(a)},${c + r*Math.sin(a)} `;
      }
      inner = `<polygon points="${pts.trim()}" fill="${color}"/>`; break;
    }
    default:
      inner = `<circle cx="${c}" cy="${c}" r="${r}" fill="${color}"/>`;
  }
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" style="overflow:visible">${inner}</svg>`;
}

const WORLD_BOUNDS = [[-90, -180], [90, 180]];
// Calculate zoom so world fills container WIDTH exactly
// At zoom z, world = 256*2^z px wide → z = log2(containerWidth/256)
function mapWidthZoom() {
  return Math.log2(document.getElementById('map').offsetWidth / 256);
}

function updateMap(ev) {
  if (mapMarker) { leafMap.removeLayer(mapMarker); mapMarker = null; }
  const hint = document.getElementById('mapHint');
  if (!ev || !ev.loc) { hint.classList.remove('hidden'); return; }
  hint.classList.add('hidden');
  const [lat, lng, zoom] = ev.loc;
  const color = (CATS[ev.cat] || { color:'#6366f1' }).color;
  const icon = L.divIcon({
    className:'',
    html:`<div class="hist-marker" style="background:${color}"></div>`,
    iconSize:[14,14], iconAnchor:[7,7],
  });
  mapMarker = L.marker([lat,lng],{icon}).addTo(leafMap);
  // If regions exist, fit bounds to show all of them; otherwise flyTo the point
  const regions = EVENT_REGIONS[ev.id];
  if (regions && regions.length > 1) {
    const allPts = regions.map(r => [r.lat, r.lng]);
    allPts.push([lat, lng]);
    leafMap.flyToBounds(L.latLngBounds(allPts).pad(0.3), { duration: 0.9, maxZoom: zoom });
  } else {
    leafMap.flyTo([lat,lng], zoom, { duration:0.9 });
  }
}

function clearMapMarker() {
  if (mapMarker) { leafMap.removeLayer(mapMarker); mapMarker = null; }
  document.getElementById('mapHint').classList.remove('hidden');
}

function updateMapRegions(ev) {
  clearMapRegions();
  const regions = EVENT_REGIONS[ev.id];
  if (!regions || !regions.length) {
    document.getElementById('panelRegions').innerHTML = '';
    return;
  }
  // Draw circles on the map
  regions.forEach(r => {
    const circle = L.circle([r.lat, r.lng], {
      radius: r.radius * 1000, // km to meters
      color: r.color,
      fillColor: r.color,
      fillOpacity: 0.12,
      weight: 1.5,
      opacity: 0.6,
      dashArray: '6 4',
    }).addTo(leafMap);
    // Add a label tooltip
    circle.bindTooltip(r.label, {
      permanent: true, direction: 'center',
      className: 'region-tooltip',
    });
    mapRegionLayers.push(circle);
  });

  // Show legend in panel
  document.getElementById('panelRegions').innerHTML = `
    <div class="psect">Regions</div>
    <div class="region-legend">
      ${regions.map(r => `
        <div class="region-legend-item">
          <div class="region-legend-swatch" style="background:${r.color}40;border-color:${r.color}"></div>
          <span>${r.label}</span>
        </div>`).join('')}
    </div>`;
}

function clearMapRegions() {
  mapRegionLayers.forEach(l => leafMap.removeLayer(l));
  mapRegionLayers = [];
}

// ── Map resize handle ──
const mapEl     = document.getElementById('map');
const mapHandle = document.getElementById('mapResizeHandle');
let mapResizing = false, mapResizeY0 = 0, mapResizeH0 = 0;

mapHandle.addEventListener('mousedown', e => {
  e.preventDefault();
  mapResizing = true; mapResizeY0 = e.clientY; mapResizeH0 = mapEl.offsetHeight;
  mapHandle.classList.add('dragging');
  document.body.style.cursor = 'ns-resize';
});
window.addEventListener('mousemove', e => {
  if (!mapResizing) return;
  const newH = Math.max(60, Math.min(600, mapResizeH0 + (e.clientY - mapResizeY0)));
  mapEl.style.height = newH + 'px';
  leafMap.invalidateSize();
  resize();
});
window.addEventListener('mouseup', () => {
  if (mapResizing) {
    mapResizing = false;
    mapHandle.classList.remove('dragging');
    document.body.style.cursor = '';
  }
});
